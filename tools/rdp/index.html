<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Backtracking recursive-descent parser: the procedures generated from a grammar, and the search for a parse with its guesses and backtracking, step by step." />
    <title>Backtracking Recursive Descent | Parser Tools</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=36f52b82" />
    <link rel="stylesheet" href="../../shared/ui.css?v=fb381b22" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-grammar { --pw: 230; --pmin: 170px; }
      #p-code { --pw: 400; --pmin: 250px; }
      #p-search { --pw: 740; --pmin: 320px; }

      /* What the current step is about is marked by a copy of the text behind the (transparent) textarea */
      #grammar-field { position: relative; flex: 1; min-height: 0; display: flex; }
      #grammar-input, #grammar-hl { box-sizing: border-box; width: 100%; font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.75; padding: var(--sp-5); overflow-wrap: break-word; white-space: pre-wrap; }
      #grammar-input { position: relative; }
      #grammar-hl { position: absolute; inset: 0; color: transparent; overflow: hidden; pointer-events: none; }
      #grammar-hl .gh-gone { background: var(--bg-hover); }
      #grammar-hl .gh-lhs, #grammar-hl .gh-rhs { background: var(--st-active-bg); }
      #grammar-hl .gh-hot { background: var(--hot-bg); }
      #grammar-hl .gh-done { background: var(--st-accept-bg); }
      #grammar-hl .gh-sym { background: color-mix(in srgb, var(--st-active) 38%, transparent); }
      #grammar-hl .gh-sym.gh-good { background: color-mix(in srgb, var(--st-accept) 38%, transparent); }
      #grammar-hl .gh-sym.gh-bad { background: color-mix(in srgb, var(--st-reject) 38%, transparent); }
      #grammar-hl .gh-sym.gh-warn { background: color-mix(in srgb, var(--st-warn) 38%, transparent); }

      #grammar-note {
        flex-shrink: 0;
        padding: 0 var(--sp-5) var(--sp-4);
        font-family: var(--font-serif);
        font-style: italic;
        font-size: var(--fs-xs);
        line-height: 1.5;
        color: var(--text-dim);
      }
      #grammar-note:empty { display: none; }

      /* ── Procedures ── */
      #mode-bar { flex-wrap: wrap; }
      #mode-hint { flex-shrink: 0; border-top: 1px solid var(--border-lo); border-bottom: 0; }
      #code { padding: var(--sp-4) 0 var(--sp-6); font-family: var(--font-serif); font-size: var(--fs-sm); color: var(--text); }
      .rdp-proc { margin: 0 var(--sp-5) var(--sp-5); border-top: 1.5px solid var(--text); border-bottom: 1.5px solid var(--text); padding: var(--sp-2) 0; }
      /* Alternating faint shading, so that where one procedure ends and the next begins reads at a glance */
      .rdp-proc:nth-child(even) { background: color-mix(in srgb, var(--text) 4%, transparent); }
      #gen-bar .ui-label { flex-shrink: 0; }
      #gen-log { min-height: 2.6em; }
      .rdp-line {
        padding: 0 var(--sp-3) 0 calc(var(--sp-3) + var(--ind) * 1.4em);
        border-left: 2px solid transparent;
        line-height: 1.8;
        white-space: pre;
      }
      .rdp-line .kw { font-variant: small-caps; letter-spacing: 0.04em; }
      .rdp-line .nt { color: var(--accent); }
      .rdp-line .t { font-weight: 600; }
      .rdp-line .cm { color: var(--text-lo); font-style: italic; font-size: 0.88em; }
      .rdp-line.is-wait { background: var(--bg-cell); border-left-color: var(--border-hi); }
      .rdp-line.is-now { background: var(--st-active-bg); border-left-color: var(--st-active); }
      .rdp-line.is-now.is-good { background: var(--st-accept-bg); border-left-color: var(--st-accept); }
      .rdp-line.is-now.is-bad { background: var(--st-reject-bg); border-left-color: var(--st-reject); }
      .rdp-line.is-now.is-warn { background: var(--st-warn-bg); border-left-color: var(--st-warn); }
      /* How far each call on the stack has got: symbols already matched, alternatives given up */
      .rdp-line.is-done { box-shadow: inset -3px 0 0 var(--st-accept); }
      .rdp-line.is-gone, .rdp-line.is-gone .nt, .rdp-line.is-gone .t, .rdp-line.is-gone .kw { color: var(--st-dead); }
      .rdp-line.is-new { background: var(--st-active-bg); border-left-color: var(--st-active); }
      .rdp-line.is-hot { background: var(--hot-bg); border-left-color: var(--hot); }

      /* ── Input, position curve, counters ── */
      #rdp-view { flex-shrink: 0; border-bottom: 1.5px solid var(--border-hi); background: var(--bg-panel); }
      .rdp-row { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-2) var(--sp-5); }
      .rdp-row + .rdp-row { border-top: 1px solid var(--border-lo); }
      .rdp-row > .ui-label { width: 48px; flex-shrink: 0; }
      #rdp-strip { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); min-height: 24px; }
      .tok.rdp-read { background: var(--st-active-bg); border-color: var(--st-active); color: var(--st-active); }
      .tok.is-hot { background: var(--hot-bg); border-color: var(--hot); color: var(--hot); }
      #rdp-chart { flex: 1; min-width: 0; height: 56px; display: block; cursor: pointer; touch-action: none; }
      #rdp-chart .c-axis { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
      #rdp-chart .c-label { fill: var(--text-lo); font-family: var(--font-mono); font-size: 9px; }
      #rdp-chart .c-line { fill: none; stroke-width: 1.5; }
      #rdp-chart .c-done { stroke: var(--accent); }
      #rdp-chart .c-todo { stroke: var(--border-hi); }
      #rdp-chart .c-back { fill: var(--st-warn); }
      #rdp-chart .c-now { fill: var(--accent); stroke: var(--bg); stroke-width: 1.5; }
      #rdp-stats { gap: var(--sp-5); flex-wrap: wrap; font-family: var(--font-serif); font-size: var(--fs-xs); color: var(--text-dim); }
      #rdp-stats b { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
      #rdp-stats label { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); cursor: pointer; }
      #rdp-stats input { accent-color: var(--accent); cursor: pointer; }

      /* ── Search tree ── */
      #tree-wrap { min-height: 120px; }
      #tree-svg { cursor: grab; }
      .rdp-n { cursor: pointer; }
      .rdp-n rect { fill: var(--bg); stroke: var(--border-hi); stroke-width: 1.4; }
      .rdp-n text { font-family: var(--font-serif); font-size: var(--fs-sm); fill: var(--text); text-anchor: middle; pointer-events: none; }
      .rdp-n.k-tok text { fill: var(--text-dim); }
      .rdp-n.st-open rect { stroke: var(--st-active); fill: var(--st-active-bg); }
      .rdp-n.st-ok rect { stroke: var(--st-accept); fill: var(--st-accept-bg); }
      .rdp-n.st-fail rect { stroke: var(--st-reject); fill: var(--st-reject-bg); }
      .rdp-n.st-dead rect { stroke: var(--st-dead); fill: var(--bg-cell); stroke-dasharray: 3 2; }
      .rdp-n.st-dead text { fill: var(--st-dead); }
      .rdp-n.is-active rect { stroke-width: 3; }
      .rdp-n.is-sel rect { stroke-width: 3; stroke-dasharray: none; }
      .rdp-n.is-hot rect { stroke: var(--hot); fill: var(--hot-bg); }
      .rdp-e { fill: none; stroke: var(--border-hi); stroke-width: 1.3; }
      .rdp-e.e-dead { stroke: var(--st-dead); stroke-dasharray: 3 3; }
      /* The number of the alternative a branch belongs to, on the first edge of that alternative */
      .rdp-el { font-family: var(--font-serif); font-size: var(--fs-xs); fill: var(--text-dim); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; cursor: default; }
      .rdp-el.e-dead { fill: var(--st-dead); }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>Backtracking Recursive Descent</h1>
    </div>

    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="3">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-grammar');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <div id="grammar-field">
            <div id="grammar-hl" aria-hidden="true"></div>
            <textarea id="grammar-input" spellcheck="false" placeholder="S -> a S b | eps"></textarea>
          </div>
          <div id="grammar-note"></div>
          <div id="grammar-footer">
            <div id="error-msg"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. Procedures -->
      <div class="panel" id="p-code" data-priority="2">
        <div class="panel-header">
          <span class="panel-title">Procedures</span>
          <button class="algo-btn" onclick="event.stopPropagation(); openAlgoModal();" title="How the procedures are generated from the grammar">Algorithm</button>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-code');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="mode-bar" class="ui-bar">
            <div class="ui-field">
              <span>Backtracking:</span>
              <label title="Every procedure yields all the positions where it can end, and is asked again when the rest of the parse fails">
                <input type="radio" name="rdp-mode" value="full" checked /> complete
              </label>
              <label title="The first alternative that matches is final; it is never revisited (as in PEG parsers)">
                <input type="radio" name="rdp-mode" value="ordered" /> ordered choice
              </label>
              <label title="Ordered choice that remembers the result of each nonterminal at each position and reuses it instead of parsing it again">
                <input type="radio" name="rdp-mode" value="packrat" /> packrat
              </label>
            </div>
          </div>
          <div id="gen-bar" class="ui-bar">
            <span class="ui-label" title="Build the procedures one line at a time, as the algorithm generates them from the grammar">Build</span>
            <div class="step-group">
              <button class="btn icon-restart" id="btn-gen-reset" onclick="gen.reset()" title="Empty the listing and start building it" disabled></button>
              <button class="btn" id="btn-gen-back" onclick="gen.prev()" disabled>&#8249; Back</button>
              <button class="btn primary" id="btn-gen-step" onclick="gen.next()" disabled>Step &#8250;</button>
              <button class="btn icon-run-all" id="btn-gen-all" onclick="gen.end()" title="Build everything" disabled></button>
            </div>
          </div>
          <div id="gen-log" class="ui-logbar"></div>
          <div id="code-scroll" class="ui-scroll" style="padding: 0">
            <div id="code"><div class="ui-empty">Enter a grammar.</div></div>
          </div>
          <div id="mode-hint" class="ui-footer"><span class="ui-hint" id="mode-hint-text"></span></div>
        </div>
      </div>

      <div class="resize-handle" id="rh-2"></div>

      <!-- 3. Search -->
      <div class="panel" id="p-search" data-priority="4">
        <div class="panel-header">
          <span class="panel-title">Parsing</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-search');">&#8250;</button>
        </div>
        <div class="panel-body">
          <div class="ui-sim">
            <div class="ui-sim__row">
              <div class="input-group">
                <input id="sim-input" class="ui-input ui-input--lg" type="text" spellcheck="false" />
              </div>
              <div class="step-group">
                <button class="btn icon-restart" id="btn-sim-reset" onclick="sim.reset()" title="Restart" disabled></button>
                <button class="btn" id="btn-sim-back" onclick="sim.prev()" disabled>&#8249; Back</button>
                <button class="btn primary" id="btn-sim-step" onclick="sim.next()" disabled>Step &#8250;</button>
                <button class="btn icon-run-all" id="btn-sim-all" onclick="sim.end()" title="Run to the end" disabled></button>
              </div>
            </div>
            <div id="sim-log-bar" class="ui-logbar"></div>
          </div>
          <div id="sim-result" class="ui-result"></div>
          <div id="rdp-view">
            <div class="rdp-row"><span class="ui-label">Input</span><div id="rdp-strip"></div></div>
            <div class="rdp-row"><span class="ui-label" title="How many tokens have been read, over the steps of the run">Position</span><svg id="rdp-chart"><title></title></svg></div>
            <div class="rdp-row" id="rdp-stats">
              <span>step <b id="st-step">0</b></span>
              <span>calls <b id="st-calls">0</b></span>
              <span>backtracks <b id="st-back">0</b></span>
              <span id="st-memo-wrap" hidden>memo hits <b id="st-memo">0</b></span>
              <span>depth <b id="st-depth">0</b></span>
              <label title="Keep the attempts that backtracking undid in the tree, greyed out"><input type="checkbox" id="show-dead" checked /> show abandoned attempts</label>
            </div>
          </div>
          <div id="tree-wrap" class="ui-canvas">
            <svg id="tree-svg"><g id="tree-root"></g></svg>
            <div id="tree-empty" class="ui-canvas__empty">Step through a run to grow the search tree.</div>
          </div>
          <div id="tree-info" class="ui-explain" hidden></div>
        </div>
      </div>
    </div>
    <!-- #panels -->

    <!-- Algorithm modal -->
    <div class="algo-overlay hidden" id="algo-overlay" tabindex="-1" onclick="if (event.target === this) closeAlgoModal();">
      <div class="algo-modal" role="dialog" aria-modal="true" aria-labelledby="algo-title">
        <div class="algo-modal-head">
          <h2 id="algo-title"></h2>
          <span class="algo-subtitle" id="algo-subtitle"></span>
          <button class="algo-close" onclick="closeAlgoModal()" title="Close (Esc)">&#x2715;</button>
        </div>
        <div class="algo-modal-body" id="algo-body"></div>
      </div>
    </div>

    <script src="../../shared/algo/grammar.js?v=9c5bd0d1"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=e7dd4a97"></script>
    <script src="../../shared/algo/strings.js?v=23796ffe"></script>
    <script src="../../shared/algo/rdp.js?v=5a7e9a43"></script>
    <script src="../../shared/shared.js?v=886cba52"></script>
    <script src="../../shared/fit-view.js?v=9af2be16"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=eada4185"></script>
    <script src="guide.js?v=ffa73026"></script>
    <script src="../../shared/guide.js?v=98cfe80c"></script>
    <script src="../../shared/stepper.js?v=b99ccf2b"></script>
    <script>
      initResize("rh-1", "p-grammar", +1);
      initResize("rh-2", "p-code", +1);

      const EXAMPLES = {};
      const $ = (id) => document.getElementById(id);

      let rdG = null; // the parsed grammar, or null
      let rdTrace = null; // the recorded run
      let rdMode = "full";
      let rdStrings = []; // example strings of the loaded example, offered in the string input's menu
      let rdSel = null; // id of the node whose explanation is open
      let rdSelStep = null; // step it was opened at: stepping or editing closes it
      let rdHot = null; // { nodes: Set, lines: Set, span: [from, to] | null }: what the pointer is on
      let rdSrc = ""; // the grammar text rdG was parsed from, and where its productions sit in it
      let rdSpans = [];
      let rdLines = new Map(); // code-line key -> element
      let rdLineList = []; // the same elements in listing order, and what each line is for
      let rdLineInfo = [];
      let rdGenTouched = false; // the user has used the build stepper
      let rdState = null; // rdpStateAt for the current step

      // A memo hit is green when it answers with a match and red when with a failure.
      const toneOf = (ev) => (ev.kind === "memo" ? (ev.set[0][1] === "ok" ? "is-good" : "is-bad") : rdTone[ev.kind]);
      const rdToneClass = { "is-good": "gh-good", "is-bad": "gh-bad", "is-warn": "gh-warn" };
      const rdTone = { mismatch: "is-bad", fail: "is-bad", loop: "is-bad", reject: "is-warn", yield: "is-good", match: "" };
      const MODE_HINT = {
        full: "Each procedure yields every position where it can end. When the rest of the parse fails, control returns into it for the next one, so a parse is found whenever there is one.",
        ordered: "Each procedure returns the end of its first alternative that matches. That choice is final: it is never revisited, so some strings of the language are rejected.",
        packrat: "Ordered choice with a memo table: the result of every nonterminal at every position is remembered, and a repeated call is answered from the table. The verdicts are those of ordered choice; only the repeated work goes.",
      };

      // ── Build ─────────────────────────────────────────────────
      function setError(msg) {
        $("error-msg").textContent = msg || "";
      }

      function build() {
        try {
          rdSrc = $("grammar-input").value;
          rdG = rdpParseGrammar(rdSrc);
          rdSpans = rdpRuleSpans(rdSrc);
          setError("");
        } catch (e) {
          rdG = null;
          setError(e.message);
        }
        const rec = rdG ? rdpLeftRecursive(rdG) : [];
        $("grammar-note").textContent = rec.length
          ? "Left-recursive: " + rec.join(", ") + ". A top-down parser would call itself forever there; the run stops at the first repeat."
          : "";
        renderCode();
        run();
        saveShare();
      }

      function renderCode() {
        rdLines = new Map();
        rdLineList = [];
        rdLineInfo = [];
        rdGenTouched = false;
        const box = $("code");
        $("mode-hint-text").textContent = MODE_HINT[rdMode];
        if (!rdG) { box.innerHTML = '<div class="ui-empty">Enter a grammar.</div>'; gen.pos = 0; renderGen(); gen.refresh(); return; }
        box.innerHTML = rdpProcedures(rdG, rdMode).map((p) =>
          '<div class="rdp-proc">' + p.lines.map((l) =>
            '<div class="rdp-line" style="--ind:' + l.indent + '">' +
            l.segs.map((s) => (s[0] ? '<span class="' + s[0] + '">' + esc(s[1]) + "</span>" : esc(s[1]))).join("") + "</div>"
          ).join("") + "</div>"
        ).join("");
        // Elements are matched to their keys in the same order.
        const els = box.querySelectorAll(".rdp-line");
        let n = 0;
        for (const p of rdpProcedures(rdG, rdMode)) for (const l of p.lines) { els[n].dataset.key = l.key; rdLineInfo.push(l); rdLineList.push(els[n]); rdLines.set(l.key, els[n++]); }
        gen.pos = rdLineList.length; // the listing starts out complete
        renderGen();
        gen.refresh();
      }

      // ── Building the procedures step by step ──
      const gen = createStepper({
        buttons: { reset: "btn-gen-reset", back: "btn-gen-back", step: "btn-gen-step", all: "btn-gen-all" },
        min: 0,
        last: () => (rdLineList.length ? rdLineList.length : null),
        onChange: () => { rdGenTouched = true; renderGen(); },
      });
      function renderGen() {
        const total = rdLineList.length;
        rdLineList.forEach((el, i) => { el.hidden = i >= gen.pos; });
        document.querySelectorAll("#code .rdp-proc").forEach((p) => { p.hidden = p.firstElementChild.hidden; });
        const log = UI.logBar("gen-log");
        if (!rdGenTouched) log.clear();
        else if (gen.pos === 0) log.set("Nothing generated yet. <b>Step ›</b> emits the first line.");
        else if (gen.pos === total) log.set("Done: " + total + " lines for " + rdG.order.length + " procedure" + (rdG.order.length === 1 ? "" : "s") + ".");
        else log.set(esc(rdLineInfo[gen.pos - 1].note));
        paintCode();
        paintGrammar();
        if (rdGenTouched && gen.pos > 0 && gen.pos < total) scrollCodeTo([rdLineInfo[gen.pos - 1].key]);
      }

      // Mark in the grammar text what the current step is about: the production (left side and
      // right side) of the line being executed or generated, and the symbol itself; hovered lines
      // in the hover colour. Only while the text is still the one the procedures were made from.
      function paintGrammar() {
        const hl = $("grammar-hl"), text = $("grammar-input").value;
        if (!rdG || text !== rdSrc) { hl.innerHTML = ""; return; }
        const cls = new Array(text.length).fill("");
        const mark = (ranges, role, extra) => { for (const r of ranges) for (let i = r.from; i < r.to; i++) cls[i] += " gh-" + (role || r.role) + (extra && r.role === "sym" ? " " + extra : ""); };
        const building = rdGenTouched && gen.pos > 0 && gen.pos < rdLineList.length;
        const ev = rdState && rdState.event;
        const nowKey = building ? rdLineInfo[gen.pos - 1].key : ev ? ev.line : null;
        const fk = !building && frameKey(ev);
        if (fk) mark(rdpFrameRanges(rdG, rdSpans, fk), null);
        if (rdHot) for (const k of rdHot.lines) mark(rdpGrammarRanges(rdG, rdSpans, k).filter((r) => r.role !== "sym"), "hot");
        if (nowKey) {
          const tone = !building && ev ? rdToneClass[toneOf(ev)] : "";
          for (const r of rdpGrammarRanges(rdG, rdSpans, nowKey)) mark([r], r.role, tone);
        }
        let h = "", i = 0;
        while (i < text.length) {
          let j = i + 1;
          while (j < text.length && cls[j] === cls[i]) j++;
          const piece = esc(text.slice(i, j));
          h += cls[i] ? '<span class="' + cls[i].trim() + '">' + piece + "</span>" : piece;
          i = j;
        }
        hl.innerHTML = h;
        hl.scrollTop = $("grammar-input").scrollTop;
      }
      (function keepGrammarHighlightScrolled() {
        const input = $("grammar-input");
        for (const ev of ["input", "keyup", "scroll", "mouseup"]) input.addEventListener(ev, () => { $("grammar-hl").scrollTop = input.scrollTop; });
        input.addEventListener("input", paintGrammar); // typing: the highlight is dropped until the grammar is rebuilt
      })();

      // Bring the lines into view in the code panel (only when they are not already), with a little context.
      function scrollCodeTo(keys) {
        const els = [...keys].map((k) => rdLines.get(k)).filter((e) => e && !e.hidden);
        if (!els.length) return;
        const box = $("code-scroll"), br = box.getBoundingClientRect();
        const rect = (e) => e.getBoundingClientRect();
        let top = Math.min(...els.map((e) => rect(e).top)) - br.top;
        let bottom = Math.max(...els.map((e) => rect(e).bottom)) - br.top;
        const h = box.clientHeight, margin = 12, context = 24;
        if (bottom - top > h - 2 * margin) { top = rect(els[0]).top - br.top; bottom = rect(els[0]).bottom - br.top; } // too tall: the first line
        if (top < margin) box.scrollTop += top - margin - context;
        else if (bottom > h - margin) box.scrollTop += bottom - h + margin + context;
      }

      function run() {
        rdSel = null;
        rdView.release();
        rdTrace = rdG ? rdpRun(rdG, rdpTokenise(rdG, $("sim-input").value), { mode: rdMode }) : null;
        sim.pos = -1;
        render();
        sim.refresh();
      }

      // ── Rendering ─────────────────────────────────────────────
      function render() {
        if (rdSel !== null && sim.pos !== rdSelStep) rdSel = null;
        rdState = rdTrace ? rdpStateAt(rdTrace, sim.pos) : null;
        renderLog();
        renderStrip();
        renderChart();
        renderStats();
        paintCode();
        drawSearchTree();
        renderInfo();
        applyHot();
      }

      function renderLog() {
        const log = UI.logBar("sim-log-bar");
        const verdict = UI.banner("sim-result");
        if (!rdTrace) { log.clear(); verdict.hide(); return; }
        const ev = rdState.event;
        if (!ev) {
          log.set("Press <b>Step ›</b> to start: " + esc(rdG.start) + " is called at position 0.");
          verdict.hide();
          return;
        }
        log.set(esc(ev.text));
        if (sim.pos === rdTrace.events.length - 1) {
          if (rdTrace.accepted) verdict.show("accept", "✓  ACCEPTED");
          else if (rdTrace.aborted === "left-recursion") verdict.show("warn", "⚠ LEFT RECURSION: would not terminate");
          else if (rdTrace.aborted === "limit") verdict.show("warn", "⚠  STOPPED: too large to follow");
          else verdict.show("reject", "✗  REJECTED");
        } else verdict.hide();
      }

      function renderStrip() {
        const strip = $("rdp-strip");
        if (!rdTrace) { strip.innerHTML = ""; return; }
        const toks = rdTrace.tokens;
        const pos = rdState.pos;
        strip.innerHTML = toks.map((t, i) => '<span class="tok' + (i < pos ? " rdp-read" : i === pos ? " current" : "") + '" data-i="' + i + '">' + esc(t) + "</span>").join("") +
          '<span class="tok eof' + (pos === toks.length ? " current" : "") + '" data-i="' + toks.length + '" title="end of the input">' + (toks.length ? "⊣" : "ε ⊣") + "</span>";
      }

      function renderStats() {
        const total = rdTrace ? rdTrace.events.length : 0;
        $("st-step").textContent = (sim.pos + 1) + " / " + total;
        $("st-calls").textContent = rdState ? rdState.calls : 0;
        $("st-back").textContent = rdState ? rdState.backtracks : 0;
        $("st-memo-wrap").hidden = rdMode !== "packrat";
        $("st-memo").textContent = rdState ? rdState.memoHits : 0;
        $("st-depth").textContent = rdState ? rdState.maxDepth : 0;
      }

      // The read position over the steps: every drop is a backtrack. Click or drag to move.
      const SVGNS = "http://www.w3.org/2000/svg";
      function renderChart() {
        const svg = $("rdp-chart");
        const keep = svg.querySelector("title");
        svg.textContent = "";
        svg.appendChild(keep);
        if (!rdTrace || !rdTrace.events.length) return;
        const W = svg.clientWidth || 400, H = 56, L = 16, R = 6, T = 6, B = 6;
        const ev = rdTrace.events, N = ev.length, n = rdTrace.tokens.length;
        const x = (s) => L + (W - L - R) * (N > 1 ? s / (N - 1) : 0);
        const y = (p) => H - B - (H - T - B) * (n ? p / n : 0);
        const mk = (name, attrs) => { const e = document.createElementNS(SVGNS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
        mk("line", { class: "c-axis", x1: L, x2: W - R, y1: y(n), y2: y(n) });
        mk("line", { class: "c-axis", x1: L, x2: W - R, y1: y(0), y2: y(0) });
        const t0 = mk("text", { class: "c-label", x: 2, y: y(0) + 3 }); t0.textContent = "0";
        const tn = mk("text", { class: "c-label", x: 2, y: y(n) + 3 }); tn.textContent = n;
        const pts = (a, b) => { const o = []; for (let s = a; s <= b; s++) o.push(x(s).toFixed(1) + "," + y(ev[s].pos).toFixed(1)); return o.join(" "); };
        const cur = Math.min(sim.pos, N - 1);
        if (cur < N - 1) mk("polyline", { class: "c-line c-todo", points: pts(Math.max(cur, 0), N - 1) });
        if (cur >= 0) mk("polyline", { class: "c-line c-done", points: pts(0, cur) });
        for (let s = 0; s <= cur; s++) {
          if (ev[s].kind === "reject" || (ev[s].kind === "try" && ev[s].altIdx > 0)) mk("circle", { class: "c-back", cx: x(s), cy: y(ev[s].pos), r: 2.6 });
        }
        if (cur >= 0) mk("circle", { class: "c-now", cx: x(cur), cy: y(ev[cur].pos), r: 4 });
      }
      (function () {
        const svg = $("rdp-chart");
        const stepAt = (e) => {
          if (!rdTrace) return null;
          const r = svg.getBoundingClientRect(), N = rdTrace.events.length;
          const f = (e.clientX - r.left - 16) / Math.max(1, r.width - 22);
          return Math.max(0, Math.min(N - 1, Math.round(f * (N - 1))));
        };
        let down = false;
        svg.addEventListener("pointerdown", (e) => { down = true; svg.setPointerCapture(e.pointerId); const s = stepAt(e); if (s !== null) sim.go(s); });
        svg.addEventListener("pointerup", () => { down = false; });
        svg.addEventListener("pointermove", (e) => {
          const s = stepAt(e);
          if (s === null) return;
          svg.querySelector("title").textContent = "step " + (s + 1) + ": " + rdTrace.events[s].text;
          if (down) sim.go(s);
        });
        new ResizeObserver(() => renderChart()).observe(svg);
      })();

      // The call whose progress the code and the grammar show: the one the step is in; for a new call
      // (its first line is only the heading) the call site in its caller. Progress of every call on the
      // stack at once would be ambiguous when a procedure calls itself.
      function frameKey(ev) {
        if (!ev) return null;
        const kp = rdpKeyParts(ev.line);
        return kp && kp.part !== "head" && kp.part !== "memo" ? ev.line : rdpPendingLines(rdTrace, ev)[0] || null;
      }

      function paintCode() {
        rdLines.forEach((el) => { el.className = "rdp-line"; });
        if (rdGenTouched && gen.pos > 0 && gen.pos < rdLineList.length) { rdLineList[gen.pos - 1].classList.add("is-new"); return; } // building: the listing is not complete
        const ev = rdState && rdState.event;
        if (!ev) return;
        for (const k of rdpPendingLines(rdTrace, ev)) if (rdLines.has(k)) rdLines.get(k).classList.add("is-wait");
        const fk = frameKey(ev);
        if (fk) {
          const fl = rdpFrameLines(rdG, fk);
          for (const d of fl.done) if (rdLines.has(d)) rdLines.get(d).classList.add("is-done");
          for (const d of fl.gone) if (rdLines.has(d)) rdLines.get(d).classList.add("is-gone");
        }
        const now = ev.line && rdLines.get(ev.line);
        if (now) {
          now.classList.remove("is-wait");
          now.classList.add("is-now");
          if (toneOf(ev)) now.classList.add(toneOf(ev));
          scrollCodeTo([ev.line]);
        }
      }

      // ── Search tree ───────────────────────────────────────────
      const NODE_H = { call: 28, tok: 26 };
      function nodeLabel(nd) {
        return nd.kind === "call" ? nd.nt + (nd.memo ? " ↺" : "") : nd.sym; // ↺: answered from the memo table
      }
      function nodeWidth(nd) {
        return Math.max(30, 9 * nodeLabel(nd).length + 20);
      }

      // Pan/zoom and fit-to-view for the tree (see shared/fit-view.js): it refits as the search tree grows.
      const rdView = createFitView({ svg: "tree-svg", root: "tree-root", scaleExtent: [0.08, 3], maxScale: 1, pad: 12, hasContent: () => !!rdTrace });
      d3.select("#tree-svg").on("click", () => { if (rdSel !== null) selectNode(rdSel); });

      function drawSearchTree() {
        const g = d3.select("#tree-root");
        g.selectAll("*").remove();
        const empty = $("tree-empty");
        if (!rdTrace || !rdState) { empty.style.display = ""; return; }
        const showDead = $("show-dead").checked;
        const st = rdState.status;
        const kids = new Map();
        const altOf = new Map(); // first child of an alternative -> the alternative, for the label on its edge
        const seenAlt = new Set();
        let root = null;
        for (const nd of rdTrace.nodes) {
          const s = st[nd.id];
          if (nd.kind === "alt" || !s || (!showDead && s.st === "dead")) continue;
          if (nd.parent < 0) { root = nd; continue; }
          // The alternatives of a nonterminal are not nodes of their own: their symbols hang off the call.
          const up = rdTrace.nodes[nd.parent];
          const owner = up.kind === "alt" ? up.parent : up.id;
          if (up.kind === "alt" && !seenAlt.has(up.id)) { seenAlt.add(up.id); altOf.set(nd.id, up); }
          if (!kids.has(owner)) kids.set(owner, []);
          kids.get(owner).push(nd);
        }
        if (!root) { empty.style.display = ""; return; }
        empty.style.display = "none";
        const h = d3.hierarchy(root, (d) => kids.get(d.id) || []);
        d3.tree().nodeSize([40, 66]).separation((a, b) => Math.max(0.9, (nodeWidth(a.data) + nodeWidth(b.data)) / 2 / 40 + 0.2))(h);
        const active = rdState.event ? rdState.event.node : -1;
        const ends = (l) => ({ y1: l.source.y + NODE_H[l.source.data.kind] / 2, y2: l.target.y - NODE_H[l.target.data.kind] / 2 });
        g.append("g").selectAll("path").data(h.links()).join("path")
          .attr("class", (l) => "rdp-e" + (st[l.target.data.id].st === "dead" ? " e-dead" : ""))
          .attr("d", (l) => {
            const { y1, y2 } = ends(l), m = (y1 + y2) / 2;
            return "M" + l.source.x + "," + y1 + "C" + l.source.x + "," + m + " " + l.target.x + "," + m + " " + l.target.x + "," + y2;
          });
        g.append("g").selectAll("text").data(h.links().filter((l) => altOf.has(l.target.data.id))).join("text")
          .attr("class", (l) => "rdp-el" + (st[l.target.data.id].st === "dead" ? " e-dead" : ""))
          .attr("x", (l) => 0.216 * l.source.x + 0.784 * l.target.x) // the edge's point at t = 0.7
          .attr("y", (l) => { const { y1, y2 } = ends(l), m = (y1 + y2) / 2; return 0.027 * y1 + 0.441 * m + 0.343 * y2 + 0.189 * m; })
          .text((l) => altOf.get(l.target.data.id).alt + 1)
          .on("mouseenter", (e, l) => setHot(hotFromAlt(altOf.get(l.target.data.id))))
          .on("mouseleave", () => setHot(null))
          .append("title").text((l) => { const a = altOf.get(l.target.data.id); return "Alternative " + (a.alt + 1) + ": " + a.nt + " → " + (rdG.alts[a.nt][a.alt].rhs.join(" ") || "ε"); });
        const ns = g.append("g").selectAll("g").data(h.descendants()).join("g")
          .attr("class", (d) => "rdp-n k-" + d.data.kind + " st-" + st[d.data.id].st + (d.data.id === active ? " is-active" : "") + (d.data.id === rdSel ? " is-sel" : ""))
          .attr("data-id", (d) => d.data.id)
          .attr("transform", (d) => "translate(" + d.x + "," + d.y + ")")
          .on("click", (e, d) => { e.stopPropagation(); selectNode(d.data.id); })
          .on("mouseenter", (e, d) => setHot(hotFromNode(d.data.id)))
          .on("mouseleave", () => setHot(null));
        ns.append("rect").attr("rx", (d) => NODE_H[d.data.kind] / 2).attr("x", (d) => -nodeWidth(d.data) / 2).attr("y", (d) => -NODE_H[d.data.kind] / 2)
          .attr("width", (d) => nodeWidth(d.data)).attr("height", (d) => NODE_H[d.data.kind]);
        // dy centres the text on the node's middle line, which dominant-baseline does not do evenly across fonts
        ns.append("text").attr("dy", "0.35em").style("font-style", (d) => (d.data.eps ? "italic" : null)).text((d) => nodeLabel(d.data));
        rdView.refit();
      }

      // ── Selection and explanation ─────────────────────────────
      function selectNode(id) {
        rdSel = rdSel === id ? null : id;
        rdSelStep = sim.pos;
        drawSearchTree();
        renderInfo();
        if (rdSel !== null && rdState) scrollCodeTo(hotFromNode(rdSel).lines); // selecting a node shows its code
      }
      const ROLE = { open: ["live", "In progress"], ok: ["accepted", "Matched"], fail: ["rejected", "Failed"], dead: ["dead", "Undone"] };
      function renderInfo() {
        const e = rdSel !== null && rdState ? rdpExplainNode(rdG, rdTrace, rdState, rdSel) : null;
        if (!e) { UI.explain("tree-info", null); return; }
        UI.explain("tree-info", {
          title: e.title,
          onClose: () => selectNode(rdSel),
          facts: e.facts,
          lines: [UI.explainRole(ROLE[e.role][0], ROLE[e.role][1]) + " " + e.lines.join(" ")],
        });
      }

      // ── Linked hover: tree node <-> code line <-> input tokens ──
      function hotFromNode(id) {
        const nd = rdTrace.nodes[id], cur = rdState.status[id];
        const lines = new Set();
        if (nd.kind === "call") lines.add(rdpKey(nd.nt, "head")); // its own procedure first, then the line that called it
        if (nd.site) lines.add(nd.site);
        let to = cur && cur.end !== undefined ? cur.end : nd.kind === "tok" ? nd.i + 1 : Math.max(rdState.pos, nd.i);
        if (nd.eps) to = nd.i;
        return { nodes: new Set([id]), lines, span: [nd.i, to], scroll: true };
      }
      function hotFromAlt(alt) {
        const cur = rdState.status[alt.id];
        const nodes = new Set(rdTrace.nodes.filter((nd) => nd.parent === alt.id && rdState.status[nd.id]).map((nd) => nd.id));
        return { nodes, lines: new Set([rdpKey(alt.nt, "alt", alt.alt)]), span: [alt.i, cur && cur.end !== undefined ? cur.end : Math.max(rdState.pos, alt.i)], scroll: true };
      }
      function hotFromLine(key) {
        const nodes = new Set();
        for (const nd of rdTrace.nodes) {
          if (!rdState.status[nd.id]) continue;
          if (nd.site === key || (nd.kind === "call" && (rdpKey(nd.nt, "head") === key || rdpKey(nd.nt, "end") === key))) nodes.add(nd.id);
          // An alternative line stands for the symbols that were tried under it.
          else if (nd.kind === "alt" && rdpKey(nd.nt, "alt", nd.alt) === key) for (const c of rdTrace.nodes) if (c.parent === nd.id && rdState.status[c.id]) nodes.add(c.id);
        }
        return { nodes, lines: new Set([key]), span: null };
      }
      function setHot(h) {
        rdHot = h;
        applyHot();
        if (h && h.scroll) scrollCodeTo(h.lines); // hovering a tree node shows its code
      }
      function applyHot() {
        const h = rdHot;
        d3.selectAll("#tree-root .rdp-n").classed("is-hot", (d) => !!h && h.nodes.has(d.data.id));
        rdLines.forEach((el, key) => el.classList.toggle("is-hot", !!h && h.lines.has(key)));
        paintGrammar();
        document.querySelectorAll("#rdp-strip .tok").forEach((el) => {
          const i = +el.dataset.i;
          el.classList.toggle("is-hot", !!h && !!h.span && i >= h.span[0] && i < h.span[1]);
        });
      }
      UI.hoverItems("code", ".rdp-line", (el) => el.dataset.key, (key) => setHot(key && rdTrace && rdState ? hotFromLine(key) : null));

      // ── Controls ──────────────────────────────────────────────
      const sim = createStepper({
        buttons: { reset: "btn-sim-reset", back: "btn-sim-back", step: "btn-sim-step", all: "btn-sim-all" },
        min: -1,
        last: () => (rdTrace && rdTrace.events.length ? rdTrace.events.length - 1 : null),
        onChange: () => render(),
      });
      // ←/→ (or ,/.) step, Home restarts, End runs; the Parsing panel has key focus.
      registerStepper("p-code", { step: () => gen.next(), back: () => gen.prev(), reset: () => gen.reset(), end: () => gen.end() });
      registerStepper("p-search", { step: () => sim.next(), back: () => sim.prev(), reset: () => sim.reset(), end: () => sim.end() }, { primary: true });

      $("grammar-input").addEventListener("input", () => { clearTimeout(rdBuildTimer); rdBuildTimer = setTimeout(build, 300); });
      let rdBuildTimer = null;
      $("sim-input").addEventListener("input", () => { run(); saveShare(); });
      $("show-dead").addEventListener("change", () => { drawSearchTree(); applyHot(); });
      document.querySelectorAll('input[name="rdp-mode"]').forEach((r) => r.addEventListener("change", () => setMode(r.value)));
      function setMode(m) {
        rdMode = m;
        document.querySelector('input[name="rdp-mode"][value="' + m + '"]').checked = true;
        renderCode();
        run();
        saveShare();
      }

      UI.stringInput("sim-input", {
        examples: () => rdStrings,
        onPick: () => { run(); saveShare(); },
        // A random sentence of the grammar; with ordered choice it may well be rejected.
        random() {
          if (!rdG) return null;
          const s = grammarRandomSentence(rdG.base, Math.random, { minTerms: 1 + Math.floor(Math.random() * 4), maxTerms: 9 });
          if (!s) return null;
          return s.join([...rdG.terminals].every((t) => t.length === 1) ? "" : " ");
        },
      });

      // ── Examples and shareable link ───────────────────────────
      function loadExample(k) {
        if (!k) return;
        const ex = EXAMPLES[k];
        if (!ex) return;
        $("grammar-input").value = ex.text;
        $("examples-select").value = k;
        rdStrings = ex.strings || [];
        $("sim-input").value = rdStrings[0] || "";
        setMode(ex.mode || "full");
        build();
      }

      const saveShare = createShareSaver(() => ({ g: $("grammar-input").value, s: $("sim-input").value, m: rdMode }));
      let sharedStateApplied = false;
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g", ["full", "ordered", "packrat"]);
        if (!st) return;
        sharedStateApplied = true;
        $("grammar-input").value = st.g;
        $("sim-input").value = st.s;
        if (st.m) { rdMode = st.m; document.querySelector('input[name="rdp-mode"][value="' + st.m + '"]').checked = true; }
      }

      // ── Algorithm box ─────────────────────────────────────────
      const PC_RDP_GEN = pcBlock(
        "Generate-Procedures",
        [
          { label: "Input", sym: it("G"), desc: "a context-free grammar, its alternatives in the order written" },
          { label: "Output", sym: "", desc: "one procedure per nonterminal; a procedure takes the position " + it("i") + " in the input" },
        ],
        `${kw("for each")} nonterminal A ${_in} G
  emit  ${kw("procedure")} A(${it("i")})
  ${kw("for each")} production A ${_ra} X₁ X₂ … Xₖ, in order
    ${kw("for")} j ${_la} 1 to k
      ${kw("if")} Xⱼ is a terminal  emit  “match Xⱼ”
      ${kw("else")}  emit  “call Xⱼ”
      ${cm("each step starts where the one before it ended; the first starts at i")}
    ${kw("complete")}  nest the steps as loops over every end position, then  ${kw("yield")} jₖ
    ${kw("ordered")}   chain the steps;  if one gives ✗ go to the next alternative, else  ${kw("return")} jₖ
  ${kw("complete")}  the procedure ends:  A fails
  ${kw("ordered")}   ${kw("return")} ✗`,
      );
      function openAlgoModal() {
        $("algo-title").textContent = "Generating the procedures";
        $("algo-subtitle").textContent = "recursive descent";
        $("algo-body").innerHTML = PC_RDP_GEN +
          '<div class="pc-note">Calling the start symbol at position 0 starts the parse; it succeeds when the start symbol ends exactly at the end of the input. A procedure that calls itself at the same position without reading anything (left recursion) never returns.</div>';
        $("algo-overlay").classList.remove("hidden");
        const b = $("algo-overlay").querySelector(".algo-close");
        if (b) b.focus();
      }
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAlgoModal(); });

      // ── Init ──────────────────────────────────────────────────
      initPanelStorage("rdp-tool-v1", ["p-grammar", "p-code", "p-search"]);
      loadPanelState();
      initAlgoModal();
      applyShareState();
      loadExamplesInto("examples.json", "examples-select", EXAMPLES, () => {
        const first = Object.keys(EXAMPLES)[0];
        if (first && !sharedStateApplied) loadExample(first);
      });
      build();
    </script>
  </body>
</html>
