<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FIRST and FOLLOW sets of a context-free grammar, built by fixpoint iteration: nullable symbols, then FIRST, then FOLLOW, one rule at a time." />
    <title>FIRST &amp; FOLLOW | Parser Tools</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=3e2c71b3" />
    <link rel="stylesheet" href="../../shared/ui.css?v=bddadf9a" />
    <link rel="stylesheet" href="../../shared/grammar-editor.css?v=696d87a6" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-run { --pw: 440; --pmin: 280px; }
      #p-wit { --pw: 600; --pmin: 300px; }
      #p-sets { --pw: 360; --pmin: 240px; }

      [hidden] { display: none !important; }
      .ff-body { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
      #ff-controls {
        display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
        padding: var(--sp-2) var(--sp-5); border-bottom: 1px solid var(--border); background: var(--bg-panel);
      }
      #ff-skip-wrap { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-serif); font-size: var(--fs-xs); cursor: pointer; white-space: nowrap; }
      .ff-fix { margin-top: var(--sp-3); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--green); font-family: var(--font-mono); }
      #ff-phases { display: flex; gap: 0; }
      #ff-phases .btn { border-radius: 0; margin-left: -1px; }
      #ff-phases .btn:first-child { border-radius: var(--r-sm, 3px) 0 0 var(--r-sm, 3px); margin-left: 0; }
      #ff-phases .btn:last-child { border-radius: 0 var(--r-sm, 3px) var(--r-sm, 3px) 0; }
      #ff-phases .btn.is-on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); position: relative; }

      /* The rule being applied: its right-hand side as cells read from the left */
      #ff-now { flex-shrink: 0; padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); background: var(--bg); min-height: 92px; }
      #ff-now .ff-why { font-size: var(--fs-xs); color: var(--text-dim); margin-bottom: var(--sp-3); }
      #ff-now .ff-line { display: flex; align-items: flex-start; flex-wrap: wrap; gap: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-sm); }
      #ff-now .ff-lhs { padding-top: 2px; color: var(--text); font-weight: 600; }
      #ff-now .ff-arrow { padding-top: 2px; color: var(--text-lo); }
      #ff-now .ff-result { margin-top: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-dim); }
      .ff-cell {
        display: inline-flex; flex-direction: column; align-items: center; min-width: 30px;
        padding: 2px var(--sp-3); border: 1.5px solid var(--border-hi); border-radius: var(--r-sm, 3px);
        font-family: var(--font-mono); background: var(--bg-cell);
      }
      .ff-cell b { font-weight: 600; color: var(--text); }
      .ff-cell i { font-style: normal; font-size: var(--fs-2xs); color: var(--text-dim); min-height: 1.3em; }
      .ff-cell.ff-pass { border-style: dashed; border-color: var(--green); background: transparent; }
      .ff-cell.ff-stop { border-color: var(--accent); background: var(--accent-bg); }
      .ff-cell.ff-unread { opacity: 0.4; }
      .ff-cell.ff-target { border-color: var(--amber); background: var(--amber-bg); }
      .ff-cell.ff-plain { border-color: transparent; background: transparent; }
      .ff-end { align-self: center; color: var(--green); font-size: var(--fs-xs); }
      .ff-add { color: var(--accent); font-weight: 600; }

      #ff-log { flex: 1; overflow-y: auto; padding: var(--sp-3) var(--sp-5); background: var(--bg); }
      .ff-round {
        margin-top: var(--sp-4); padding-bottom: var(--sp-1); border-bottom: 1px solid var(--border-lo);
        font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-lo);
        font-family: var(--font-mono);
      }
      .ff-round:first-child { margin-top: 0; }
      .ff-round .ff-done { color: var(--green); text-transform: none; letter-spacing: 0; font-weight: normal; }
      .ff-row {
        display: flex; gap: var(--sp-5); align-items: baseline; padding: var(--sp-1) 0; cursor: pointer;
        font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-dim);
        border-bottom: 1px solid var(--border-lo);
      }
      .ff-row .ff-rule { flex: 1; }
      .ff-row .ff-new { color: var(--accent); }
      .ff-row .ff-nothing { color: var(--text-lo); }
      .ff-row.is-current { color: var(--text); background: var(--accent-bg); }
      .ff-row.is-shown { outline: 1.5px solid var(--amber); outline-offset: -1.5px; }
      .ff-row .ff-occ { color: var(--amber); font-weight: 600; }

      /* Witness: the statement, the figure, the derivation */
      #wit-head { flex-shrink: 0; display: flex; align-items: flex-start; gap: var(--sp-5); padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--border); background: var(--bg-panel); }
      #wit-bar { flex: 1; font-family: var(--font-serif); font-size: var(--fs-sm); min-height: 2.2em; }
      #wit-ctl { display: flex; align-items: center; gap: var(--sp-4); flex-shrink: 0; }
      #wit-alt { display: flex; align-items: center; gap: var(--sp-2); }
      #wit-alt-n { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim); min-width: 3.2em; text-align: center; }
      #wit-all-wrap, #wit-samples-wrap { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-serif); font-size: var(--fs-xs); cursor: pointer; white-space: nowrap; }
      #wit-theory .btn { height: 22px; font-size: var(--fs-2xs); padding: 0 var(--sp-3); }
      #wit-theory .btn.is-on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
      #wit-all-wrap.is-off { opacity: 0.45; cursor: default; }
      #wit-canvas { flex: 1; min-height: 160px; }
      #wit-forms { flex-shrink: 0; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--border); background: var(--bg-panel); font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.7; overflow-x: auto; white-space: nowrap; }
      #wit-forms:empty { display: none; }
      #wit-forms .wit-arrow { color: var(--text-lo); }

      /* Sets */
      #ff-sets { padding: var(--sp-4) var(--sp-5); overflow-y: auto; }
      #ff-sets td.ff-set { text-align: left; padding-left: var(--sp-3); color: var(--text); }
      #ff-sets td.ff-nul { color: var(--green); font-weight: bold; }
      #ff-sets td.ff-follow { color: var(--green); }
      #ff-sets .ff-m[data-set] { cursor: pointer; border-radius: 2px; padding: 0 2px; }
      #ff-sets .ff-m[data-set]:hover { background: var(--bg-hover); }
      #ff-sets .ff-m.is-sel { outline: 1.5px solid var(--amber); background: var(--amber-bg); color: var(--amber); font-weight: bold; }
      #ff-sets .ff-m.is-new { color: var(--accent); font-weight: bold; outline: 1px solid var(--accent); border-radius: 2px; }
      #ff-sets .ff-eps { color: var(--text-lo); }
      #ff-sets tr.is-target td.state-cell { background: var(--accent-bg); color: var(--accent); }
      #ff-seq { margin-top: var(--sp-5); }
      #ff-seq-out { margin-top: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-sm); }
      #ff-seq-out .ff-line { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-3); }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>FIRST &amp; FOLLOW</h1>
    </div>

    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="2" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-grammar')">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <textarea id="grammar-input" spellcheck="false" placeholder="E -> T E'\nE' -> + T E' | eps\nT -> F T'\nT' -> * F T' | eps\nF -> ( E ) | id"></textarea>
          <div id="grammar-footer">
            <div id="error-msg"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. Construction: how the sets are found -->
      <div class="panel" id="p-run" data-priority="1" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Construction</span>
          <button class="algo-btn" onclick="event.stopPropagation(); openAlgoModal();" title="The algorithms: nullable symbols, First and Follow">Algorithm</button>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-run')">&#8249;</button>
        </div>
        <div class="panel-body ff-body">
          <div id="ff-controls">
            <div class="step-group">
              <button class="btn icon-restart" id="btn-reset" title="Restart"></button>
              <button class="btn" id="btn-back">&#8249; Back</button>
              <button class="btn primary" id="btn-step" title="Apply the next rule">Step &#8250;</button>
              <button class="btn" id="btn-round" title="Apply the rest of this round">Round &#8250;&#8250;</button>
              <button class="btn icon-run-all" id="btn-all" title="Run to the fixpoint"></button>
            </div>
            <label id="ff-skip-wrap" title="Leave out the steps that add nothing, in the stepping and in the log"><input type="checkbox" id="ff-skip" /> Skip idle steps</label>
            <div id="ff-phases">
              <button class="btn" data-phase="nullable" title="Jump to the end of the nullable phase">Nullable</button>
              <button class="btn" data-phase="first" title="Jump to the end of the FIRST phase">FIRST</button>
              <button class="btn" data-phase="follow" title="Jump to the end of the FOLLOW phase">FOLLOW</button>
            </div>
          </div>
          <div id="ff-now"></div>
          <div id="ff-log"></div>
        </div>
      </div>

      <div class="resize-handle" id="rh-2"></div>

      <!-- 3. Witness -->
      <div class="panel" id="p-wit" data-priority="4">
        <div class="panel-header">
          <span class="panel-title">Witness</span>
        </div>
        <div class="panel-body ff-body">
          <div id="wit-head">
            <div id="wit-bar"></div>
            <div id="wit-ctl">
              <div class="step-group" id="wit-alt" hidden>
                <button class="btn" id="btn-alt-prev" title="Previous">&#8249;</button>
                <span id="wit-alt-n"></span>
                <button class="btn" id="btn-alt-next" title="Next">&#8250;</button>
              </div>
              <div class="step-group" id="wit-theory" title="The general case, with symbols in place of a grammar">
                <button class="btn" data-theory="nullable">Nullable</button>
                <button class="btn" data-theory="first">FIRST</button>
                <button class="btn" data-theory="follow">FOLLOW</button>
              </div>
              <label id="wit-samples-wrap" class="wit-opt" title="Spell out the strings that only stand for what a symbol derives, faded, instead of …"><input type="checkbox" id="wit-samples" /> Show sample strings</label>
              <label id="wit-all-wrap" title="Step through a witness for every member of this set"><input type="checkbox" id="wit-all" /> Whole set</label>
            </div>
          </div>
          <div id="wit-canvas" class="ui-canvas">
            <svg id="wit-svg"><g id="wit-root" class="ctg"></g></svg>
            <div id="wit-empty" class="ui-canvas__empty">Pick a member of a set.</div>
          </div>
          <div id="wit-forms"></div>
        </div>
      </div>

      <div class="resize-handle" id="rh-3"></div>

      <!-- 4. Results -->
      <div class="panel" id="p-sets" data-priority="3">
        <div class="panel-header">
          <span class="panel-title">Results</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-sets')">&#8250;</button>
        </div>
        <div class="panel-body" style="padding: 0">
          <div id="ff-sets"></div>
        </div>
      </div>

      
    </div>
    <!-- #panels -->

    <!-- Pseudocode modal -->
    <div class="algo-overlay hidden" id="algo-overlay" tabindex="-1" onclick="if (event.target === this) closeAlgoModal();">
      <div class="algo-modal" role="dialog" aria-modal="true" aria-labelledby="algo-title">
        <div class="algo-modal-head">
          <h2 id="algo-title"></h2>
          <span class="algo-subtitle" id="algo-subtitle"></span>
          <button class="algo-close" onclick="closeAlgoModal()" title="Close (Esc)">&#x2715;</button>
        </div>
        <div class="algo-modal-body" id="algo-body"></div>
      </div>
    </div>

    <script src="../../shared/algo/grammar.js?v=14930600"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=47d2ba1e"></script>
    <script src="../../shared/algo/ctg.js?v=fb3438ad"></script>
    <script src="../../shared/algo/firstfollow.js?v=36abb92e"></script>
    <script src="../../shared/shared.js?v=2ab85b1b"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/stepper.js?v=b99ccf2b"></script>
    <script src="../../shared/algo/grammar-model.js?v=5bd211a1"></script>
    <script src="../../shared/grammar-editor.js?v=db52bee1"></script>
    <script src="../../shared/algo/ffwitness.js?v=2073bbbb"></script>
    <script src="../../shared/fit-view.js?v=9af2be16"></script>
    <script src="../../shared/ctg.js?v=a5549cd1"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=eada4185"></script>
    <script src="guide.js?v=ccfc0fe2"></script>
    <script src="../../shared/guide.js?v=98cfe80c"></script>
    <script>
      initResize("rh-1", "p-grammar", +1);
      initResize("rh-2", "p-run", +1);
      initResize("rh-3", "p-wit", +1);

      const EXAMPLES = {};

      // ── The algorithms (the algorithm box of the construction) ─────────────
      const PC_NULLABLE = pcBlock(
        "Nullable",
        [
          { label: "Input", sym: it("G"), desc: "the grammar" },
          { label: "Output", sym: "N", desc: "the nonterminals that derive the empty string" },
        ],
        `N ${_la} ${_emp}
${kw("repeat")}
  ${kw("for each")} production A ${_ra} Y₁ Y₂ … Yₖ ${_in} G${cm("k = 0 for an empty production")}
    ${kw("if")} every Yᵢ ${_in} N${cm("true for k = 0")}
      add A to N
${kw("until")} N is unchanged
${kw("return")} N`,
      );

      // Pseudocode block for the First-set algorithm — now only here; the tools that use First and Follow link to this tool.
      const PC_FIRST = pcBlock(
        "First",
        [
          { label: "Input", sym: it("X"), desc: "a grammar symbol or a sequence of symbols" },
          {
            label: "Output",
            sym: "First(" + it("X") + ")",
            desc: "the set of terminals t such that " + it("X") + " ⇒* tω for some ω, plus " + _eps + " if " + it("X") + " ⇒* " + _eps,
          },
        ],
        `${kw("if")} X is a terminal
  ${kw("return")} { X }
R ${_la} ${_emp}
${kw("repeat")}
  ${kw("for each")} production X ${_ra} Y₁ Y₂ … Yₖ ${_in} G
    ${kw("for")} i ${_la} 1 to k
      add First(Yᵢ) \\ {${_eps}} to R
      ${kw("if")} ${_eps} ${_nin} First(Yᵢ)  ${kw("break")}${cm("Yᵢ not nullable; remaining symbols cannot contribute")}
    ${kw("if")} all Yᵢ are nullable  add ${_eps} to R
${kw("until")} R is unchanged
${kw("return")} R`,
      );

      const PC_FOLLOW = pcBlock(
        "Follow",
        [
          { label: "Input", sym: it("G"), desc: "the grammar" },
          { label: "", sym: "First", desc: "the First function" },
          {
            label: "Output",
            sym: "Follow(A)",
            desc: "for each nonterminal A: the set of terminals that can appear immediately to the right of A in a sentential form, plus $ if A can end the input",
          },
        ],
        `Follow(S) ${_la} { $ }${cm("S is the start symbol; $ marks end of input")}
${kw("for each")} other nonterminal A: Follow(A) ${_la} ${_emp}
${kw("repeat")}
  ${kw("for each")} production B ${_ra} Y₁ Y₂ … Yₙ ${_in} G
    ${kw("for")} i ${_la} 1 to n
      ${kw("if")} Yᵢ is a nonterminal
        let β = Yᵢ₊₁ … Yₙ ${cm("the suffix after Yᵢ; empty if i = n")}
        add First(β) \\ {${_eps}} to Follow(Yᵢ)
        ${kw("if")} ${_eps} ${_in} First(β)${cm("suffix is nullable, or Yᵢ is last")}
          add Follow(B) to Follow(Yᵢ)
${kw("until")} all Follow sets are unchanged
${kw("return")} Follow`,
      );

      function openAlgoModal() {
        el("algo-title").textContent = "Nullable, First & Follow";
        el("algo-subtitle").textContent = "fixpoint iteration";
        el("algo-body").innerHTML = PC_NULLABLE + PC_FIRST + PC_FOLLOW +
          '<div class="pc-note">Each pass of a repeat loop is a round in the log; a round that adds nothing ends the loop (the fixpoint). The tool keeps nullability apart from First: ε belongs to First(X) exactly when X is nullable, so First is built after Nullable and from it. First of a sequence Y₁…Yₖ: add First(Yᵢ) without ε for each Yᵢ up to and including the first that cannot derive ε; add ε if all of them can. The same scan reads the right-hand side in the construction panel and, after the occurrence, in Follow.</div>';
        el("algo-overlay").classList.remove("hidden");
        const b = el("algo-overlay").querySelector(".algo-close");
        if (b) b.focus(); else el("algo-overlay").focus();
      }
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAlgoModal(); });
      const PHASE_NAME = { nullable: "Nullable", first: "FIRST", follow: "FOLLOW" };
      const SET_NAME = { first: "FIRST", follow: "FOLLOW" };

      let grammar = null;
      let rec = null; // ffRecord of the grammar
      let sel = null; // the member shown in the witness panel: { kind: "first" | "follow" | "nullable", nt, tok }
      let alt = 0; // which way of showing it (the shortest is 0)
      let which = 0, whichCount = 0; // with several members shown (a step that adds some, the whole set): which one, and how many
      let theory = null; // nullable | first | follow: the general case is shown instead of a member
      let shownStep = null; // the step of the construction whose member (or phase) the witness shows
      const ctgPref = ctgPrefs({ all: false, skip: false, samples: false }); // remembered for this tool: a witness for the whole set; sample strings in the witness; steps that add nothing left out
      const el = (id) => document.getElementById(id);
      const setOf = (xs) => "{" + xs.map(esc).join(", ") + "}";
      // what a step adds, as set notation: one member ∈ the set, several ⊆ it
      const addedTo = (ev) => (ev.added.length === 1 ? esc(ev.added[0]) + " ∈ " : setOf(ev.added) + " ⊆ ") + (ev.phase === "nullable" ? "Nullable" : SET_NAME[ev.phase] + "(" + esc(ev.target) + ")");

      function setError(msg) {
        el("error-msg").textContent = msg || "";
        el("error-msg").classList.remove("is-note");
      }

      function build() {
        setError("");
        try {
          grammar = parseBNF(el("grammar-input").value.trim(), false);
        } catch (e) {
          setError(e.message);
          return;
        }
        showGrammarNotes(grammar);
        saveShare();
        rec = ffRecord(grammar);
        sim.pos = rec.events.length - 1; // the finished sets; the construction panel steps through how they were found
        if (!sel || !memberExists(sel)) sel = firstMember();
        render();
        sim.refresh();
        drawWitness();
      }

      // ── The member in the witness panel ──────────────────────────────────
      function memberExists(m) {
        if (!rec.first[m.nt]) return false;
        return m.kind === "nullable" ? rec.nullable.has(m.nt) : rec[m.kind][m.nt].has(m.tok);
      }
      // FIRST of the start symbol: the first thing a reader of the figure meets
      function firstMember() {
        const start = grammar.start, toks = [...rec.first[start]].sort();
        return toks.length ? { kind: "first", nt: start, tok: toks[0] } : rec.nullable.has(start) ? { kind: "nullable", nt: start } : null;
      }
      const sameMember = (a, b) => a && b && a.kind === b.kind && a.nt === b.nt && a.tok === b.tok;
      function selectMember(m) {
        sel = m;
        theory = null;
        shownStep = null;
        alt = 0;
        which = 0;
        saveShare();
        renderSets(sim.pos);
        drawWitness();
      }
      // Show a step of the construction in the witness pane: the member it adds and why it is there, or, when it adds nothing, the
      // general case of its phase. Stepping shows the step that was just made; clicking a row of the log shows that one.
      function showStep(i) {
        const ev = i >= 0 ? rec.events[i] : null;
        shownStep = i >= 0 ? i : null;
        const m = ev && ev.added.length ? (ev.phase === "nullable" ? { kind: "nullable", nt: ev.added[0] } : { kind: ev.phase, nt: ev.target, tok: ev.added[0] }) : null;
        if (m && memberExists(m)) { sel = m; theory = null; alt = 0; which = 0; }
        else theory = ev ? ev.phase : "nullable";
        renderLog(sim.pos);
        renderSets(sim.pos);
        drawWitness();
      }
      const witnessOf = (m, k) => (m.kind === "first" ? ffwFirst(grammar, rec, m.nt, m.tok, k) : m.kind === "follow" ? ffwFollow(grammar, rec, m.nt, m.tok, k) : ffwNullable(grammar, rec, m.nt, k));
      let witView = null, witBox = null;
      // the figures, side by side, in the witness view, their base lines on one line
      function showFigures(specs, gap) {
        const root = el("wit-root");
        root.innerHTML = "";
        const lays = specs.map((spec) => ctgSpineLayout(spec));
        const lowest = Math.max(...lays.map((l) => l.B));
        let x = 0, height = 0;
        specs.forEach((spec, i) => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          const dy = lowest - lays[i].B;
          g.setAttribute("transform", "translate(" + x + "," + dy + ")");
          root.appendChild(g);
          drawCTGSpineInto(g, spec);
          x += lays[i].width + gap;
          height = Math.max(height, dy + lays[i].height);
        });
        witBox = { x: 0, y: 0, width: Math.max(1, x - gap), height };
        if (!witView) witView = createFitView({ svg: "wit-svg", root: "wit-root", scaleExtent: [0.08, 4], maxScale: 2, pad: 16, align: "top", bounds: () => witBox, hasContent: () => !!witBox });
        witView.fit();
      }
      const SET_LABEL = { first: "FIRST", follow: "FOLLOW" };
      function drawWitness() {
        el("wit-root").innerHTML = "";
        el("wit-bar").textContent = "";
        el("wit-forms").innerHTML = "";
        el("wit-alt").hidden = true;
        whichCount = 0;
        witBox = null;
        el("wit-empty").hidden = !!sel || !!theory;
        document.querySelectorAll("#wit-theory .btn").forEach((b) => b.classList.toggle("is-on", b.dataset.theory === theory));
        const stepEv = shownStep !== null ? rec.events[shownStep] : null;
        const added = !theory && stepEv && stepEv.phase !== "nullable" && stepEv.added.length > 1 && sel && sel.kind === stepEv.phase && sel.nt === stepEv.target ? stepEv.added : null; // the members that the shown step adds
        const whole = !theory && !stepEv && ctgPref.get().all && sel && sel.kind !== "nullable";
        const noSet = theory || !sel || sel.kind === "nullable";
        el("wit-all").checked = ctgPref.get().all;
        el("wit-all").disabled = !!noSet;
        el("wit-all-wrap").classList.toggle("is-off", !!noSet);
        if (theory) {
          const spec = ffwTheory(theory);
          showFigures(spec.figures || [spec], 60);
          el("wit-bar").textContent = spec.statement;
          el("wit-forms").innerHTML = spec.formsText ? esc(spec.formsText) : spec.forms.map(esc).join(' <span class="wit-arrow">⇒*</span> ');
          return;
        }
        if (!sel) return;
        const many = added || (whole && [...rec[sel.kind][sel.nt]]);
        if (many) {
          const toks = [...many].sort((a, b) => (a === "$") - (b === "$") || (a < b ? -1 : 1));
          whichCount = toks.length;
          which = Math.min(which, whichCount - 1);
          const spec = ffwSpec(witnessOf({ kind: sel.kind, nt: sel.nt, tok: toks[which] }, 0), { samples: ctgPref.get().samples });
          showFigures([spec], 0);
          el("wit-bar").textContent = (added ? "{ " + toks.join(", ") + " } ⊆ " : SET_LABEL[sel.kind] + "(" + sel.nt + ") = { " + toks.join(", ") + " }: ") + (added ? SET_LABEL[sel.kind] + "(" + sel.nt + "): added by this step. " : "the shortest witness of each member. ") + spec.statement;
          el("wit-forms").innerHTML = spec.forms.map(esc).join(' <span class="wit-arrow">⇒</span> ');
          el("wit-alt").hidden = whichCount < 2;
          el("wit-alt-n").textContent = which + 1 + " / " + whichCount;
          return;
        }
        whichCount = 0;
        const w = witnessOf(sel, alt);
        if (!w) { sel = null; drawWitness(); return; }
        const spec = ffwSpec(w, { samples: ctgPref.get().samples });
        showFigures([spec], 0);
        el("wit-bar").textContent = spec.statement + (w.unreachable ? " (the symbol cannot be reached from the start symbol)" : "");
        el("wit-forms").innerHTML = spec.forms.map(esc).join(' <span class="wit-arrow">⇒</span> ');
        el("wit-alt").hidden = w.count < 2;
        el("wit-alt-n").textContent = w.alt + 1 + " / " + w.count;
      }

      // ── The rule being applied ───────────────────────────────────────────
      const CELL = {
        pass: { cls: "ff-pass", title: "can derive ε: the scan goes on" },
        stop: { cls: "ff-stop", title: "cannot derive ε: the scan stops here" },
        unread: { cls: "ff-unread", title: "not read" },
      };
      function cellHtml(c, phase) {
        const toks = phase === "nullable" || c.state === "unread" ? "" : setOf(c.toks);
        return '<span class="ff-cell ' + CELL[c.state].cls + '" title="' + CELL[c.state].title + '"><b>' + esc(c.sym) + "</b><i>" + toks + "</i></span>";
      }

      function renderNow(ev) {
        const box = el("ff-now");
        if (!ev) {
          box.innerHTML = '<div class="ff-why">' + (rec ? "Step applies the first rule of the nullable phase." : "") + "</div>";
          return;
        }
        let html = '<div class="ff-why">' + PHASE_NAME[ev.phase] + (ev.round ? ", round " + ev.round : ", start") + ": " + esc(ffExplain(grammar, ev)) + "</div>";
        if (ev.rule >= 0) {
          const r = grammar.rules[ev.rule];
          let line = '<span class="ff-lhs">' + esc(r.lhs) + '</span><span class="ff-arrow">→</span>';
          if (!r.rhs.length) line += '<span class="ff-cell ff-plain"><b>' + EPSILON + "</b></span>";
          else if (ev.phase === "follow") {
            line += r.rhs.slice(0, ev.pos).map((s) => '<span class="ff-cell ff-plain"><b>' + esc(s) + "</b></span>").join("");
            line += '<span class="ff-cell ff-target" title="' + esc("receives the tokens") + '"><b>' + esc(r.rhs[ev.pos]) + "</b><i>FOLLOW</i></span>";
            line += ev.cells.map((c) => cellHtml(c, ev.phase)).join("");
          } else line += ev.cells.map((c) => cellHtml(c, ev.phase)).join("");
          if (ev.end) line += '<span class="ff-end" title="Every symbol read can derive ε">' + (ev.phase === "follow" ? "▸ end: FOLLOW(" + esc(r.lhs) + ") flows in" : "▸ end") + "</span>";
          html += '<div class="ff-line" data-prod="' + (ev.rule + 1) + '">' + line + "</div>";
        }
        let res;
        if (ev.phase === "nullable") res = ev.added.length ? '<span class="ff-add">' + addedTo(ev) + "</span>" : ev.end ? "already nullable" : "nothing new";
        else res = ev.added.length ? '<span class="ff-add">' + addedTo(ev) + "</span>" : "nothing new";
        html += '<div class="ff-result">' + res + "</div>";
        box.innerHTML = html;
      }

      // ── The log, round by round ──────────────────────────────────────────
      function ruleText(ev) {
        const r = grammar.rules[ev.rule];
        if (ev.rule < 0) return "start symbol " + esc(grammar.start);
        const syms = r.rhs.map((s, i) => (ev.phase === "follow" && i === ev.pos ? '<span class="ff-occ">' + esc(s) + "</span>" : esc(s)));
        return esc(r.lhs) + " → " + (syms.join(" ") || EPSILON);
      }
      function renderLog(pos, follow = false) {
        const log = el("ff-log");
        const top = log.scrollTop;
        if (!rec.events.length) { log.innerHTML = ""; return; }
        let html = "";
        const skip = ctgPref.get().skip;
        const done = nextStop(pos) < 0; // nothing left to stop at: the last phase has reached its fixpoint too
        for (const rd of rec.rounds) {
          const finished = rd.to - 1 <= pos;
          // skipping: a round that adds nothing is the fixpoint, said in one line; the rows are the steps that add something
          const idle = skip && !rd.added && rd.round > 0;
          if (idle && (finished || (done && rec.events.findIndex((e) => e.phase === rd.phase) <= pos))) { html += '<div class="ff-fix">' + PHASE_NAME[rd.phase] + " · fixpoint: nothing more to add</div>"; continue; }
          if (rd.from > pos) continue;
          const rows = [];
          for (let i = rd.from; i < rd.to && i <= pos; i++) {
            const ev = rec.events[i];
            if (skip && !ev.added.length) continue;
            const add = ev.added.length
              ? '<span class="ff-new">' + addedTo(ev) + "</span>"
              : '<span class="ff-nothing">nothing new</span>';
            rows.push('<div class="ff-row' + (i === pos ? " is-current" : "") + (i === shownStep ? " is-shown" : "") + '" data-i="' + i + '"' + (ev.rule >= 0 ? ' data-prod="' + (ev.rule + 1) + '"' : "") +
              ' title="' + esc(ffExplain(grammar, ev) + " (click: show in the witness)") + '"><span class="ff-rule">' + ruleText(ev) + "</span>" + add + "</div>");
          }
          if (skip && !rows.length) continue;
          html += '<div class="ff-round">' + PHASE_NAME[rd.phase] + (rd.round ? " · round " + rd.round : " · start") +
            (finished ? " · " + (rd.added ? rd.added + " added" : '<span class="ff-done">nothing added: fixpoint</span>') : "") + "</div>" + rows.join("");
        }
        log.innerHTML = html;
        // stepping brings the current row into view; anything else (a click on a row) leaves the list where it is
        const cur = log.querySelector(".is-current");
        if (follow && cur) cur.scrollIntoView({ block: "nearest" });
        else log.scrollTop = top;
      }

      // ── The sets ─────────────────────────────────────────────────────────
      function renderSets(pos) {
        const st = ffStateAt(grammar, rec, pos);
        const ev = pos >= 0 ? rec.events[pos] : null;
        const nts = [...new Set(grammar.rules.map((r) => r.lhs))];
        const pick = (kind, nt, tok) => ' data-set="' + kind + '" data-nt="' + esc(nt) + '"' + (tok !== undefined ? ' data-tok="' + esc(tok) + '"' : "");
        const chosen = (kind, nt, tok) => (sameMember(sel, { kind, nt, tok }) ? " is-sel" : "");
        const member = (by, tok, set, nt) => {
          const i = by[tok];
          const e = rec.events[i];
          const kind = set.toLowerCase();
          return '<span class="ff-m' + (i === pos ? " is-new" : "") + chosen(kind, nt, tok) + '"' + pick(kind, nt, tok) + ' title="' + esc(tok + " ∈ " + set + "(" + nt + "): " + ffExplain(grammar, e) + " (click: witness)") + '"' + (e.rule >= 0 ? ' data-prod="' + (e.rule + 1) + '"' : "") + ">" + esc(tok) + "</span>";
        };
        const members = (set, by, name, nt) => [...set].sort((a, b) => (a === "$") - (b === "$") || (a < b ? -1 : 1)).map((t) => member(by, t, name, nt)).join(", ");
        let html = '<table class="parse-table"><thead><tr><th class="state-col">NT</th>' +
          '<th title="Can derive the empty string">Nullable</th><th title="Terminals a string derived from the symbol can start with">FIRST</th><th title="Terminals that can come right after the symbol">FOLLOW</th></tr></thead><tbody>';
        for (const nt of nts) {
          const nul = st.nullable.has(nt);
          const ne = nul ? rec.events[st.by.nullable[nt]] : null;
          const fs = members(st.first[nt], st.by.first[nt], "FIRST", nt);
          const ls = members(st.follow[nt], st.by.follow[nt], "FOLLOW", nt);
          const eps = nul ? '<span class="ff-eps ff-m' + chosen("nullable", nt) + '"' + pick("nullable", nt) + ' title="Nullable: ε would be in FIRST (click: witness)"> ε</span>' : "";
          html += '<tr' + (ev && ev.target === nt ? ' class="is-target"' : "") + '><td class="state-cell">' + esc(nt) + "</td>" +
            '<td class="ff-nul"' + (nul ? ' data-prod="' + (ne.rule + 1) + '"' : "") + ">" + (nul ? '<span class="ff-m' + (ev && ev.phase === "nullable" && ev.added[0] === nt ? " is-new" : "") + chosen("nullable", nt) + '"' + pick("nullable", nt) + ' title="' + esc(ffExplain(grammar, ne) + " (click: witness)") + '">✓</span>' : "") + "</td>" +
            '<td class="ff-set">{ ' + (fs || "") + (fs && eps ? "," : "") + eps + (fs || eps ? "" : "&mdash;") + " }</td>" +
            '<td class="ff-set ff-follow">{ ' + (ls || "&mdash;") + " }</td></tr>";
        }
        html += "</tbody></table>";
        html += '<div id="ff-seq"><div class="tbl-section-label" title="FIRST and nullability of any string of symbols, from the finished sets">FIRST of a string of symbols</div>' +
          '<input id="ff-seq-in" class="ui-input ui-input--grow" type="text" spellcheck="false" placeholder="T E\' x" value="' + esc(seqText) + '"><div id="ff-seq-out"></div></div>';
        el("ff-sets").innerHTML = html;
        const inp = el("ff-seq-in");
        inp.addEventListener("input", () => { seqText = inp.value; renderSeq(); });
        renderSeq();
      }

      let seqText = "";
      function renderSeq() {
        const out = el("ff-seq-out");
        const syms = seqText.trim() ? seqText.trim().split(/\s+/) : [];
        if (!seqText.trim()) { out.innerHTML = ""; return; }
        const sc = ffScan(syms, grammar.nonterminals, rec.nullable, rec.first, true);
        out.innerHTML = '<div class="ff-line">' + sc.cells.map((c) => cellHtml(c, "first")).join("") + "</div>" +
          "FIRST = " + setOf(sc.toks.concat(sc.end ? [EPSILON] : [])) + (sc.end ? " · can derive ε" : "");
      }

      function render() {
        if (!grammar || !rec) return;
        const pos = sim.pos;
        const ev = pos >= 0 ? rec.events[pos] : null;
        renderNow(ev);
        renderLog(pos, true);
        renderSets(pos);
        document.querySelectorAll("#ff-phases .btn").forEach((b) => b.classList.toggle("is-on", !!ev && ev.phase === b.dataset.phase));
        document.querySelectorAll("#ff-phases .btn").forEach((b) => (b.disabled = !rec.events.length));
        el("btn-round").disabled = sim.pos >= lastStop();
      }

      // ── Controls ─────────────────────────────────────────────────────────
      // The steps that can be stopped at: all of them, or with "skip idle steps" only those that add something.
      const stop = (i) => !ctgPref.get().skip || rec.events[i].added.length > 0;
      const nextStop = (pos) => { for (let i = pos + 1; i < rec.events.length; i++) if (stop(i)) return i; return -1; };
      const prevStop = (pos) => { for (let i = Math.min(pos, rec.events.length) - 1; i >= 0; i--) if (stop(i)) return i; return -1; };
      const lastStop = () => { for (let i = rec.events.length - 1; i >= 0; i--) if (stop(i)) return i; return -1; };
      const stepNext = () => { const i = nextStop(sim.pos); if (i >= 0) sim.go(i); };
      const stepBack = () => { if (sim.pos >= 0) sim.go(prevStop(sim.pos)); };
      const sim = createStepper({
        buttons: { reset: "btn-reset", back: "btn-back", step: "btn-step", all: "btn-all" },
        min: -1,
        last: () => (rec && rec.events.length ? lastStop() : null),
        onChange: () => { render(); showStep(sim.pos); },
      });
      el("btn-reset").addEventListener("click", () => sim.reset());
      el("btn-back").addEventListener("click", stepBack);
      el("btn-step").addEventListener("click", stepNext);
      el("btn-all").addEventListener("click", () => sim.end());
      el("btn-round").addEventListener("click", () => {
        // the end of the current round, or of the next one that has a step to stop at
        for (const rd of rec.rounds) {
          let end = -1;
          for (let i = rd.to - 1; i >= rd.from; i--) if (stop(i)) { end = i; break; }
          if (end > sim.pos) { sim.go(end); return; }
        }
      });
      document.querySelectorAll("#ff-phases .btn").forEach((b) =>
        b.addEventListener("click", () => {
          let last = -1, stopLast = -1;
          rec.events.forEach((e, i) => { if (e.phase === b.dataset.phase) { last = i; if (stop(i)) stopLast = i; } });
          sim.go(stopLast >= 0 ? stopLast : last); // a phase that adds nothing at all: its end
        })
      );
      const way = (d) => {
        if (whichCount > 1) { which = (which + d + whichCount) % whichCount; drawWitness(); return; }
        if (sel) { const w = witnessOf(sel, alt); alt = (w.alt + d + w.count) % w.count; drawWitness(); } };
      el("btn-alt-prev").addEventListener("click", () => way(-1));
      el("btn-alt-next").addEventListener("click", () => way(1));
      document.querySelectorAll("#wit-theory .btn").forEach((b) => b.addEventListener("click", () => { theory = b.dataset.theory; drawWitness(); }));
      el("wit-samples").checked = ctgPref.get().samples;
      el("wit-samples").addEventListener("change", () => { ctgPref.set({ samples: el("wit-samples").checked }); drawWitness(); });
      el("wit-all").addEventListener("change", () => { ctgPref.set({ all: el("wit-all").checked }); drawWitness(); });
      el("ff-sets").addEventListener("click", (e) => {
        const m = e.target.closest("[data-set]");
        if (m) selectMember({ kind: m.dataset.set, nt: m.dataset.nt, tok: m.dataset.tok });
      });
      el("ff-log").addEventListener("click", (e) => {
        const row = e.target.closest(".ff-row");
        if (row) showStep(+row.dataset.i); // not a step back in time: the construction stays where it is
      });
      // ←/→ (or ,/.) step, Home restarts, End runs.
      registerStepper("p-run", { step: stepNext, back: stepBack, reset: () => sim.reset(), end: () => sim.end() }, { primary: true });
      el("ff-skip").checked = ctgPref.get().skip;
      el("ff-skip").addEventListener("change", () => { ctgPref.set({ skip: el("ff-skip").checked }); render(); sim.refresh(); });

      window.onerror = function (msg, src, line, col, err) {
        if (line === 0 && !src) return false;
        let detail = err ? err.message : msg;
        if (src) detail += " — " + src.split("/").pop() + ":" + line;
        el("error-msg").textContent = detail;
        return false;
      };

      // ── Shareable link ───────────────────────────────────────────────────
      const saveShare = createShareSaver(() => ({
        g: el("grammar-input").value,
        x: exampleShareKey(),
        s: sel ? JSON.stringify([sel.kind, sel.nt, sel.tok === undefined ? null : sel.tok]) : "",
      }));
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g");
        if (!st) return;
        el("grammar-input").value = st.g;
        exampleRestoreLater(st.x);
        try {
          const [kind, nt, tok] = JSON.parse(st.s || "[]");
          if (["first", "follow", "nullable"].includes(kind) && typeof nt === "string") sel = { kind, nt, tok: typeof tok === "string" ? tok : undefined };
        } catch (e) { /* an old or damaged link: the default member */ }
      }

      window.addEventListener("load", () => {
        GrammarEditor.attach(el("grammar-input"));
        initPanelStorage("firstfollow-tool-v1", ["p-grammar", "p-run", "p-wit", "p-sets"]);
        loadPanelState();
        initAlgoModal();
        loadExamplesInto("examples.json", "examples-select", EXAMPLES);
        el("grammar-input").value = "E -> T E'\nE' -> + T E' | eps\nT -> F T'\nT' -> * F T' | eps\nF -> ( E ) | id";
        applyShareState();
        build();
        let timer = null;
        el("grammar-input").addEventListener("input", () => {
          clearTimeout(timer);
          timer = setTimeout(build, 400);
        });
      });
    </script>
  </body>
</html>
