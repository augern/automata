<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive LL(1) parser — compute FIRST/FOLLOW sets, build predictive tables, and step through string simulation with a live parse tree." />
    <title>LL(1) Parser | Parser Tools</title>
    <script src="../vendor/d3.min.js?v=6d64bd2f"></script>
    <link rel="stylesheet" href="../shared/shared.css?v=4957a13c" />
    <link rel="stylesheet" href="../shared/ui.css?v=87377938" />
    <script src="../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-main { --pw: 520; --pmin: 220px; }

      .main-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Derivation steps: like a LaTeX proof or rewriting sequence */
      #deriv-head {
        display: flex;
        gap: var(--sp-5);
        font-size: var(--fs-2xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-lo);
        border-bottom: 1px solid var(--border);
        padding-bottom: var(--sp-2);
        margin-bottom: var(--sp-1);
        font-family: var(--font-mono);
      }
      #deriv-head .ds-num  { min-width: 22px; flex-shrink: 0; }
      #deriv-head .ds-form { flex: 1; }
      #deriv-area {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-5) var(--sp-6);
        background: var(--bg);
      }
      #deriv-empty {
        color: var(--text-lo);
        font-family: var(--font-serif);
        font-style: italic;
        font-size: var(--fs-md);
        padding-top: var(--sp-4);
      }
      .deriv-step {
        display: flex;
        gap: var(--sp-5);
        align-items: baseline;
        font-size: var(--fs-sm);
        padding: var(--sp-2) 0;
        border-bottom: 1px solid var(--border-lo);
        line-height: 1.7;
        font-family: var(--font-mono);
      }
      .deriv-step .ds-num {
        color: var(--text-lo);
        min-width: 22px;
        flex-shrink: 0;
        font-style: italic;
      }
      .deriv-step .ds-form {
        color: var(--text-dim);
        flex: 1;
      }
      .deriv-step .ds-action {
        color: var(--text-lo);
        font-size: var(--fs-2xs);
        font-style: italic;
      }
      .deriv-step.current .ds-form {
        color: var(--text);
      }
      .deriv-step.current .ds-action {
        color: var(--accent);
      }
      .deriv-step .ds-focus {
        color: var(--accent);
        font-weight: bold;
      }
      .deriv-step.accepted .ds-form {
        color: var(--green);
      }/* LL stack items *//* LL(1) table rule cells *//* ── Table construction simulation ── *//* Only the predictive table dims; FIRST/FOLLOW table is untouched */
      #tstep-controls .btn {
        height: 18px;
        font-size: var(--fs-2xs);
        padding: 0 var(--sp-3);
        line-height: 1;
      }
      #tstep-log-bar .lg-op   { color: var(--accent); }
      #tstep-log-bar .lg-seen { color: var(--text-lo); font-style: italic; }
      #tstep-log-bar .lg-conf { color: var(--red); }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1><a href="../index.html">LL(1) Parser Tool</a></h1>
    </div>

    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="3" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button
            class="collapse-btn"
            onclick="
              event.stopPropagation();
              toggleCollapse('p-grammar');
            "
          >
            &#8249;
          </button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <textarea id="grammar-input" spellcheck="false" placeholder="E -> T E'\nE' -> + T E' | eps\nT -> F T'\nT' -> * F T' | eps\nF -> id"></textarea>
          <div id="grammar-footer">
            <div id="error-msg"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. Parsing tables -->
      <div class="panel" id="p-tables" data-priority="2" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Parsing Tables</span>
          <button
            class="algo-btn"
            onclick="
              event.stopPropagation();
              openAlgoModal('table');
            "
            title="Predictive table construction algorithm"
          >
            Algorithm
          </button>
          <button
            class="collapse-btn"
            onclick="
              event.stopPropagation();
              toggleCollapse('p-tables');
            "
          >
            &#8249;
          </button>
        </div>
        <div id="tstep-controls" style="display: flex; align-items: center; gap: 6px; padding: 3px 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border-lo); font-size: var(--fs-2xs); font-family: var(--font-mono); color: var(--text-dim); min-height: 1.8em">
          <span>Simulate</span>
          <div class="step-group">
            <button class="btn icon-restart" id="btn-treset" onclick="tReset()" title="Restart" disabled></button>
            <button class="btn" id="btn-tback" onclick="tBack()" disabled>&#8249; Back</button>
            <button class="btn primary" id="btn-tstep" onclick="tStep()" disabled>Table Step &#8250;</button>
            <button class="btn icon-run-all" id="btn-trun" onclick="tRunAll()" title="Run all" disabled></button>
          </div>
        </div>
        <div id="tstep-log-bar" style="display: none; padding: 3px 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border-lo); font-size: var(--fs-2xs); font-family: var(--font-mono); color: var(--text-dim); min-height: 1.8em"></div>
        <div class="panel-body">
          <div id="tables-wrap">
            <div style="color: var(--text-dim); font-size: var(--fs-sm)">Build a grammar to see tables.</div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-2"></div>

      <!-- 3. Derivation steps -->
      <div class="panel" id="p-main" data-priority="4" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Derivation Steps</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-main')">&#8249;</button>
        </div>
        <div class="panel-body main-body">
          <div id="deriv-area">
            <div id="deriv-empty">Build a grammar, then simulate a string.</div>
            <div id="deriv-head" style="display:none">
              <span class="ds-num">#</span>
              <span class="ds-form">Stack Symbols</span>
              <span class="ds-action">Action</span>
            </div>
            <div id="deriv-steps"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-3"></div>

      <!-- 4. Parse tree + simulation -->
      <div class="panel" id="p-tree" data-priority="1">
        <div class="panel-header">
          <span class="panel-title">Parse Tree</span>
          <button
            class="collapse-btn"
            onclick="
              event.stopPropagation();
              toggleCollapse('p-tree');
            "
          >
            &#8250;
          </button>
        </div>
        <div class="panel-body tree-panel-body">
          <div class="tree-area">
            <svg id="tree-svg" width="100%" height="100%"><g id="tree-root"></g></svg>
            <div id="tree-empty">Run simulation to grow the parse tree.</div>
          </div>
          <div id="sim-panel">
            <div class="panel-header">
              <span class="panel-title">String Parsing Simulation</span>
              <button class="algo-btn" onclick="openAlgoModal('parse')" title="LL(1) parsing algorithm">Algorithm</button>
            </div>
            <div id="sim-header">
              <div id="sim-input-row">
                <div class="input-group">
                  <input id="sim-input" class="ui-input ui-input--lg" type="text" spellcheck="false" placeholder="e.g. id + id  (empty for ε)" />
                </div>
                <div class="step-group">
                  <button class="btn icon-restart" onclick="simReset()" title="Restart"></button>
                  <button class="btn" id="btn-back" onclick="simBack()" disabled>&#8249; Back</button>
                  <button class="btn primary" id="btn-step" onclick="simStep()" disabled>Step &#8250;</button>
                  <button class="btn icon-run-all" id="btn-run" onclick="simRunAll()" title="Run all" disabled></button>
                </div>
              </div>
            </div>
            <div id="sim-body">
              <div class="sim-row">
                <span class="sim-label">Input</span>
                <div id="sim-tokens"></div>
              </div>
              <div class="sim-row">
                <span class="sim-label">Stack</span>
                <div id="sim-stack"></div>
              </div>
              <div class="sim-row">
                <span class="sim-label">Action</span>
                <div id="sim-log"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- #panels -->

    <!-- Pseudocode modal -->
    <div class="algo-overlay hidden" id="algo-overlay" tabindex="-1" onclick="if (event.target === this) closeAlgoModal();">
      <div class="algo-modal" role="dialog" aria-modal="true" aria-labelledby="algo-title">
        <div class="algo-modal-head">
          <h2 id="algo-title"></h2>
          <span class="algo-subtitle" id="algo-subtitle"></span>
          <button class="algo-close" onclick="closeAlgoModal()" title="Close (Esc)">&#x2715;</button>
        </div>
        <div class="algo-modal-body" id="algo-body"></div>
      </div>
    </div>

    <script src="../shared/algo/grammar.js?v=39525f46"></script>
    <script src="../shared/algo/panels.js?v=23a37100"></script>
    <script src="../shared/algo/share.js?v=e00a0058"></script>
    <script src="../shared/algo/strings.js?v=2449eeb3"></script>
    <script src="../shared/algo/ll1.js?v=40eb47b3"></script>
    <script src="../shared/shared.js?v=583a8d75"></script>
    <script src="../shared/share-link.js?v=0d17f714"></script>
    <script src="../shared/ui.js?v=0ba49cea"></script>
    <script src="../shared/view-menu.js?v=d1c37b50"></script>
    <script>
      // rh-1: grammar LEFT of handle   — drag right widens grammar
      initResize("rh-1", "p-grammar", +1);
      // rh-2: tables LEFT of handle    — drag right widens tables
      initResize("rh-2", "p-tables", +1);
      // rh-3: tree RIGHT of handle     — drag left widens tree
      initResize("rh-3", "p-tree", -1);

      // ── Sample grammars ───────────────────────────────────────────────────
      const EXAMPLES = {};

      // loadExample — defined in shared.js

      // buildLL1Table, ll1Step — see shared/algo/ll1.js

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // TABLE CONSTRUCTION STEP ENGINE
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // Steps mirror exactly the logic in buildLL1Table so the student
      // can watch each FIRST / FOLLOW lookup write one cell at a time.
      //
      // Step types:  "entry"   — a normal (non-conflicting) cell write
      //              "conflict" — a second production wants the same cell
      //              "table-done" — all entries processed

      let tSteps = [];
      let tStepIdx = -1;
      let tFilled = new Set(); // "NT:term" keys written so far

      function recordTableSteps(grammar, first, follow) {
        const { rules, nonterminals: nts } = grammar;
        const steps = [];
        const filled = {}; // key → ruleIdx (for conflict detection)

        function rhs_(rule) {
          return rule.rhs.join(" ") || EPSILON;
        }

        function addStep(nt, term, ruleIdx, html) {
          const key = nt + ":" + term;
          const cur = filled[key];
          if (cur === undefined) {
            filled[key] = ruleIdx;
            steps.push({ type: "entry", nt, term, ruleIdx, html, key });
          } else if (cur !== ruleIdx) {
            steps.push({
              type: "conflict",
              nt, term, key,
              html: '<span class="lg-conf">conflict</span> M[<b>' + esc(nt) + '</b>, <b>' + esc(term) + '</b>]: rules ' + cur + ' and ' + ruleIdx +
                    ' <span class="lg-seen">— grammar is not LL(1)</span>',
            });
          }
        }

        rules.forEach((rule, i) => {
          const { lhs, rhs } = rule;
          if (!nts.has(lhs)) return;
          const fa = firstOfSeq(rhs, first);
          const rhsStr = rhs_(rule);

          // Entries from FIRST(α) \ {ε}
          for (const a of [...fa].sort()) {
            if (a === EPSILON) continue;
            addStep(lhs, a, i,
              '<span class="lg-op">add</span> M[<b>' + esc(lhs) + '</b>, <b>' + esc(a) + '</b>] = ' + i +
              ' <span class="lg-seen">' + esc(lhs) + ' → ' + esc(rhsStr) +
              ' — ' + esc(a) + ' ∈ FIRST(' + esc(rhsStr) + ')</span>');
          }

          // Entries from FOLLOW(A) when ε ∈ FIRST(α)
          if (fa.has(EPSILON)) {
            for (const b of [...(follow[lhs] || [])].sort()) {
              addStep(lhs, b, i,
                '<span class="lg-op">add</span> M[<b>' + esc(lhs) + '</b>, <b>' + esc(b) + '</b>] = ' + i +
                ' <span class="lg-seen">' + esc(lhs) + ' → ' + esc(rhsStr) +
                ' — ε ∈ FIRST(' + esc(rhsStr) + '), ' + esc(b) + ' ∈ FOLLOW(' + esc(lhs) + ')</span>');
            }
          }
        });

        const nEntries  = steps.filter((s) => s.type === "entry").length;
        const nConflicts = steps.filter((s) => s.type === "conflict").length;
        steps.push({
          type: "table-done",
          html: '<span class="lg-op">✓ Table complete</span> — ' + nEntries + ' entries' +
                (nConflicts ? ', ' + nConflicts + ' conflict(s)' : ''),
        });
        return steps;
      }

      // ── Apply stepping visual state ──────────────────────────────────
      function tApplySteps(upToIdx) {
        tFilled = new Set();
        const activeKey = upToIdx >= 0 && upToIdx < tSteps.length ? tSteps[upToIdx].key : null;
        for (let i = 0; i <= upToIdx && i < tSteps.length; i++) {
          const s = tSteps[i];
          if (s.key) tFilled.add(s.key);
        }
        const tbl = document.getElementById("ll1-table");
        if (!tbl) return;
        tbl.classList.add("is-stepping");
        tbl.querySelectorAll("td[data-nt]").forEach((td) => {
          const key = td.dataset.nt + ":" + td.dataset.term;
          td.classList.remove("is-filled", "is-active");
          if (key === activeKey) {
            td.classList.add("is-active");
            td.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
          } else if (tFilled.has(key)) {
            td.classList.add("is-filled");
          }
        });
      }

      function tClearStepping() {
        tFilled = new Set();
        const tbl = document.getElementById("ll1-table");
        if (!tbl) return;
        tbl.classList.remove("is-stepping");
        tbl.querySelectorAll("td").forEach((td) => td.classList.remove("is-filled", "is-active"));
      }

      // tSetLog, tSetBtns, tStep, tBack, tRunAll, tReset — defined in shared.js

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // TABLE RENDER  (LL-specific layout, shared table CSS)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function renderTables(g, ll1, first, follow) {
        const { rules, nonterminals: nts, terminals: terms } = g;
        const { table, conflicts } = ll1;
        const wrap = document.getElementById("tables-wrap");
        wrap.innerHTML = "";

        // FIRST / FOLLOW
        const ffd = document.createElement("div");
        ffd.innerHTML = '<div class="tbl-section-label">First &amp; Follow</div>';
        const fft = document.createElement("table");
        fft.className = "parse-table";
        fft.innerHTML = '<thead><tr><th class="state-col">NT</th><th>FIRST</th><th>FOLLOW</th></tr></thead>';
        const ffb = document.createElement("tbody");
        [...nts]
          .sort()
          .forEach((nt) => {
            const tr = document.createElement("tr");
            const fs = [...first[nt]].filter((s) => s !== EPSILON).sort();
            const ls = [...(follow[nt] || [])].sort();
            tr.innerHTML = '<td class="state-cell">' + esc(nt) + "</td>" + '<td class="goto-cell" style="text-align:left;padding-left:6px">{ ' + (esc(fs.join(", ")) || "&mdash;") + " }</td>" + '<td class="goto-cell" style="text-align:left;padding-left:6px;color:var(--green)">{ ' + (esc(ls.join(", ")) || "&mdash;") + " }</td>";
            ffb.appendChild(tr);
          });
        fft.appendChild(ffb);
        ffd.appendChild(fft);
        wrap.appendChild(ffd);

        // Productions
        const rd = document.createElement("div");
        rd.innerHTML = '<div class="tbl-section-label">Productions</div><div id="rules-list"></div>';
        wrap.appendChild(rd);
        const rl = rd.querySelector("#rules-list");
        rules.forEach((r, i) => {
          const line = document.createElement("div");
          line.innerHTML = '<span class="ri">' + i + ':</span><span class="rule">' + esc(r.lhs) + " \u2192 " + esc(r.rhs.join(" ") || EPSILON) + "</span>";
          rl.appendChild(line);
        });

        // LL(1) predictive table
        const td2 = document.createElement("div");
        td2.innerHTML = '<div class="tbl-section-label">Predictive Table M[A, a]</div>';
        wrap.appendChild(td2);

        const ntsArr = [...nts].sort();
        const termsArr = [...terms].filter((t) => t !== "$").sort();
        termsArr.push("$");

        const tbl = document.createElement("table");
        tbl.className = "parse-table";
        tbl.id = "ll1-table";
        let hdr = '<thead><tr><th class="state-col">NT</th>';
        for (const t of termsArr) hdr += "<th>" + esc(t) + "</th>";
        hdr += "</tr></thead>";
        tbl.innerHTML = hdr;
        const tb = document.createElement("tbody");

        for (const nt of ntsArr) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td class="state-cell">' + esc(nt) + "</td>";
          for (const t of termsArr) {
            const td = document.createElement("td");
            td.dataset.nt = nt;
            td.dataset.term = t;
            const val = table[nt] && table[nt][t];
            if (val === undefined) {
            } else if (Array.isArray(val)) {
              td.textContent = val.join("/");
              td.className = "conflict";
              td.title = "Conflict: productions " + val.join(", ");
            } else {
              // Show the production compactly
              const r = rules[val];
              td.textContent = String(val);
              td.className = "rule-cell";
              td.title = r.lhs + " \u2192 " + (r.rhs.join(" ") || EPSILON);
            }
            tr.appendChild(td);
          }
          tb.appendChild(tr);
        }
        tbl.appendChild(tb);
        td2.appendChild(tbl);

        if (conflicts.length) {
          const cd = document.createElement("div");
          cd.innerHTML = '<div class="tbl-section-label" style="color:var(--red)">' + conflicts.length + " Conflict(s) — grammar is not LL(1)</div>";
          const ul = document.createElement("div");
          ul.style.cssText = "font-size:var(--fs-2xs);color:var(--red);line-height:1.8";
          for (const c of conflicts) ul.innerHTML += "<div>M[" + esc(c.nt) + ", " + esc(c.sym) + "]: rules " + c.rules.join(", ") + "</div>";
          cd.appendChild(ul);
          wrap.appendChild(cd);
        }
      }

      // renderTree is provided by shared.js (see SHARED:PARSE-TREE section)

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // LL(1) SIMULATION ENGINE  (LL-specific)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // Stack contains symbols (strings). Top of stack = last element.
      // Frontier: flat list of tree leaf-node refs in left-to-right order,
      // maintained in parallel with the symbol stack for tree building.

      let simTable = null;
      let simRules = null;
      let simHistory = [];
      let simStack = []; // symbol stack, top = last
      let simFront = []; // parallel tree-node refs for top of stack
      let simPos = 0;
      let simTokens = [];
      let simDone = false;
      let simInitialized = false; // true only after simReset() successfully sets up a run
      let derivSteps = []; // { form: string[], action: string, stepClass }

      // tokenise — defined in shared.js

      // renderSimTokens — defined in shared.js

      function renderSimStack() {
        const el = document.getElementById("sim-stack");
        el.innerHTML = "";
        // Display stack bottom-to-top left-to-right; top is last
        [...simStack].reverse().forEach((sym, i) => {
          const b = document.createElement("span");
          const isTop = i === 0;
          const isTerm = currentGrammar && !currentGrammar.nonterminals.has(sym);
          b.className = "ui-badge" + (sym === "$" ? " ui-badge--dead" : isTop ? " ui-badge--active" : isTerm ? " ui-badge--accept" : "");
          b.textContent = sym;
          el.appendChild(b);
        });
      }

      // setSimLog — defined in shared.js

      function simSetBtns() {
        const notReady = simDone || !simTable || !simInitialized;
        document.getElementById("btn-step").disabled = notReady;
        document.getElementById("btn-run").disabled  = notReady;
        document.getElementById("btn-back").disabled = simHistory.length === 0;
      }

      function addDerivStep(form, action, cls) {
        derivSteps.push({ form: [...form], action, cls });
        renderDerivSteps();
      }

      function renderDerivSteps() {
        const area = document.getElementById("deriv-steps");
        area.innerHTML = "";
        document.getElementById("deriv-empty").style.display = derivSteps.length ? "none" : "";
        document.getElementById("deriv-head").style.display  = derivSteps.length ? ""     : "none";
        derivSteps.forEach((step, i) => {
          const div = document.createElement("div");
          div.className = "deriv-step" + (i === derivSteps.length - 1 ? " current" : "") + (step.cls ? " " + step.cls : "");
          // Highlight the leftmost nonterminal in the form
          let formHtml = step.form
            .map((sym, j) => {
              if (j === 0 && currentGrammar && currentGrammar.nonterminals.has(sym)) return '<span class="ds-focus">' + esc(sym) + "</span>";
              return esc(sym);
            })
            .join(" ");
          div.innerHTML = '<span class="ds-num">' + (i + 1) + "</span>" + '<span class="ds-form">' + formHtml + "</span>" + '<span class="ds-action">' + esc(step.action) + "</span>";
          area.appendChild(div);
        });
        // Scroll last step into view
        const last = area.lastElementChild;
        if (last) last.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      function findTreeNode(root, id) {
        if (!root) return null;
        if (root.id === id) return root;
        for (const c of root.children) {
          const f = findTreeNode(c, id);
          if (f) return f;
        }
        return null;
      }

      function simSnapshot() {
        simHistory.push({
          stack: [...simStack],
          frontIds: simFront.map((n) => n.id),
          pos: simPos,
          done: simDone,
          log: document.getElementById("sim-log").textContent,
          logCls: document.getElementById("sim-log").className,
          deriv: derivSteps.map((s) => ({ form: [...s.form], action: s.action, cls: s.cls })),
          tree: treeSnapshot(),
        });
      }

      function simReset() {
        simInitialized = false;
        const raw = document.getElementById("sim-input").value;
        try {
          simTokens = tokenise(raw);
        } catch (e) {
          setSimLog(e.message, "error");
          simSetBtns();
          return;
        }

        simStack = [];
        simFront = [];
        simPos = 0;
        simDone = false;
        simHistory = [];
        derivSteps = [];
        document.getElementById("deriv-steps").innerHTML = "";
        document.getElementById("deriv-empty").style.display = "";
        treeReset();
        clearHi();

        if (simTable && currentGrammar) {
          // Push $ then start symbol onto stack
          simStack = ["$", currentGrammar.start]; // [$, S]

          // Init tree: create root for start symbol
          treeInit(currentGrammar.start, null);
          simFront = [treeRoot]; // frontier starts with just the root

          addDerivStep([currentGrammar.start], "initial sentential form", "");
          renderSimTokens();
          renderSimStack();
          renderTree();
          setSimLog("Ready \u2014 press Step", "");
          simInitialized = true;
        }
        simSetBtns();
      }

      function simClear() {
        simInitialized = false;
        simTokens = []; simStack = []; simFront = []; simPos = 0;
        simDone = false; simHistory = []; derivSteps = [];
        document.getElementById("deriv-steps").innerHTML = "";
        document.getElementById("deriv-empty").style.display = "";
        document.getElementById("deriv-head").style.display  = "none";
        treeReset(); clearHi();
        renderSimTokens(); renderSimStack();
        setSimLog("", "");
        simSetBtns();
      }

      function simBack() {
        if (!simHistory.length) return;
        const snap = simHistory.pop();
        simStack = snap.stack;
        simPos = snap.pos;
        simDone = snap.done;
        derivSteps = snap.deriv;
        treeRestore(snap.tree);
        simFront = snap.frontIds.map((id) => findTreeNode(treeRoot, id)).filter(Boolean);
        renderSimTokens();
        renderSimStack();
        renderDerivSteps();
        renderTree();
        setSimLog(snap.log, snap.logCls);
        simSetBtns();
        clearHi();
      }

      function clearHi() {
        document.querySelectorAll(".parse-table td.highlighted").forEach((td) => td.classList.remove("highlighted"));
        document.querySelectorAll(".parse-table tr.highlighted-row").forEach((tr) => tr.classList.remove("highlighted-row"));
      }

      function hiTableCell(nt, term) {
        clearHi();
        const td = document.querySelector('.parse-table td[data-nt="' + nt + '"][data-term="' + term + '"]');
        if (!td) return;
        td.classList.add("highlighted");
        if (td.closest) td.closest("tr")?.classList.add("highlighted-row");
        try {
          td.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
        } catch (e) {}
      }

      function simRunAll() {
        let guard = 10000;
        while (!simDone && simTable && --guard > 0) simStep();
      }

      function simStep() {
        if (simDone || !simTable) return;
        const token = simTokens[simPos];
        simSnapshot();
        const act = ll1Step(currentGrammar, simTable, simStack, simTokens, simPos);

        if (act.type === "accept") {
          setSimLog("\u2713 Accepted!", "accept");
          addDerivStep([], "accepted", "accepted");
          simDone = true;
          simSetBtns();
          renderTree();
          return;
        }

        if (act.type === "match") {
          simStack.pop();
          simFront.shift(); // consumed leaf
          simPos++;
          renderSimTokens();
          renderSimStack();
          treeLastNew = [];
          renderTree();
          // Update deriv: replace top terminal with nothing (it's consumed)
          const cur = derivSteps[derivSteps.length - 1]?.form || [];
          addDerivStep(cur.slice(1), 'match "' + token + '"', "");
          setSimLog('Match  "' + token + '"', "match");
          simSetBtns();
          return;
        }

        if (act.type === "error") {
          setSimLog(
            act.reason === "mismatch"
              ? 'Error: expected "' + act.expected + '", got "' + act.got + '"'
              : "Error: no rule for M[" + act.nt + ", " + act.token + "]",
            "error"
          );
          simDone = true;
          simSetBtns();
          return;
        }

        // act.type === "expand"
        const { nt: top, ruleIdx: ri, rule } = act;

        hiTableCell(top, token);

        // Pop the nonterminal, push rhs in reverse (so leftmost is on top)
        simStack.pop();
        const nodeRef = simFront.shift(); // the tree node for this NT

        // Expand in tree
        treeExpand(nodeRef, rule.rhs, ri);

        // Push rhs symbols and their tree nodes onto stack/frontier
        // ε is never pushed — an ε-production pops the NT and adds nothing
        const expansion = rule.rhs.filter((s) => s !== EPSILON);
        const newNodes = nodeRef.children.filter((c) => c.symbol !== EPSILON);
        for (let i = expansion.length - 1; i >= 0; i--) simStack.push(expansion[i]);
        simFront = [...newNodes, ...simFront];

        // Update sentential form for derivation display
        // Use expansion (not rule.rhs) so ε never appears in the displayed form
        const prev = derivSteps[derivSteps.length - 1]?.form || [top];
        const newForm = [...expansion, ...prev.slice(1)];
        addDerivStep(newForm, top + " \u2192 " + (rule.rhs.join(" ") || EPSILON) + "  (" + ri + ")", "");

        renderSimStack();
        renderTree();
        setSimLog("Expand  " + top + "  \u2192  " + (rule.rhs.join(" ") || EPSILON) + "  (" + ri + ")", "expand");
        simSetBtns();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // CONTROLLER  (LL-specific)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      let currentGrammar = null;

      function setError(msg) {
        document.getElementById("error-msg").textContent = msg || "";
      }

      function build() {
        setError("");
        const text = document.getElementById("grammar-input").value.trim();
        try {
          currentGrammar = parseBNF(text, false);
        } catch (e) {
          setError(e.message);
          return;
        }
        saveShare();
        const first = computeFirst(currentGrammar);
        const follow = computeFollow(currentGrammar, first);
        const ll1 = buildLL1Table(currentGrammar, first, follow);
        simTable = ll1.table;
        simRules = currentGrammar.rules;
        simReset();
        renderTables(currentGrammar, ll1, first, follow);
        // Wire step engine — recordTableSteps runs after renderTables so the
        // ll1-table DOM element exists and tbl.id has been set.
        tSteps = recordTableSteps(currentGrammar, first, follow);
        tStepIdx = -1;
        tClearStepping();
        tSetLog("");
        tSetBtns();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // PSEUDOCODE MODAL
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // kw, sym, it, cm, hi, _la/_dot/_ra/…, pcBlock — all from shared.js SHARED:PSEUDOCODE

      // PC_FIRST — defined in shared.js

      // PC_FOLLOW — defined in shared.js

      // ── Build predictive table ─────────────────────────────────────
      const PC_LL1_TABLE = pcBlock(
        "Build-Table",
        [
          { label: "Input", sym: it("G"), desc: "the grammar" },
          { label: "", sym: "First", desc: "the First function" },
          { label: "", sym: "Follow", desc: "the Follow function" },
          {
            label: "Output",
            sym: "M[A, a]",
            desc: "for each nonterminal A and terminal a, the production to apply when A is on top of the stack and a is the current input symbol; errors are left empty",
          },
        ],
        `${kw("for each")} production A ${_ra} α ${_in} G
  ${kw("for each")} terminal ${it("a")} ${_in} First(α) \\ {${_eps}}
    M[A, ${it("a")}] ${_la} A ${_ra} α
  ${kw("if")} ${_eps} ${_in} First(α)
    ${kw("for each")} b ${_in} Follow(A)
      M[A, b] ${_la} A ${_ra} α${cm("A can vanish; use it when b follows")}

Any cell M[A, a] with more than one entry is a conflict — the grammar is not LL(1)`,
      );

      // ── LL parsing ─────────────────────────────────────────────────
      const PC_LL_PARSE = pcBlock(
        "LL-Parse",
        [
          { label: "Input", sym: it("w"), desc: "the input token sequence, terminated with $" },
          { label: "", sym: "M[A, a]", desc: "the predictive parsing table" },
          {
            label: "Output",
            sym: "",
            desc: "a leftmost derivation of " + it("w") + ", or an error report if " + it("w") + " ∉ L(G)",
          },
        ],
        `stack ${_la} [$, S]${cm("S is the start symbol; top at right")}
${it("a")}     ${_la}  first symbol of ${it("w")}$

${kw("loop")}
  X ${_la} top(stack)

  ${kw("if")} X is a terminal  ${cm("including $")}
    ${kw("if")} X = ${it("a")}
      pop X from stack
      advance ${it("a")} to the next input symbol${cm("match")}
    ${kw("else")}  error()${cm("terminal mismatch")}

  ${kw("else")}  ${cm("X is a nonterminal")}
    ${kw("if")} M[X, ${it("a")}] = X ${_ra} Y₁ Y₂ … Yₙ
      pop X from stack
      push Yₙ, Yₙ₋₁, … , Y₁ onto stack${cm("leftmost symbol ends on top")}
      output production X ${_ra} Y₁ Y₂ … Yₙ${cm("expand")}
    ${kw("else")}  error()${cm("no rule in table")}

  ${kw("if")} stack = [$] and ${it("a")} = $  ${kw("return")} success`,
      );

      // ── Modal open / close ─────────────────────────────────────────
      function openAlgoModal(type) {
        const overlay = document.getElementById("algo-overlay");
        const titleEl = document.getElementById("algo-title");
        const subtitleEl = document.getElementById("algo-subtitle");
        const bodyEl = document.getElementById("algo-body");

        if (type === "table") {
          titleEl.textContent = "First, Follow & Predictive Table";
          subtitleEl.textContent = "LL(1)";
          bodyEl.innerHTML = PC_FIRST + PC_FOLLOW + PC_LL1_TABLE + '<div class="pc-note">A grammar is LL(1) if and only if Build-Table produces no conflicts. ' + "Common causes: left recursion (A " + _ra + " Aα) and non-left-factored alternatives that share a terminal in First.</div>";
        } else if (type === "parse") {
          titleEl.textContent = "LL(1) Parsing";
          subtitleEl.textContent = "predictive, top-down";
          bodyEl.innerHTML = PC_LL_PARSE + '<div class="pc-note">The derivation steps shown in the tool correspond to each Expand action: the current sentential form is updated by replacing the leftmost nonterminal with the chosen production\'s right-hand side.</div>';
        }
        overlay.classList.remove("hidden");
        var closeBtn = overlay.querySelector(".algo-close");
        if (closeBtn) closeBtn.focus(); else overlay.focus();
      }

      // closeAlgoModal — defined in shared.js

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAlgoModal();
      });
      // Arrow-key stepping comes from shared.js (registerStepper): the panel with key focus
      // (tinted header) steps; click a panel or press T to move it.
      registerStepper("p-tables", { step: tStep, back: tBack, reset: tReset, end: tRunAll });
      registerStepper("p-tree", { step: simStep, back: simBack, reset: simReset, end: simRunAll }, { primary: true });

      // Global error handler — shows errors in the grammar panel
      window.onerror = function (msg, src, line, col, err) {
        if (line === 0 && !src) return false;
        const el = document.getElementById("error-msg");
        let detail = err ? err.message : msg;
        if (src) detail += " \u2014 " + src.split("/").pop() + ":" + line;
        if (el) el.textContent = detail;
        return false;
      };

      // ── Shareable link ────────────────────────────────────────────────────
      const saveShare = createShareSaver(() => ({
        g: document.getElementById("grammar-input").value,
        s: document.getElementById("sim-input").value,
      }));
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g");
        if (!st) return;
        document.getElementById("grammar-input").value = st.g;
        document.getElementById("sim-input").value = st.s;
      }

      window.addEventListener("load", () => {
        loadPanelState();
        initAlgoModal();
        loadExamplesInto("../examples/examples-ll1.json", "examples-select", EXAMPLES);
        document.getElementById("grammar-input").value = "E -> T E'\nE' -> + T E' | eps\nT -> F T'\nT' -> * F T' | eps\nF -> id";
        applyShareState();
        build();
        // Initialise tree zoom (defined in shared.js)
        if (typeof initTreeZoom === "function") initTreeZoom();
        // Auto-rebuild while editing (debounced so partial input doesn't spam errors)
        let _rebuildTimer = null;
        document.getElementById("grammar-input").addEventListener("input", () => {
          clearTimeout(_rebuildTimer);
          _rebuildTimer = setTimeout(build, 400);
        });
        UI.stringInput("sim-input", {
          random: randomSentence,
          examples: () => sampleSentences(6),
          heading: "Random sentences",
          onPick: () => { saveShare(); simReset(); },
        });
        // Clear sim immediately on each keystroke; re-initialize after typing pauses
        let _simInputTimer = null;
        document.getElementById("sim-input").addEventListener("input", () => {
          saveShare();
          simClear();
          clearTimeout(_simInputTimer);
          _simInputTimer = setTimeout(simReset, 300);
        });
      });
    </script>
  </body>
</html>
