<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive grammar transformation tool — ε-elimination, unit production elimination, Chomsky Normal Form, and left-recursion elimination with step-by-step visualisation.">
<title>Grammar Transformations | Parser Tools</title>
<link rel="stylesheet" href="../shared/shared.css">
<link rel="stylesheet" href="../shared/ui.css">
<script src="../shared/theme.js"></script>
<style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-main { --pw: 880; --pmin: 300px; }
      #p-result { --pw: 300; --pmin: 200px; }

/* Override p-tables width for result panel */
#p-result { width: 300px; }

/* Step log */
#step-area {
  flex: 1; overflow-y: auto;
  padding: var(--sp-5) var(--sp-6);
  background: var(--bg);
}

.step-entry {
  padding: var(--sp-3) 0 var(--sp-3) 0;
  border-bottom: 1px solid var(--border-lo);
  font-size: var(--fs-xs);
  line-height: 1.65;
  font-family: var(--font-mono);
}
.step-entry .step-num {
  color: var(--text-lo); font-style: italic;
  min-width: 24px; display: inline-block;
  font-size: var(--fs-2xs);
}
.step-entry .step-phase {
  font-family: var(--font-serif); font-style: italic;
  color: var(--text-dim); font-size: var(--fs-xs);
  display: block; margin-bottom: 1px;
}
.step-entry.phase-hdr { background: var(--bg-panel); }
.step-entry.phase-hdr .step-detail { color: var(--text-dim); font-style: italic; }
.step-entry.current {
  background: var(--accent-bg);
  border-left: 2px solid var(--accent);
  padding-left: var(--sp-4); margin-left: -10px;
}/* Symbol badges *//* Step controls */

/* Grammar result panel */
#grammar-display {
  flex: 1; overflow-y: auto;
  padding: var(--sp-5) var(--sp-5);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
}
.gr-section {
  font-family: var(--font-serif); font-style: italic;
  color: var(--text-dim); font-size: var(--fs-xs);
  border-bottom: 1px solid var(--border-lo);
  padding-bottom: var(--sp-1); margin-bottom: var(--sp-3); margin-top: var(--sp-5);
}
.gr-section:first-child { margin-top: 0; }
.gr-rule {
  display: flex; gap: var(--sp-3); align-items: baseline;
  line-height: 1.9; padding: 0 1px;
  border-left: 2px solid transparent;
  padding-left: var(--sp-2);
}
.gr-rule .r-lhs  { color: var(--text);     min-width: 50px; flex-shrink: 0; }
.gr-rule .r-arr  { color: var(--text-lo); flex-shrink: 0; }
.gr-rule .r-rhs  { color: var(--text-dim); }
.gr-rule.r-new   { background: var(--green-bg);  border-left-color: var(--green);  }
.gr-rule.r-new .r-lhs, .gr-rule.r-new .r-rhs  { color: var(--green); }
.gr-rule.r-active{ background: var(--accent-bg); border-left-color: var(--accent); }
.gr-rule.r-active .r-lhs, .gr-rule.r-active .r-rhs { color: var(--accent); }
</style>
</head>
<body>

<div id="topbar">
  <h1><a href="../index.html">Grammar Rewriting</a></h1>
  <span class="tag">Grammar Transformations</span>
  <div style="width:1px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0"></div>
  <button class="mode-btn active" id="btn-mode-clean" onclick="setMode('clean')">Cleanup</button>
  <button class="mode-btn"        id="btn-mode-eps"   onclick="setMode('eps')">ε-Elimination</button>
  <button class="mode-btn"        id="btn-mode-unit"  onclick="setMode('unit')">Unit Elim</button>
  <button class="mode-btn"        id="btn-mode-cnf"   onclick="setMode('cnf')">CNF</button>
  <button class="mode-btn"        id="btn-mode-lre"   onclick="setMode('lre')">Left Recursion</button>
</div>

<div id="panels">

  <!-- 1. Grammar input -->
  <div class="panel" id="p-grammar" data-priority="2" data-collapse="left">
    <div class="panel-header">
      <span class="panel-title">Grammar</span>
      <button class="collapse-btn" onclick="event.stopPropagation();toggleCollapse('p-grammar')">&#8249;</button>
    </div>
    <div class="panel-body">
      <div id="examples-bar">
        <select id="examples-select" onchange="loadExample(this.value)">
          <option value="">Example Grammar</option>
        </select>
      </div>
      <textarea id="grammar-input" spellcheck="false" placeholder="S -> A B&#10;A -> a | eps&#10;B -> b"></textarea>
      <div id="grammar-footer">
        <div id="error-msg"></div>
      </div>
    </div>
  </div>

  <div class="resize-handle" id="rh-1"></div>

  <!-- 2. Step log -->
  <div class="panel" id="p-main" data-priority="3">
    <div class="panel-header">
      <span class="panel-title" id="main-title">ε-Production Elimination</span>
      <button class="algo-btn" id="btn-algo" onclick="openAlgoModal()" title="Algorithm for the current sub-tool">Algorithm</button>
      <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-main');">&#8250;</button>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;overflow:hidden;">
      <div id="step-area">
        <div id="step-empty" class="ui-empty">Build a grammar, then step through the algorithm.</div>
        <div id="step-log"></div>
      </div>
      <div id="step-controls" class="ui-controlbar">
        <div class="step-group">
          <button class="btn icon-restart" id="btn-reset" onclick="resetSim()" title="Restart" disabled></button>
          <button class="btn" id="btn-back"  onclick="stepBack()"  disabled>&#8249; Back</button>
          <button class="btn primary" id="btn-step"  onclick="stepFwd()"   disabled>Step &#8250;</button>
          <button class="btn icon-run-all" id="btn-run" onclick="runAll()" title="Run all" disabled></button>
        </div>
      </div>
    </div>
  </div>

  <div class="resize-handle" id="rh-2"></div>

  <!-- 3. Result grammar -->
  <div class="panel" id="p-result" data-priority="1">
    <div class="panel-header">
      <span class="panel-title">Current Grammar</span>
      <button class="collapse-btn" onclick="event.stopPropagation();toggleCollapse('p-result')">&#8250;</button>
    </div>
    <div class="panel-body">
      <div id="grammar-display">
        <div class="ui-empty">Build a grammar to see it here.</div>
      </div>
    </div>
  </div>

</div><!-- #panels -->

<div class="algo-overlay hidden" id="algo-overlay" tabindex="-1" onclick="if (event.target === this) closeAlgoModal();">
  <div class="algo-modal" role="dialog" aria-modal="true" aria-labelledby="algo-title">
    <div class="algo-modal-head">
      <h2 id="algo-title"></h2>
      <span class="algo-subtitle" id="algo-subtitle"></span>
      <button class="algo-close" onclick="closeAlgoModal()" title="Close (Esc)">&#x2715;</button>
    </div>
    <div class="algo-modal-body" id="algo-body"></div>
  </div>
</div>

<script src="../shared/algo/grammar.js"></script>
<script src="../shared/algo/panels.js"></script>
<script src="../shared/algo/share.js"></script>
<script src="../shared/algo/rewrite.js"></script>
<script src="../shared/shared.js"></script>
<script src="../shared/share-link.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/view-menu.js"></script>
<script>
'use strict';

// ── Panel init ────────────────────────────────────────────────
// shared.js's initResize calls renderTree() after drag — stub it out
function renderTree() {}

initResize('rh-1', 'p-grammar', +1);
initResize('rh-2', 'p-result',  -1);

// Panel layout comes from shared.js; the chosen transformation is remembered separately.
initPanelStorage('grammar-rewrite-v1');
const MODE_KEY = 'grammar-rewrite-mode';

// parseGrammarRaw, ruleStr, cloneRules — see shared/algo/rewrite.js

// ── Example grammars ──────────────────────────────────────────
const EXAMPLES = {};

function loadExample(k) {
  if (!k) return;
  document.getElementById('grammar-input').value = (EXAMPLES[k] && EXAMPLES[k].text) || '';
  document.getElementById('examples-select').value = '';
  setError('');
  build();
}

// ── Global state ──────────────────────────────────────────────
let currentMode    = 'clean';
let inputGrammar   = null;   // original parsed grammar, never mutated
let simSteps       = [];     // pre-computed step objects
let simPos         = 0;      // next step to show (0 = none shown yet)
let stepHistory    = [];     // stack of simPos values for Back

// Step object:
// { phase, html, isPhase, grammarAfter, newRules, activeRules }
//   phase: string shown as italic header above detail text (or '')
//   html: inner HTML for .step-detail
//   isPhase: true → lighter background (section header)
//   grammarAfter: cloned rules array after this step
//   newRules: indices into grammarAfter of newly added rules (shown green)
//   activeRules: indices into grammarAfter of focussed rules (shown blue)

// ── Mode switching ────────────────────────────────────────────
const MODE_TITLES = {
  clean: 'Grammar Cleanup',
  eps:   'ε-Production Elimination',
  unit:  'Unit Production Elimination',
  cnf:   'Chomsky Normal Form',
  lre:   'Left-Recursion Elimination',
};

function setMode(m) {
  currentMode = m;
  ['clean','eps','unit','cnf','lre'].forEach(mm => {
    document.getElementById('btn-mode-' + mm).classList.toggle('active', mm === m);
  });
  document.getElementById('main-title').textContent = MODE_TITLES[m];
  if (inputGrammar) resetSim();
  try { localStorage.setItem(MODE_KEY, m); } catch(e) {}
  saveShare();
}

function setError(msg) { document.getElementById('error-msg').textContent = msg || ''; }

// ── Build ─────────────────────────────────────────────────────
function build() {
  setError('');
  const text = document.getElementById('grammar-input').value.trim();
  try { inputGrammar = parseGrammarRaw(text); }
  catch(e) { setError(e.message); inputGrammar = null; updateBtns(); return; }
  saveShare();
  resetSim();
}

// ── Shareable link ────────────────────────────────────────────
const saveShare = createShareSaver(() => ({
  g: document.getElementById('grammar-input').value,
  m: currentMode,
}));

// Restore grammar and transformation from the link; returns true if one was applied.
function applyShareState() {
  const st = shareValidateTextState(readShareState(), 'g', Object.keys(MODE_TITLES));
  if (!st) return false;
  document.getElementById('grammar-input').value = st.g;
  if (st.m) setMode(st.m);
  build();
  return true;
}

function resetSim() {
  stepHistory = []; simPos = 0;
  document.getElementById('step-log').innerHTML = '';
  document.getElementById('step-empty').style.display = '';
  if (!inputGrammar) { updateBtns(); return; }

  if (currentMode === 'clean') simSteps = computeCleanupSteps(inputGrammar);
  if (currentMode === 'eps')   simSteps = computeEpsSteps(inputGrammar);
  if (currentMode === 'unit')  simSteps = computeUnitSteps(inputGrammar);
  if (currentMode === 'cnf')   simSteps = computeCNFSteps(inputGrammar);
  if (currentMode === 'lre')   simSteps = computeLRESteps(inputGrammar);

  renderGrammarDisplay(inputGrammar.rules, [], []);
  updateBtns();
}

function updateBtns() {
  const ok = !!inputGrammar && simSteps.length > 0;
  document.getElementById('btn-step') .disabled = !ok || simPos >= simSteps.length;
  document.getElementById('btn-back') .disabled = stepHistory.length === 0;
  document.getElementById('btn-run')  .disabled = !ok || simPos >= simSteps.length;
  document.getElementById('btn-reset').disabled = !inputGrammar;
}

// ── Rendering ─────────────────────────────────────────────────
function renderGrammarDisplay(rules, newIndices, activeIndices) {
  const el = document.getElementById('grammar-display');
  el.innerHTML = '';
  if (!rules.length) {
    el.innerHTML = '<div class="ui-empty">Empty grammar</div>';
    return;
  }

  const ns = new Set(newIndices    || []);
  const as = new Set(activeIndices || []);

  el.appendChild(Object.assign(document.createElement('div'), {
    className: 'gr-section', textContent: 'Productions'
  }));

  // Group by LHS for display (still track flat index)
  const lhsSeen = new Set();
  const lhsOrder = [];
  for (const r of rules) { if (!lhsSeen.has(r.lhs)) { lhsSeen.add(r.lhs); lhsOrder.push(r.lhs); } }

  rules.forEach((r, idx) => {
    const lhsRules = rules.filter(x => x.lhs === r.lhs);
    const posInGroup = lhsRules.indexOf(r);

    const div = document.createElement('div');
    div.className = 'gr-rule' + (ns.has(idx) ? ' r-new' : as.has(idx) ? ' r-active' : '');

    const lhsSpan = document.createElement('span');
    lhsSpan.className = 'r-lhs';
    lhsSpan.textContent = posInGroup === 0 ? r.lhs : '';
    div.appendChild(lhsSpan);

    const arrSpan = document.createElement('span');
    arrSpan.className = 'r-arr';
    arrSpan.textContent = posInGroup === 0 ? '→' : '|';
    div.appendChild(arrSpan);

    const rhsSpan = document.createElement('span');
    rhsSpan.className = 'r-rhs';
    rhsSpan.textContent = r.rhs.length ? r.rhs.join(' ') : EPSILON;
    div.appendChild(rhsSpan);

    el.appendChild(div);
  });
}

function appendStepEntry(idx) {
  const step = simSteps[idx];
  const log = document.getElementById('step-log');
  document.getElementById('step-empty').style.display = 'none';
  log.querySelectorAll('.step-entry.current').forEach(e => e.classList.remove('current'));

  const div = document.createElement('div');
  div.className = 'step-entry current' + (step.isPhase ? ' phase-hdr' : '');

  let inner = '<span class="step-num">' + (idx + 1) + '</span>';
  if (step.phase) inner += '<span class="step-phase">' + step.phase + '</span>';
  inner += '<span class="step-detail">' + step.html + '</span>';
  div.innerHTML = inner;
  log.appendChild(div);
  div.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ── Step engine ───────────────────────────────────────────────
function stepFwd() {
  if (simPos >= simSteps.length) return;
  stepHistory.push(simPos);
  appendStepEntry(simPos);
  const step = simSteps[simPos];
  renderGrammarDisplay(step.grammarAfter, step.newRules || [], step.activeRules || []);
  simPos++;
  updateBtns();
}

function stepBack() {
  if (!stepHistory.length) return;
  simPos = stepHistory.pop();

  // Rebuild log up to simPos
  const log = document.getElementById('step-log');
  log.innerHTML = '';
  if (simPos === 0) {
    document.getElementById('step-empty').style.display = '';
    renderGrammarDisplay(inputGrammar.rules, [], []);
  } else {
    document.getElementById('step-empty').style.display = 'none';
    for (let i = 0; i < simPos; i++) appendStepEntry(i);
    const prev = simSteps[simPos - 1];
    renderGrammarDisplay(prev.grammarAfter, prev.newRules || [], prev.activeRules || []);
  }
  updateBtns();
}

function runAll() {
  while (simPos < simSteps.length) stepFwd();
}

// computeCleanupSteps, computeEpsSteps, computeUnitSteps, computeCNFSteps and
// computeLRESteps — see shared/algo/rewrite.js

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ALGORITHM PSEUDOCODE
// kw, sym, it, cm, hi, _la/_ra/_eps/…, pcBlock — from shared.js
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ── Cleanup ───────────────────────────────────────────────────
const PC_PRODUCTIVE = pcBlock(
  'Productive',
  [
    { label: 'Input',  sym: it('G'),    desc: 'the grammar (rules P, nonterminals N)' },
    { label: 'Output', sym: 'prod',     desc: 'the subset of N whose members can derive a non-empty string of terminals (a nonterminal with only ε-rules is productive, but it still has a derivation)' },
  ],
  `prod ${_la} ${_emp}
${kw('repeat')}
  ${kw('for each')} rule A ${_ra} X₁ X₂ … Xₙ ${_in} G
    ${kw('if')} every Xᵢ is a terminal or Xᵢ ${_in} prod${cm('ε-rule (n=0): vacuously true')}
      add A to prod
${kw('until')} prod unchanged
remove every rule where LHS ${_nin} prod or any RHS nonterminal ${_nin} prod
${kw('return')} prod`
);

const PC_REACHABLE = pcBlock(
  'Reachable',
  [
    { label: 'Input',  sym: it('G'),    desc: 'grammar after unproductive-rule removal' },
    { label: '',       sym: it('S'),    desc: 'the start symbol' },
    { label: 'Output', sym: 'reach',   desc: 'the subset of nonterminals reachable from S in a sentential form' },
  ],
  `reach ${_la} { ${it('S')} }
worklist ${_la} [ ${it('S')} ]
${kw('while')} worklist ${_neq} ${_emp}
  take A from worklist
  ${kw('for each')} rule A ${_ra} X₁ … Xₙ ${_in} G
    ${kw('for each')} nonterminal Xᵢ ${_nin} reach
      add Xᵢ to reach and to worklist
remove every rule whose LHS ${_nin} reach
${kw('return')} reach`
);

// ── ε-Production Elimination ──────────────────────────────────
const PC_NULLABLE = pcBlock(
  'Nullable',
  [
    { label: 'Input',  sym: it('G'),       desc: 'the grammar' },
    { label: 'Output', sym: 'nullable',    desc: 'the set of nonterminals A such that A ⇒* ε' },
  ],
  `nullable ${_la} { A ${_in} N | A ${_ra} ${_eps} ${_in} G }${cm('seed with direct ε-rules')}
${kw('repeat')}
  ${kw('for each')} rule A ${_ra} X₁ X₂ … Xₙ ${_in} G  (n ${_neq} 0)
    ${kw('if')} every Xᵢ ${_in} nullable: add A to nullable
${kw('until')} nullable unchanged
${kw('return')} nullable`
);

const PC_EPS_ELIM = pcBlock(
  'ε-Eliminate',
  [
    { label: 'Input',  sym: it('G'),       desc: 'grammar' },
    { label: '',       sym: 'nullable',    desc: 'nullable nonterminals' },
    { label: 'Output', sym: '',            desc: 'equivalent grammar without ε-productions' },
  ],
  `${kw('for each')} rule A ${_ra} X₁ X₂ … Xₙ  (n ${_neq} 0)
  let I ${_la} { i ${_in} [1..n] | Xᵢ ${_in} nullable }${cm('positions of nullable symbols')}
  ${kw('for each')} non-empty proper subset S ⊊ 2ᴵ${cm('omit full mask — that is the original rule')}
    let α ${_la} X₁…Xₙ with positions in S omitted
    ${kw('if')} |α| ≥ 1 and A ${_ra} α not present: add A ${_ra} α
remove all A ${_ra} ${_eps} rules${cm('keep S → ε if S ∈ nullable — language contains ε')}`
);

// ── Unit Production Elimination ───────────────────────────────
const PC_UNIT_PAIRS = pcBlock(
  'Unit-Pairs',
  [
    { label: 'Input',  sym: it('G'),    desc: 'grammar with nonterminal set N' },
    { label: 'Output', sym: 'pairs',   desc: '{ (A, B) | A ⇒* B using only unit productions A → B }' },
  ],
  `pairs ${_la} { (A, A) | A ${_in} N }${cm('reflexive base: every NT is its own unit pair')}
${kw('repeat')}
  ${kw('for each')} unit production A ${_ra} B ${_in} G
    ${kw('for each')} C such that (B, C) ${_in} pairs
      add (A, C) to pairs
${kw('until')} pairs unchanged
${kw('return')} pairs`
);

const PC_UNIT_ELIM = pcBlock(
  'Unit-Eliminate',
  [
    { label: 'Input',  sym: it('G'),    desc: 'grammar' },
    { label: '',       sym: 'pairs',   desc: 'unit pairs' },
    { label: 'Output', sym: '',        desc: 'equivalent grammar without unit productions A → B' },
  ],
  `${kw('for each')} (A, B) ${_in} pairs with A ${_neq} B
  ${kw('for each')} non-unit production B ${_ra} α ${_in} G
    ${kw('if')} A ${_ra} α not present: add A ${_ra} α
remove all unit productions A ${_ra} B`
);

// ── CNF phases 4–5 ────────────────────────────────────────────
const PC_CNF_TERMS = pcBlock(
  'Isolate-Terminals',
  [
    { label: 'Input',  sym: it('G'),  desc: 'grammar after ε- and unit-elimination' },
    { label: 'Output', sym: '',       desc: 'grammar where every rule with ≥ 2 RHS symbols contains only nonterminals' },
  ],
  `${kw('for each')} rule A ${_ra} X₁ … Xₙ with n ≥ 2
  ${kw('for each')} terminal Xᵢ in the rule
    ${kw('if')} Xᵢ not yet wrapped
      create fresh nonterminal X_t and rule X_t ${_ra} Xᵢ
    replace Xᵢ with its wrapper X_t`
);

const PC_CNF_BIN = pcBlock(
  'Binarise',
  [
    { label: 'Input',  sym: it('G'),  desc: 'grammar after terminal isolation' },
    { label: 'Output', sym: '',       desc: 'grammar in Chomsky Normal Form: every rule is A → BC or A → a' },
  ],
  `${kw('while')} ∃ rule A ${_ra} X₁ X₂ … Xₙ with n ≥ 3
  create fresh nonterminal Y
  replace A ${_ra} X₁ X₂ … Xₙ with
    A ${_ra} X₁ Y${cm('peel off the leftmost symbol')}
    Y ${_ra} X₂ … Xₙ${cm('recurse until binary')}`
);

// ── Left-Recursion Elimination ────────────────────────────────
const PC_LRE_DIRECT = pcBlock(
  'Eliminate-Direct-LR',
  [
    { label: 'Input',  sym: it('A'),   desc: 'a nonterminal and its current productions' },
    { label: 'Output', sym: '',        desc: 'equivalent rules with no direct left recursion, using a fresh tail nonterminal A′' },
  ],
  `partition rules for A into:
  ${it('left-recursive')}: A ${_ra} A α₁ ${_in} … ${_in} A αₖ
  ${it('base cases')}:     A ${_ra} β₁  ${_in} … ${_in} βₘ
${kw('if')} k = 0${cm('no direct left recursion — nothing to do')}
  ${kw('return')}
create fresh nonterminal A′
${kw('replace')} all rules for A with:
  A  ${_ra} β₁ A′ | … | βₘ A′${cm('each base case, followed by the tail')}
  A′ ${_ra} α₁ A′ | … | αₖ A′${cm('each recursive suffix, followed by the tail')}
  A′ ${_ra} ${_eps}${cm('allow the tail to terminate')}`
);

const PC_LRE = pcBlock(
  'Eliminate-Left-Recursion',
  [
    { label: 'Input',  sym: it('G'),   desc: 'grammar; works best after ε-elimination and unit elimination (ε-rules and cycles can cause unexpected results)' },
    { label: 'Output', sym: '',        desc: 'equivalent grammar with no left-recursive rules' },
  ],
  `order nonterminals: A₁, A₂, … , Aₙ${cm('any fixed order; first-appearance order is used here')}
${kw('for')} i ${_la} 1 to n
  ${kw('for')} j ${_la} 1 to i − 1
    ${kw('for each')} rule Aᵢ ${_ra} Aⱼ γ${cm('Aⱼ leads the rule')}
      ${kw('for each')} current rule Aⱼ ${_ra} δ: add Aᵢ ${_ra} δ γ${cm('substitute Aⱼ')}
    remove the original rules Aᵢ ${_ra} Aⱼ γ
  eliminate direct left recursion from Aᵢ${cm('see Eliminate-Direct-LR')}`
);

// ── Modal open / close ────────────────────────────────────────
function openAlgoModal() {
  const overlay   = document.getElementById('algo-overlay');
  const titleEl   = document.getElementById('algo-title');
  const subtitleEl = document.getElementById('algo-subtitle');
  const bodyEl    = document.getElementById('algo-body');

  if (currentMode === 'clean') {
    titleEl.textContent    = 'Grammar Cleanup';
    subtitleEl.textContent = 'productive & reachable symbols';
    bodyEl.innerHTML = PC_PRODUCTIVE + PC_REACHABLE +
      '<div class="pc-note">Productive removal must precede reachability: removing unproductive rules can sever the only path that made a nonterminal reachable, so running reachability first might miss deletions. Each phase uses its own fixpoint; no outer loop is needed.</div>';
  } else if (currentMode === 'eps') {
    titleEl.textContent    = 'ε-Production Elimination';
    subtitleEl.textContent = '';
    bodyEl.innerHTML = PC_NULLABLE + PC_EPS_ELIM +
      '<div class="pc-note">The ε-closure step adds every non-empty combination of the original rule with nullable positions omitted. The original rule itself is retained as-is; only A → ε rules are removed at the end.</div>';
  } else if (currentMode === 'unit') {
    titleEl.textContent    = 'Unit Production Elimination';
    subtitleEl.textContent = '';
    bodyEl.innerHTML = PC_UNIT_PAIRS + PC_UNIT_ELIM +
      '<div class="pc-note">A <em>unit production</em> is any rule of the form A → B where B is a single nonterminal. The pair (A, B) is a unit pair when A can reach B by a chain of such rules. Copying B\'s non-unit productions to A preserves the language before the unit rules are deleted.</div>';
  } else if (currentMode === 'cnf') {
    titleEl.textContent    = 'CNF Conversion — Phases 4 & 5';
    subtitleEl.textContent = 'terminal isolation & binarisation';
    bodyEl.innerHTML = PC_CNF_TERMS + PC_CNF_BIN +
      '<div class="pc-note">Phases 1–3 (cleanup, ε-elimination, unit elimination) are covered by the first three sub-tools. After those three phases every rule is either a unit production or has only nonterminals or a single terminal in its RHS; terminal isolation and binarisation then complete the CNF conversion.</div>';
  } else if (currentMode === 'lre') {
    titleEl.textContent    = 'Left-Recursion Elimination';
    subtitleEl.textContent = 'indirect & direct';
    bodyEl.innerHTML = PC_LRE + PC_LRE_DIRECT +
      '<div class="pc-note">The substitution pass (outer loop) converts any indirect left recursion into direct left recursion for A<sub>i</sub>; the inner pass then removes it. The result is guaranteed left-recursion-free for any ordering of the nonterminals. For grammars with ε-rules or unit cycles the result may contain ε-productions — run ε-elimination and unit elimination beforehand for cleanest output.</div>';
  }

  overlay.classList.remove('hidden');
  var closeBtn = overlay.querySelector('.algo-close');
  if (closeBtn) closeBtn.focus(); else overlay.focus();
}

function closeAlgoModal() {
  document.getElementById('algo-overlay').classList.add('hidden');
}

// ── Keyboard shortcuts ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAlgoModal(); return; }
  if (isAlgoModalOpen()) return;
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'l') { e.preventDefault(); stepFwd(); }
  else if (e.key === 'ArrowLeft' || e.key === 'h')  { e.preventDefault(); stepBack(); }
  else if (e.key === 'Enter') { e.preventDefault(); runAll(); }
});

// ── Error handler ─────────────────────────────────────────────
window.onerror = function(msg, src, line, col, err) {
  if (!line && !src) return false;
  const el = document.getElementById('error-msg');
  if (el) el.textContent = err ? err.message : msg;
  return false;
};

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadPanelState();
  initAlgoModal();
  try { const m = localStorage.getItem(MODE_KEY); if (m && MODE_TITLES[m]) setMode(m); } catch(e) {}
  applyShareState();
  loadExamplesInto('../examples/examples-grammar-rewrite.json', 'examples-select', EXAMPLES, () => {
    if (!document.getElementById('grammar-input').value.trim()) {
      const firstKey = Object.keys(EXAMPLES)[0];
      if (firstKey) { document.getElementById('grammar-input').value = EXAMPLES[firstKey].text; build(); }
    }
  });
  // Auto-rebuild while editing (debounced so partial input doesn't spam errors)
  let _rebuildTimer = null;
  document.getElementById('grammar-input').addEventListener('input', () => {
    clearTimeout(_rebuildTimer);
    _rebuildTimer = setTimeout(build, 400);
  });
});
</script>
