<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Derivations</title>
    <link rel="stylesheet" href="../../shared/shared.css?v=f20da596" />
    <link rel="stylesheet" href="../../shared/ui.css?v=fb381b22" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-grammar { --pw: 240; --pmin: 180px; }
      #p-productions { --pw: 200; --pmin: 160px; }
      #p-deriv { --pw: 960; --pmin: 320px; }

      /* ── Productions list ── */
      #productions-wrap {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-4) var(--sp-5) var(--sp-6);
      }
      .prod-rule {
        display: flex;
        align-items: baseline;
        gap: var(--sp-2);
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid transparent;
        margin-bottom: var(--sp-1);
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        line-height: 1.5;
        cursor: default;
      }
      .prod-rule.applicable { cursor: pointer; border-color: var(--border); background: var(--bg-cell); }
      .prod-rule.applicable:hover { border-color: var(--accent); background: var(--accent-bg); }
      .prod-rule-idx { color: var(--text-lo); font-size: var(--fs-2xs); min-width: 1.6em; text-align: right; flex-shrink: 0; }
      .prod-arrow    { color: var(--text-lo); }
      .prod-sym-nt   { color: var(--accent); }
      .prod-sym-t    { color: var(--text-dim); }
      .prod-sym-eps  { color: var(--text-lo); font-style: italic; }/* ── Derivation toolbar ── */
      #deriv-status { flex: 1; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); }
      #deriv-status .ds-start { color: var(--accent); font-weight: bold; }
      #step-count { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-lo); white-space: nowrap; }

      /* ── Derivation scroll ── */
      #deriv-scroll {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-6) 20px var(--sp-6);
        background: var(--bg);
      }

      /* One derivation row */
      .deriv-row {
        display: flex;
        align-items: baseline;
        padding: var(--sp-1) 0;
        font-family: var(--font-mono);
        font-size: var(--fs-md);
        line-height: 1.6;
      }
      .deriv-gutter {
        width: 4.6em;
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
        padding-right: 0.7em;
        align-items: center;
      }
      .deriv-rule { font-size: var(--fs-2xs); color: var(--text-lo); margin-right: var(--sp-1); }
      .deriv-gutter-label { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-2xs); color: var(--text-lo); }

      /* ⇒ with CSS tooltip */
      .deriv-arrow {
        color: var(--text-dim);
        cursor: help;
        position: relative;
        display: inline-block;
        padding: 0 var(--sp-1);
        user-select: none;
      }
      .deriv-arrow::after {
        content: attr(data-tip);
        position: absolute;
        left: 1.5em;
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg-panel);
        border: 1px solid var(--border);
        padding: var(--sp-1) var(--sp-4);
        font-size: var(--fs-2xs);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s;
        z-index: 200;
        font-family: var(--font-mono);
        color: var(--text);
        font-style: normal;
        box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      }
      .deriv-arrow:hover::after { opacity: 1; }

      /* Sentential form container */
      .deriv-form {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        align-items: center;
        min-height: 1.6em;
      }

      /* ── Static symbols in past/current forms ── */
      .sf-t   { color: var(--text-dim); }
      .sf-nt  { color: var(--accent); }
      .sf-eps { color: var(--text-lo); font-style: italic; }

      /* Past-form: range that was rewritten (shown with underline) */
      .sf-used {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        opacity: 0.7;
      }
      .sf-used.sf-t { color: var(--text-dim); text-decoration-color: var(--text-dim); }

      /* ── Interactive chips in current form ── */
      button.sf-chip {
        background: var(--bg-cell);
        border: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: inherit;
        padding: 0 var(--sp-3);
        line-height: 1.5;
        cursor: pointer;
        transition: border-color 0.08s, background 0.08s, color 0.08s;
        user-select: none;
        -webkit-user-select: none;
      }
      button.sf-chip.chip-nt { color: var(--accent); }
      button.sf-chip.chip-t  { color: var(--text-dim); }
      button.sf-chip:hover   { border-color: var(--amber); color: var(--amber); background: var(--amber-bg); }

      /* Chip within the actively dragged/committed selection range */
      button.sf-chip.in-range {
        border-color: var(--amber);
        background: var(--amber-bg);
        color: var(--amber);
      }
      /* First chip in range — hint about drag direction */
      button.sf-chip.range-anchor {
        font-weight: bold;
        outline: 1px solid var(--amber);
        outline-offset: 1px;
      }

      /* Done indicator */
      .deriv-done {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        margin-top: var(--sp-5);
        padding: var(--sp-2) 0;
        font-size: var(--fs-sm);
        font-family: var(--font-serif);
        font-style: italic;
        color: var(--green);
      }
      .deriv-done .done-word { font-family: var(--font-mono); font-style: normal; color: var(--text); }
      .deriv-done.is-stuck { color: var(--st-reject); }
      .deriv-done.is-capped { color: var(--st-warn); }
      .deriv-done .done-eps  { font-family: var(--font-mono); font-style: italic; color: var(--text-lo); }

      /* ── Rule picker bar ── */
      #deriv-toolbar { background: var(--bg-panel); flex-wrap: wrap; }
      /* Hidden until a range is selected; the bar itself is .ui-controlbar */
      #rule-picker {
        display: none;
        min-height: 36px;
      }
      #rule-picker.visible { display: flex; }
      .rp-lhs {
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        color: var(--text-lo);
        white-space: nowrap;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: var(--sp-2);
      }
      .rp-lhs-sep { color: var(--text-lo); }
      button.rp-rule {
        background: var(--bg-cell);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        padding: var(--sp-1) var(--sp-4);
        cursor: pointer;
        transition: border-color 0.1s, background 0.1s, color 0.1s;
        line-height: 1.5;
      }
      button.rp-rule:hover { border-color: var(--accent); background: var(--accent-bg); color: var(--text); }
      .rp-sym-nt  { color: var(--accent); }
      .rp-sym-t   { color: var(--text-dim); }
      .rp-sym-eps { color: var(--text-lo); font-style: italic; }
      button.rp-rule:hover .rp-sym-nt,
      button.rp-rule:hover .rp-sym-t,
      button.rp-rule:hover .rp-sym-eps { color: inherit; }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>Grammar Derivations</h1>
    </div>

    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="2" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-grammar');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <textarea id="grammar-input" spellcheck="false"
                    placeholder="S -> a S b | eps"></textarea>
          <div id="grammar-footer">
            <div id="error-msg"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. Productions -->
      <div class="panel" id="p-productions" data-priority="1">
        <div class="panel-header">
          <span class="panel-title">Productions</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-productions');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="productions-wrap">
            <div id="productions-content">
              <div class="ui-empty">Enter a grammar.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-2"></div>

      <!-- 3. Derivation workspace -->
      <div class="panel" id="p-deriv" data-priority="3">
        <div class="panel-header">
          <span class="panel-title">Derivation</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-deriv');">&#8250;</button>
        </div>
        <div class="panel-body">
          <div id="deriv-toolbar" class="ui-bar">
            <div class="step-group">
              <button class="btn icon-restart" id="btn-reset" onclick="derivNew()" title="Start over from the start symbol" disabled></button>
              <button class="btn" id="btn-back" onclick="derivUndo()" title="Undo the last step" disabled>&#8249; Back</button>
              <button class="btn primary" id="btn-step" onclick="derivRandomStep()" title="Apply one randomly chosen rule at a randomly chosen place" disabled>Random choice &#8250;</button>
              <button class="btn icon-run-all" id="btn-run" onclick="derivRunRandom()" title="Keep making random choices until the derivation ends (at most 200 steps)" disabled></button>
            </div>
            <button class="btn" id="btn-reseed" onclick="derivReseed()" title="Pick a new random seed and start over">&#8635; Reseed</button>
            <span id="deriv-status"></span>
            <span id="step-count"></span>
          </div>
          <div id="deriv-scroll">
            <div id="deriv-empty" class="ui-empty">Enter a grammar.</div>
            <div id="deriv-steps"></div>
          </div>
          <div id="rule-picker" class="ui-controlbar"></div>
        </div>
      </div>
    </div>

    <script src="../../shared/algo/grammar.js?v=14930600"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=e7dd4a97"></script>
    <script src="../../shared/algo/derivation.js?v=d56aad3d"></script>
    <script src="../../shared/shared.js?v=4307741e"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=eada4185"></script>
    <script src="guide.js?v=fcd7ea28"></script>
    <script src="../../shared/guide.js?v=98cfe80c"></script>
    <script>
      initResize("rh-1", "p-grammar",     +1);
      initResize("rh-2", "p-productions", +1);

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // GRAMMAR PARSING
      // Extended beyond parseBNF: LHS can be a sequence of symbols.
      // Nonterminals = (a) single-symbol-LHS tokens, plus
      //                (b) uppercase tokens in multi-symbol LHS rules.
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // parseDerivationGrammar — see shared/algo/derivation.js

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // GRAMMAR STATE
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      let _grammar = null;
      let _seed = freshSeed(); // chosen when the tool opens; shared links carry it
      let _capNote = false;    // "Run" stopped at the step cap while a rule still applied
      const DERIV_RUN_CAP = 200;

      function freshSeed() {
        const a = new Uint32Array(1);
        (window.crypto || { getRandomValues: (x) => { x[0] = Math.random() * 4294967296; } }).getRandomValues(a);
        return a[0];
      }

      function setError(msg) {
        document.getElementById("error-msg").textContent = msg || "";
      }

      function build() {
        const text = document.getElementById("grammar-input").value;
        try {
          _grammar = parseDerivationGrammar(text);
          setError("");
        } catch (e) {
          _grammar = null;
          setError(e.message);
        }
        saveShare();
        renderProductions();
        derivNew();
      }

      // ── Shareable link ──────────────────────────────────────────
      const saveShare = createShareSaver(() => ({ g: document.getElementById("grammar-input").value, sd: _seed }));
      let sharedStateApplied = false;
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g");
        if (!st) return;
        sharedStateApplied = true;
        document.getElementById("grammar-input").value = st.g;
        if (st.sd !== undefined) _seed = st.sd;
      }

      function loadExample(k) {
        if (!k) return;
        const ex = EXAMPLES[k];
        if (!ex) return;
        document.getElementById("grammar-input").value = ex.text;
        setError("");
        build();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // PRODUCTIONS PANEL
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function renderProductions() {
        const wrap = document.getElementById("productions-content");
        if (!_grammar) {
          wrap.innerHTML = '<div class="ui-empty">Enter a grammar.</div>';
          return;
        }
        const { rules, nonterminals: nts } = _grammar;
        let h = '';
        for (let i = 0; i < rules.length; i++) {
          const applicable = isApplicableRule(i);
          h += `<div class="prod-rule${applicable ? " applicable" : ""}"` +
               (applicable ? ` onclick="applyRule(${i})"` : "") + `>`;
          h += `<span class="prod-rule-idx">${i}</span>`;
          h += `<span class="prod-arrow">:&nbsp;</span>`;
          h += fmtRuleHTML(rules[i], nts, "prod-sym-nt", "prod-sym-t", "prod-sym-eps");
          h += `</div>`;
        }
        wrap.innerHTML = h;
      }

      function isApplicableRule(ruleIdx) {
        if (!_grammar || !hasCommittedRange() || _steps.length === 0) return false;
        return matchesRange(_grammar.rules[ruleIdx].lhs);
      }

      // True if lhsArr exactly matches the committed range of the current form.
      function matchesRange(lhsArr) {
        if (!hasCommittedRange()) return false;
        return derivMatchesRange(_steps[_steps.length - 1].form, selLo(), selHi(), lhsArr);
      }

      function fmtSyms(syms, nts, clsNT, clsT, clsEps) {
        if (syms.length === 0) return `<span class="${clsEps}">ε</span>`;
        return syms.map(s =>
          nts.has(s)
            ? `<span class="${clsNT}">${esc(s)}</span>`
            : `<span class="${clsT}">${esc(s)}</span>`
        ).join("&thinsp;");
      }

      function fmtRuleHTML(rule, nts, clsNT, clsT, clsEps) {
        return fmtSyms(rule.lhs, nts, clsNT, clsT, clsEps) +
               `<span style="color:var(--text-lo)"> → </span>` +
               fmtSyms(rule.rhs, nts, clsNT, clsT, clsEps);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION STATE
      // step: { form: string[], ruleIdx: number|null, matchStart: number|null, matchEnd: number|null }
      //   matchStart/matchEnd — range in the PREVIOUS form that was replaced
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      let _steps = [];

      // Selection / drag state
      let _selStart = null;  // committed range start (null = no selection)
      let _selEnd   = null;  // committed range end
      let _dragging = false;
      let _dragCur  = null;  // live drag endpoint (not yet committed)

      function hasCommittedRange() {
        return _selStart !== null && _selEnd !== null;
      }

      function selLo() { return Math.min(_selStart, _selEnd); }
      function selHi() { return Math.max(_selStart, _selEnd); }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DRAG SELECTION HANDLERS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function chipDown(pos, e) {
        e.preventDefault();
        _dragging = true;
        _selStart = pos;
        _dragCur  = pos;
        _selEnd   = null;  // clear committed selection while dragging
        updateChipHighlight();
        // Clear picker and production highlights while dragging
        document.getElementById("rule-picker").classList.remove("visible");
      }

      function chipEnter(pos) {
        if (!_dragging) return;
        _dragCur = pos;
        updateChipHighlight();
      }

      document.addEventListener("mouseup", () => {
        if (!_dragging) return;
        _dragging = false;
        // Commit selection
        const lo = Math.min(_selStart, _dragCur);
        const hi = Math.max(_selStart, _dragCur);
        _selStart = lo;
        _selEnd   = hi;
        _dragCur  = null;
        updateChipHighlight();
        updateRulePicker();
        renderProductions();
      });

      // Efficiently update chip CSS classes without re-rendering the whole form.
      function updateChipHighlight() {
        const chips = document.querySelectorAll("button.sf-chip");
        const anchor = _selStart;
        const cur    = _dragging ? _dragCur : null;
        const lo     = _selStart !== null
          ? Math.min(_selStart, cur ?? _selEnd ?? _selStart)
          : null;
        const hi     = _selStart !== null
          ? Math.max(_selStart, cur ?? _selEnd ?? _selStart)
          : null;
        chips.forEach(chip => {
          const i = parseInt(chip.dataset.pos, 10);
          const inRange = lo !== null && i >= lo && i <= hi;
          chip.classList.toggle("in-range",    inRange);
          chip.classList.toggle("range-anchor", inRange && i === anchor);
        });
      }

      function clearSelection() {
        _selStart = null;
        _selEnd   = null;
        _dragCur  = null;
        _dragging = false;
        updateChipHighlight();
        document.getElementById("rule-picker").classList.remove("visible");
        document.getElementById("rule-picker").innerHTML = "";
        renderProductions();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION LOGIC
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function derivNew() {
        _capNote = false;
        _steps = [];
        clearSelection();
        if (!_grammar) { renderDeriv(); return; }
        _steps.push({ form: [_grammar.start], ruleIdx: null, matchStart: null, matchEnd: null });
        renderDeriv();
      }

      function derivUndo() {
        _capNote = false;
        if (_steps.length <= 1) return;
        _steps.pop();
        clearSelection();
        renderDeriv();
      }

      // ── Random derivation ───────────────────────────────────────
      // Each choice depends only on (seed, step number, current form), so Back then
      // "Random choice" replays the same step, and a seed always gives the same derivation.
      function derivReseed() {
        _seed = freshSeed();
        saveShare();
        derivNew();
      }
      // One random step; returns false when no rule applies (or there is no derivation).
      function pushRandomStep() {
        if (!_grammar || _steps.length === 0) return false;
        const form = _steps[_steps.length - 1].form;
        const move = derivRandomMove(_grammar, form, _seed, _steps.length - 1);
        if (!move) return false;
        _steps.push({ form: derivApply(form, move.lo, move.hi, _grammar.rules[move.ruleIdx]), ruleIdx: move.ruleIdx, matchStart: move.lo, matchEnd: move.hi });
        return true;
      }
      function derivRandomStep() {
        _capNote = false;
        clearSelection();
        if (pushRandomStep()) { renderDeriv(); renderProductions(); }
      }
      // Keep going until the derivation ends, or DERIV_RUN_CAP steps.
      function derivRunRandom() {
        _capNote = false;
        clearSelection();
        let n = 0;
        while (n < DERIV_RUN_CAP && pushRandomStep()) n++;
        _capNote = derivOutcome(_grammar, _steps[_steps.length - 1].form) === null;
        renderDeriv();
        renderProductions();
      }

      function applyRule(ruleIdx) {
        if (!_grammar || !hasCommittedRange() || _steps.length === 0) return;
        const rule = _grammar.rules[ruleIdx];
        if (!matchesRange(rule.lhs)) return;
        _capNote = false;

        const lo   = selLo();
        const hi   = selHi();
        const form = _steps[_steps.length - 1].form;
        const newForm = derivApply(form, lo, hi, rule);

        _steps.push({ form: newForm, ruleIdx, matchStart: lo, matchEnd: hi });
        clearSelection();
        renderDeriv();
        renderProductions();
      }

      // Is the derivation complete? (see derivIsDone in shared/algo/derivation.js)
      function isDone(form) {
        return derivIsDone(_grammar, form);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION RENDERING
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function renderDeriv() {
        const emptyEl  = document.getElementById("deriv-empty");
        const stepsEl  = document.getElementById("deriv-steps");
        const statusEl = document.getElementById("deriv-status");
        const countEl  = document.getElementById("step-count");

        if (!_grammar || _steps.length === 0) {
          emptyEl.style.display = "";
          stepsEl.innerHTML = "";
          statusEl.innerHTML = "";
          countEl.textContent = "";
          for (const id of ["btn-reset", "btn-back", "btn-step", "btn-run"]) document.getElementById(id).disabled = true;
          return;
        }

        emptyEl.style.display = "none";

        const n = _steps.length - 1;
        statusEl.innerHTML = `Start: <span class="ds-start">${esc(_grammar.start)}</span>`;
        countEl.textContent = n === 0 ? "" : n === 1 ? "1 step" : n + " steps";
        const outcome = derivOutcome(_grammar, _steps[_steps.length - 1].form);
        document.getElementById("btn-reset").disabled = _steps.length <= 1;
        document.getElementById("btn-back").disabled = _steps.length <= 1;
        document.getElementById("btn-step").disabled = outcome !== null;
        document.getElementById("btn-run").disabled = outcome !== null;

        let h = "";
        for (let i = 0; i < _steps.length; i++) {
          const isCurrent = i === _steps.length - 1;
          // Range in THIS form that will be replaced to produce the next form
          const usedStart = i < _steps.length - 1 ? _steps[i + 1].matchStart : null;
          const usedEnd   = i < _steps.length - 1 ? _steps[i + 1].matchEnd   : null;
          h += buildRow(_steps[i], i, isCurrent, usedStart, usedEnd);
        }

        const lastForm = _steps[_steps.length - 1].form;
        const wordHTML = lastForm.length === 0
          ? `<span class="done-eps">ε</span>`
          : `<span class="done-word">${lastForm.map(esc).join(" ")}</span>`;
        if (outcome === "terminal") h += `<div class="deriv-done">✓ derived ${wordHTML}</div>`;
        else if (outcome === "stuck") h += `<div class="deriv-done is-stuck">✗ dead end: no rule applies to ${wordHTML}, but it still contains nonterminals (Back to choose differently)</div>`;
        else if (_capNote) h += `<div class="deriv-done is-capped">⚠ stopped after ${DERIV_RUN_CAP} steps; the derivation is not finished (Run continues)</div>`;

        stepsEl.innerHTML = h;

        const scroll = document.getElementById("deriv-scroll");
        scroll.scrollTop = scroll.scrollHeight;

        // Re-apply chip highlight state (chips were just re-rendered)
        updateChipHighlight();
      }

      function buildRow(step, idx, isCurrent, usedStart, usedEnd) {
        let gutterHTML;
        if (idx === 0) {
          gutterHTML = `<span class="deriv-gutter-label">start</span>`;
        } else {
          const rule   = _grammar.rules[step.ruleIdx];
          const lhsStr = rule.lhs.join(" ");
          const rhsStr = rule.rhs.length > 0 ? rule.rhs.join(" ") : "ε";
          const tip    = `rule ${step.ruleIdx}: ${lhsStr} → ${rhsStr}`;
          gutterHTML   = `<span class="deriv-arrow" data-tip="${esc(tip)}"><span class="deriv-rule">${step.ruleIdx}</span>⇒</span>`;
        }

        const formHTML = isCurrent
          ? buildCurrentFormHTML(step.form)
          : buildPastFormHTML(step.form, usedStart, usedEnd);

        return `<div class="deriv-row">` +
               `<div class="deriv-gutter">${gutterHTML}</div>` +
               `<div class="deriv-form">${formHTML}</div>` +
               `</div>`;
      }

      // Past form: all symbols static; the rewritten range underlined
      function buildPastFormHTML(form, usedStart, usedEnd) {
        if (form.length === 0) return `<span class="sf-eps">ε</span>`;
        const { nonterminals: nts } = _grammar;
        return form.map((sym, i) => {
          const isNT   = nts.has(sym);
          const isUsed = usedStart !== null && i >= usedStart && i <= usedEnd;
          const baseCls = isNT ? "sf-nt" : "sf-t";
          const usedCls = isUsed ? " sf-used" + (isNT ? "" : " sf-t") : "";
          return `<span class="${baseCls}${usedCls}">${esc(sym)}</span>`;
        }).join("");
      }

      // Current form: all symbols are interactive chips
      function buildCurrentFormHTML(form) {
        if (form.length === 0) return `<span class="sf-eps">ε</span>`;
        const { nonterminals: nts } = _grammar;
        return form.map((sym, i) => {
          const isNT  = nts.has(sym);
          const cls   = `sf-chip ${isNT ? "chip-nt" : "chip-t"}`;
          return `<button class="${cls}" data-pos="${i}"` +
                 ` onmousedown="chipDown(${i},event)" onmouseenter="chipEnter(${i})"` +
                 `>${esc(sym)}</button>`;
        }).join("");
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // RULE PICKER
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function updateRulePicker() {
        const picker = document.getElementById("rule-picker");
        if (!_grammar || !hasCommittedRange() || _steps.length === 0) {
          picker.classList.remove("visible");
          picker.innerHTML = "";
          return;
        }

        const { rules, nonterminals: nts } = _grammar;
        const form = _steps[_steps.length - 1].form;
        const lo   = selLo();
        const hi   = selHi();
        const sel  = form.slice(lo, hi + 1);

        const matching = rules.map((r, i) => ({ r, i }))
                              .filter(({ r }) => matchesRange(r.lhs));

        picker.classList.add("visible");

        // Show what's selected as the LHS label
        let h = `<span class="rp-lhs">`;
        h += fmtSyms(sel, nts, "rp-sym-nt", "rp-sym-t", "rp-sym-eps");
        h += `<span class="rp-lhs-sep"> →</span></span>`;

        if (matching.length === 0) {
          h += `<span class="ui-label">no matching rule</span>`;
        } else {
          for (const { r, i } of matching) {
            h += `<button class="rp-rule" onclick="applyRule(${i})">`;
            h += `<span style="color:var(--text-lo);font-size:var(--fs-2xs)">${i}: </span>`;
            h += fmtSyms(r.rhs, nts, "rp-sym-nt", "rp-sym-t", "rp-sym-eps");
            h += `</button>`;
          }
        }
        picker.innerHTML = h;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // KEYBOARD
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      document.addEventListener("keydown", e => {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key === "Escape") { e.preventDefault(); clearSelection(); }
        if ((e.key === "z" || e.key === "Z") && !e.ctrlKey && !e.metaKey) {
          e.preventDefault(); derivUndo();
        }
      });

      // ←/→ (or ,/.) step, Home restarts, End runs; the Derivation panel has key focus.
      registerStepper("p-deriv", { step: derivRandomStep, back: derivUndo, reset: derivNew, end: derivRunRandom }, { primary: true });

      document.getElementById("grammar-input").addEventListener("input", () => build());

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // EXAMPLES + INIT
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      initPanelStorage("derivation-tool-v1", ["p-grammar", "p-productions", "p-deriv"]);
      loadPanelState();
      applyShareState();

      const EXAMPLES = {};

      loadExamplesInto(
        "examples.json",
        "examples-select",
        EXAMPLES,
        function () {
          const firstKey = Object.keys(EXAMPLES)[0];
          if (firstKey && !sharedStateApplied) {
            loadExample(firstKey);
            document.getElementById("examples-select").value = firstKey;
          }
        }
      );

      build();
    </script>
  </body>
</html>
