<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Derivations</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=02eaac42" />
    <link rel="stylesheet" href="../../shared/mobile.css?v=3085da6d" />
    <link rel="stylesheet" href="../../shared/ui.css?v=c9d603f2" />
    <link rel="stylesheet" href="../../shared/grammar-editor.css?v=907890fa" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-grammar { --pw: 240; --pmin: 180px; }
      #p-deriv { --pw: 640; --pmin: 320px; }

      /* ── Derivation toolbar ── */
      #deriv-status { flex: 1; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); }
      #deriv-status .ds-start { color: var(--accent); font-weight: bold; }
      #step-count { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-lo); white-space: nowrap; }

      /* ── Derivation scroll ── */
      #deriv-scroll {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-5) var(--sp-5);
        background: var(--bg);
      }

      /* One derivation row */
      .deriv-row {
        display: flex;
        align-items: baseline;
        padding: 1px 0;
        font-family: var(--font-mono);
        font-size: var(--fs-md);
        line-height: 1.6;
      }
      .deriv-gutter {
        width: 3.4em;
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
        padding-right: 0.5em;
        align-items: center;
      }
      .deriv-rule { font-size: var(--fs-2xs); color: var(--text-lo); margin-right: var(--sp-1); }
      .deriv-gutter-label { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-2xs); color: var(--text-lo); }

      /* ⇒ with CSS tooltip */
      .deriv-arrow {
        color: var(--text-dim);
        cursor: help;
        position: relative;
        display: inline-block;
        padding: 0 var(--sp-1);
        user-select: none;
      }
      .deriv-arrow::after {
        content: attr(data-tip);
        position: absolute;
        left: 1.5em;
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg-panel);
        border: 1px solid var(--border);
        padding: var(--sp-1) var(--sp-4);
        font-size: var(--fs-2xs);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s;
        z-index: 200;
        font-family: var(--font-mono);
        color: var(--text);
        font-style: normal;
        box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      }
      .deriv-arrow:hover::after { opacity: 1; }

      /* Sentential form container */
      .deriv-form {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        align-items: center;
        min-height: 1.6em;
      }

      /* ── Static symbols in past/current forms ── */
      .sf-t   { color: var(--text-dim); }
      .sf-nt  { color: var(--accent); }
      .sf-eps { color: var(--text-lo); font-style: italic; }

      /* Past-form: range that was rewritten (shown with underline) */
      .sf-used {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        opacity: 0.7;
      }
      .sf-used.sf-t { color: var(--text-dim); text-decoration-color: var(--text-dim); }

      /* ── Interactive chips in current form ── */
      button.sf-chip {
        background: var(--bg-cell);
        border: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: inherit;
        padding: 0 var(--sp-3);
        line-height: 1.5;
        cursor: pointer;
        transition: border-color 0.08s, background 0.08s, color 0.08s;
        user-select: none;
        -webkit-user-select: none;
      }
      button.sf-chip.chip-nt { color: var(--accent); }
      button.sf-chip.chip-t  { color: var(--text-dim); }
      button.sf-chip:hover   { border-color: var(--amber); color: var(--amber); background: var(--amber-bg); }

      /* A final terminal in the current form: text, with the room of a chip so that the line does not shift */
      .sf-static { padding: 0 var(--sp-3); border: 1px solid transparent; line-height: 1.5; }

      /* Chip within the actively dragged/committed selection range */
      button.sf-chip.in-range {
        border-color: var(--amber);
        background: var(--amber-bg);
        color: var(--amber);
      }
      /* First chip in range — hint about drag direction */
      button.sf-chip.range-anchor {
        font-weight: bold;
        outline: 1px solid var(--amber);
        outline-offset: 1px;
      }

      /* Done indicator */
      .deriv-done {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        margin-top: var(--sp-5);
        padding: var(--sp-2) 0;
        font-size: var(--fs-sm);
        font-family: var(--font-serif);
        font-style: italic;
        color: var(--green);
      }
      .deriv-done .done-word { font-family: var(--font-mono); font-style: normal; color: var(--text); }
      .deriv-done.is-stuck { color: var(--st-reject); }
      .deriv-done.is-capped { color: var(--st-warn); }
      .deriv-done .done-eps  { font-family: var(--font-mono); font-style: italic; color: var(--text-lo); }

      #deriv-toolbar { background: var(--bg-panel); flex-wrap: wrap; }
      .rp-sym-nt  { color: var(--accent); }
      .rp-sym-t   { color: var(--text-dim); }
      .rp-sym-eps { color: var(--text-lo); font-style: italic; }

      /* Phone: the controls at the bottom with the rules that fit the selection just above them; chips big enough to hit and to drag across */
      body.is-mobile #deriv-toolbar { order: 99; border-top: 1.5px solid var(--border-hi); border-bottom: none; }
      body.is-mobile .sheet-chip { font-size: var(--fs-md); }
      body.is-mobile button.sf-chip, body.is-mobile .sf-static { min-width: 30px; min-height: 38px; font-size: var(--fs-md); }
      body.is-mobile #deriv-scroll { padding: var(--sp-4) var(--sp-3); }
      body.is-mobile .deriv-gutter { width: 2.8em; padding-right: 0.3em; }
      body.is-mobile .deriv-form { gap: var(--sp-2); }
      body.is-mobile #deriv-status, body.is-mobile #step-count { display: none; } /* the rows are numbered, and the start symbol is the first row */
      body.is-mobile button.sf-chip { touch-action: none; }
      body.is-mobile .sf-static { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }

      /* The tree panel: a note when a step is not context-free */
      #tree-note { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-3) var(--sp-5); background: var(--bg-panel); border-top: 1px solid var(--border-lo); color: var(--text-dim); font-size: var(--fs-xs); }
      #tree-note:empty { display: none; }
    </style>
  </head>
  <body data-mobile>
    <div id="topbar">
      <h1>Grammar Derivations</h1>
    </div>

    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="2" data-tab="Grammar" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-grammar');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <textarea id="grammar-input" spellcheck="false"
                    placeholder="S -> a S b | eps"></textarea>
          <div id="grammar-footer">
            <div id="error-msg"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 3. Derivation workspace -->
      <div class="panel" id="p-deriv" data-priority="3" data-tab="Derivation">
        <div class="panel-header">
          <span class="panel-title">Derivation</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-deriv');">&#8250;</button>
        </div>
        <div class="panel-body">
          <div id="deriv-toolbar" class="ui-bar">
            <div class="step-group">
              <button class="btn icon-restart" id="btn-reset" onclick="derivNew()" title="Start over from the start symbol" disabled></button>
              <button class="btn" id="btn-back" onclick="derivUndo()" title="Undo the last step" disabled>&#8249; Back</button>
              <button class="btn primary" id="btn-step" onclick="derivRandomStep()" title="Apply one randomly chosen rule at a randomly chosen place" disabled>Random choice &#8250;</button>
              <button class="btn icon-run-all" id="btn-run" onclick="derivRunRandom()" title="Keep making random choices until the derivation ends (at most 200 steps)" disabled></button>
            </div>
            <button class="btn" id="btn-reseed" onclick="derivReseed()" title="Pick a new random seed and start over">&#8635; Reseed</button>
            <span id="deriv-status"></span>
            <span id="step-count"></span>
          </div>
          <div id="deriv-scroll">
            <div id="deriv-empty" class="ui-empty">Enter a grammar.</div>
            <div id="deriv-steps"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-3"></div>

      <!-- 4. Derivation tree -->
      <div class="panel" id="p-tree" data-priority="1" data-tab="Tree">
        <div class="panel-header">
          <span class="panel-title">Derivation tree</span>
          <button class="collapse-btn"
                  onclick="event.stopPropagation(); toggleCollapse('p-tree');">&#8250;</button>
        </div>
        <div class="panel-body tree-panel-body">
          <div class="tree-area">
            <svg id="tree-svg" width="100%" height="100%"><g id="tree-root"></g></svg>
            <div id="tree-empty">The tree grows with the derivation.</div>
            <div id="tree-note"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../shared/algo/grammar.js?v=14930600"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=47d2ba1e"></script>
    <script src="../../shared/algo/derivation.js?v=f3c5070c"></script>
    <script src="../../shared/shared.js?v=0b5de1de"></script>
    <script src="../../shared/fit-view.js?v=9af2be16"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/algo/grammar-model.js?v=5bd211a1"></script>
    <script src="../../shared/grammar-editor.js?v=ad2a7e7e"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=f1064557"></script>
    <script src="../../shared/algo/tex.js?v=d7c299e8"></script>
    <script src="../../shared/def-library.js?v=112d938e"></script>
    <script src="definitions.js?v=b3791c40"></script>
    <script src="../../shared/sheet.js?v=bc9dc640"></script>
    <script src="../../shared/mobile.js?v=0f33fae8"></script>
    <script src="../../shared/definitions.js?v=aa7fb5cb"></script>
    <script src="guide.js?v=26e8c780"></script>
    <script src="../../shared/guide.js?v=ba07a3aa"></script>
    <script>
      initResize("rh-1", "p-grammar",     +1);
      initResize("rh-3", "p-deriv", +1);

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // GRAMMAR PARSING
      // Extended beyond parseBNF: LHS can be a sequence of symbols.
      // Nonterminals = (a) single-symbol-LHS tokens, plus
      //                (b) uppercase tokens in multi-symbol LHS rules.
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // parseDerivationGrammar — see shared/algo/derivation.js

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // GRAMMAR STATE
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      let _grammar = null;
      let _seed = freshSeed(); // chosen when the tool opens; shared links carry it
      let _capNote = false;    // "Run" stopped at the step cap while a rule still applied
      const DERIV_RUN_CAP = 200;

      function freshSeed() {
        const a = new Uint32Array(1);
        (window.crypto || { getRandomValues: (x) => { x[0] = Math.random() * 4294967296; } }).getRandomValues(a);
        return a[0];
      }

      function setError(msg) {
        document.getElementById("error-msg").textContent = msg || "";
      }

      function build() {
        const text = document.getElementById("grammar-input").value;
        try {
          _grammar = parseDerivationGrammar(text);
          setError("");
        } catch (e) {
          _grammar = null;
          setError(e.message);
        }
        saveShare();
        updateGrammarLock();
        derivNew();
      }

      // ── Shareable link ──────────────────────────────────────────
      const saveShare = createShareSaver(() => ({ g: document.getElementById("grammar-input").value, x: exampleShareKey(), sd: _seed }));
      let sharedStateApplied = false;
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g");
        if (!st) return;
        sharedStateApplied = true;
        document.getElementById("grammar-input").value = st.g;
        exampleRestoreLater(st.x);
        if (st.sd !== undefined) _seed = st.sd;
      }

      function loadExample(k) {
        if (!k) return;
        const ex = EXAMPLES[k];
        if (!ex) return;
        document.getElementById("grammar-input").value = ex.text;
        document.getElementById("examples-select").value = k;
        exampleWatch();
        setError("");
        build();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // PRODUCTIONS PANEL
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // The grammar panel is the chooser of the production: locked while part of the form is selected, with the productions that fit
      // marked. Editing the grammar restarts the derivation, so it is only locked for the choice.
      let _ge = null;
      // An edit of the grammar restarts the derivation (also one that has ended): ask once, then restart it before the edit begins
      function confirmGrammarEdit() {
        if (!_grammar || _steps.length <= 1) return true;
        if (!confirm("Editing the grammar restarts the derivation. Edit anyway?")) return false;
        derivNew();
        return true;
      }
      function updateGrammarLock() {
        if (!_ge) return;
        if (!_grammar || _steps.length === 0 || !hasCommittedRange()) { _ge.lock(null); return; }
        _ge.lock({
          rules: _grammar.rules.map((r, i) => i).filter(isApplicableRule),
          pick: (i) => applyRule(i),
          cancel: () => clearSelection(),
        });
      }

      function isApplicableRule(ruleIdx) {
        if (!_grammar || !hasCommittedRange() || _steps.length === 0) return false;
        return matchesRange(_grammar.rules[ruleIdx].lhs);
      }

      // True if lhsArr exactly matches the committed range of the current form.
      function matchesRange(lhsArr) {
        if (!hasCommittedRange()) return false;
        return derivMatchesRange(_steps[_steps.length - 1].form, selLo(), selHi(), lhsArr);
      }

      function fmtSyms(syms, nts, clsNT, clsT, clsEps) {
        if (syms.length === 0) return `<span class="${clsEps}">ε</span>`;
        return syms.map(s =>
          nts.has(s)
            ? `<span class="${clsNT}">${esc(s)}</span>`
            : `<span class="${clsT}">${esc(s)}</span>`
        ).join("&thinsp;");
      }

      function fmtRuleHTML(rule, nts, clsNT, clsT, clsEps) {
        return fmtSyms(rule.lhs, nts, clsNT, clsT, clsEps) +
               `<span style="color:var(--text-lo)"> → </span>` +
               fmtSyms(rule.rhs, nts, clsNT, clsT, clsEps);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION STATE
      // step: { form: string[], ruleIdx: number|null, matchStart: number|null, matchEnd: number|null }
      //   matchStart/matchEnd — range in the PREVIOUS form that was replaced
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      let _steps = [];

      // Selection / drag state
      let _selStart = null;  // committed range start (null = no selection)
      let _selEnd   = null;  // committed range end
      let _dragging = false;
      let _dragCur  = null;  // live drag endpoint (not yet committed)

      function hasCommittedRange() {
        return _selStart !== null && _selEnd !== null;
      }

      function selLo() { return Math.min(_selStart, _selEnd); }
      function selHi() { return Math.max(_selStart, _selEnd); }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DRAG SELECTION HANDLERS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function chipDown(pos, e) {
        e.preventDefault();
        _dragging = true;
        _selStart = pos;
        _dragCur  = pos;
        _selEnd   = null;  // clear committed selection while dragging
        updateChipHighlight();
      }

      function chipEnter(pos) {
        if (!_dragging) return;
        _dragCur = pos;
        updateChipHighlight();
      }

      document.addEventListener("mouseup", () => commitDrag());

      function commitDrag(extend = null) {
        if (!_dragging) return;
        _dragging = false;
        // Commit selection
        let lo = Math.min(_selStart, _dragCur);
        let hi = Math.max(_selStart, _dragCur);
        if (extend) { lo = Math.min(lo, extend[0]); hi = Math.max(hi, extend[1]); }
        _selStart = lo;
        _selEnd   = hi;
        _dragCur  = null;
        updateChipHighlight();
        updateRulePicker();
        updateGrammarLock();
      }

      // Efficiently update chip CSS classes without re-rendering the whole form.
      function updateChipHighlight() {
        const chips = document.querySelectorAll("button.sf-chip");
        const anchor = _selStart;
        const cur    = _dragging ? _dragCur : null;
        const lo     = _selStart !== null
          ? Math.min(_selStart, cur ?? _selEnd ?? _selStart)
          : null;
        const hi     = _selStart !== null
          ? Math.max(_selStart, cur ?? _selEnd ?? _selStart)
          : null;
        chips.forEach(chip => {
          const i = parseInt(chip.dataset.pos, 10);
          const inRange = lo !== null && i >= lo && i <= hi;
          chip.classList.toggle("in-range",    inRange);
          chip.classList.toggle("range-anchor", inRange && i === anchor);
        });
      }

      // Touch: a finger drags across the chips as the mouse does (the chip under it is found by position); a tap on a chip outside the
      // selection extends the selection to it, so a range is also made by tapping its two ends. The touch is not passed on as mouse events.
      const chipAt = (t) => { const el = document.elementFromPoint(t.clientX, t.clientY); return el && el.closest ? el.closest("button.sf-chip") : null; };
      let _touchPrev = null;
      document.addEventListener("touchstart", (e) => {
        const chip = chipAt(e.touches[0]);
        if (!chip) return;
        e.preventDefault();
        _touchPrev = hasCommittedRange() ? [selLo(), selHi()] : null;
        chipDown(+chip.dataset.pos, e);
      }, { passive: false });
      document.addEventListener("touchmove", (e) => {
        if (!_dragging) return;
        e.preventDefault();
        const chip = chipAt(e.touches[0]);
        if (chip) chipEnter(+chip.dataset.pos);
      }, { passive: false });
      document.addEventListener("touchend", (e) => {
        if (!_dragging) return;
        e.preventDefault();
        const tap = _dragCur === _selStart && _touchPrev && (_selStart < _touchPrev[0] || _selStart > _touchPrev[1]);
        commitDrag(tap ? _touchPrev : null);
        _touchPrev = null;
      }, { passive: false });

      function clearSelection() {
        _selStart = null;
        _selEnd   = null;
        _dragCur  = null;
        _dragging = false;
        updateChipHighlight();
        if (typeof ruleSheet !== "undefined" && ruleSheet) ruleSheet.close();
        updateGrammarLock();
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION LOGIC
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      function derivNew() {
        _capNote = false;
        _steps = [];
        clearSelection();
        if (!_grammar) { renderDeriv(); return; }
        _steps.push({ form: [_grammar.start], ruleIdx: null, matchStart: null, matchEnd: null });
        renderDeriv();
      }

      function derivUndo() {
        _capNote = false;
        if (_steps.length <= 1) return;
        _steps.pop();
        clearSelection();
        renderDeriv();
      }

      // ── Random derivation ───────────────────────────────────────
      // Each choice depends only on (seed, step number, current form), so Back then
      // "Random choice" replays the same step, and a seed always gives the same derivation.
      function derivReseed() {
        _seed = freshSeed();
        saveShare();
        derivNew();
      }
      // One random step; returns false when no rule applies (or there is no derivation).
      function pushRandomStep() {
        if (!_grammar || _steps.length === 0) return false;
        const form = _steps[_steps.length - 1].form;
        const move = derivRandomMove(_grammar, form, _seed, _steps.length - 1);
        if (!move) return false;
        _steps.push({ form: derivApply(form, move.lo, move.hi, _grammar.rules[move.ruleIdx]), ruleIdx: move.ruleIdx, matchStart: move.lo, matchEnd: move.hi });
        return true;
      }
      function derivRandomStep() {
        _capNote = false;
        clearSelection();
        if (pushRandomStep()) { renderDeriv(); updateGrammarLock(); }
      }
      // Keep going until the derivation ends, or DERIV_RUN_CAP steps.
      function derivRunRandom() {
        _capNote = false;
        clearSelection();
        let n = 0;
        while (n < DERIV_RUN_CAP && pushRandomStep()) n++;
        _capNote = derivOutcome(_grammar, _steps[_steps.length - 1].form) === null;
        renderDeriv();
        updateGrammarLock();
      }

      function applyRule(ruleIdx) {
        if (!_grammar || !hasCommittedRange() || _steps.length === 0) return;
        const rule = _grammar.rules[ruleIdx];
        if (!matchesRange(rule.lhs)) return;
        _capNote = false;

        const lo   = selLo();
        const hi   = selHi();
        const form = _steps[_steps.length - 1].form;
        const newForm = derivApply(form, lo, hi, rule);

        _steps.push({ form: newForm, ruleIdx, matchStart: lo, matchEnd: hi });
        clearSelection();
        renderDeriv();
        updateGrammarLock();
      }

      // Is the derivation complete? (see derivIsDone in shared/algo/derivation.js)
      function isDone(form) {
        return derivIsDone(_grammar, form);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // DERIVATION RENDERING
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // ── The derivation tree: rebuilt from the steps (shared/shared.js draws it). A step that rewrites one nonterminal
      // expands its node, numbered with the step; the first step with a longer left side ends the tree.
      let currentGrammar = null;
      let _treeInfo = { stepNode: [], forms: [], stopped: null }; // node of each step, nodes of each form's symbols
      function buildDerivTree() {
        _treeInfo = derivTree(_grammar, _steps);
        treeRoot = _treeInfo.root;
        treeLastNew = _treeInfo.lastNew;
      }
      const nodeAttr = (id) => (id === undefined ? "" : ` data-node="${id}"`);
      function drawDerivTree() {
        const note = document.getElementById("tree-note"), st = _treeInfo.stopped;
        if (!_grammar || _steps.length === 0) {
          treeReset();
          note.textContent = "";
          return;
        }
        currentGrammar = _grammar;
        renderTree();
        note.textContent = st ? `No tree from step ${st.step} on: ${st.rule.lhs.join(" ")} → ${st.rule.rhs.length ? st.rule.rhs.join(" ") : "ε"} has more than one symbol on its left side.` : "";
      }

      function renderDeriv() {
        const emptyEl  = document.getElementById("deriv-empty");
        const stepsEl  = document.getElementById("deriv-steps");
        const statusEl = document.getElementById("deriv-status");
        const countEl  = document.getElementById("step-count");

        if (!_grammar || _steps.length === 0) {
          emptyEl.style.display = "";
          stepsEl.innerHTML = "";
          statusEl.innerHTML = "";
          countEl.textContent = "";
          for (const id of ["btn-reset", "btn-back", "btn-step", "btn-run"]) document.getElementById(id).disabled = true;
          drawDerivTree();
          return;
        }

        emptyEl.style.display = "none";

        const n = _steps.length - 1;
        statusEl.innerHTML = `Start: <span class="ds-start">${esc(_grammar.start)}</span>`;
        countEl.textContent = n === 0 ? "" : n === 1 ? "1 step" : n + " steps";
        const outcome = derivOutcome(_grammar, _steps[_steps.length - 1].form);
        document.getElementById("btn-reset").disabled = _steps.length <= 1;
        document.getElementById("btn-back").disabled = _steps.length <= 1;
        document.getElementById("btn-step").disabled = outcome !== null;
        document.getElementById("btn-run").disabled = outcome !== null;

        buildDerivTree();
        let h = "";
        for (let i = 0; i < _steps.length; i++) {
          const isCurrent = i === _steps.length - 1;
          // Range in THIS form that will be replaced to produce the next form
          const usedStart = i < _steps.length - 1 ? _steps[i + 1].matchStart : null;
          const usedEnd   = i < _steps.length - 1 ? _steps[i + 1].matchEnd   : null;
          h += buildRow(_steps[i], i, isCurrent, usedStart, usedEnd);
        }

        const lastForm = _steps[_steps.length - 1].form;
        const wordHTML = lastForm.length === 0
          ? `<span class="done-eps">ε</span>`
          : `<span class="done-word">${lastForm.map(esc).join(" ")}</span>`;
        if (outcome === "terminal") h += `<div class="deriv-done">✓ derived ${wordHTML}</div>`;
        else if (outcome === "stuck") h += `<div class="deriv-done is-stuck">✗ dead end: no rule applies to ${wordHTML}, but it still contains nonterminals (Back to choose differently)</div>`;
        else if (_capNote) h += `<div class="deriv-done is-capped">⚠ stopped after ${DERIV_RUN_CAP} steps; the derivation is not finished (Run continues)</div>`;

        stepsEl.innerHTML = h;

        const scroll = document.getElementById("deriv-scroll");
        scroll.scrollTop = scroll.scrollHeight;

        // Re-apply chip highlight state (chips were just re-rendered)
        updateChipHighlight();
        drawDerivTree();
        updateGrammarLock();
      }

      function buildRow(step, idx, isCurrent, usedStart, usedEnd) {
        let gutterHTML;
        if (idx === 0) {
          gutterHTML = `<span class="deriv-gutter-label">start</span>`;
        } else {
          const rule   = _grammar.rules[step.ruleIdx];
          const lhsStr = rule.lhs.join(" ");
          const rhsStr = rule.rhs.length > 0 ? rule.rhs.join(" ") : "ε";
          const tip    = `production ${step.ruleIdx + 1}: ${lhsStr} → ${rhsStr}`;
          gutterHTML   = `<span class="deriv-arrow" data-prod="${step.ruleIdx + 1}"${nodeAttr(_treeInfo.stepNode[idx])} data-tip="${esc(tip)}"><span class="deriv-rule">${step.ruleIdx + 1}</span>⇒</span>`;
        }

        const formHTML = isCurrent
          ? buildCurrentFormHTML(step.form, _treeInfo.forms[idx])
          : buildPastFormHTML(step.form, usedStart, usedEnd, _treeInfo.forms[idx]);

        return `<div class="deriv-row">` +
               `<div class="deriv-gutter">${gutterHTML}</div>` +
               `<div class="deriv-form">${formHTML}</div>` +
               `</div>`;
      }

      // Past form: all symbols static; the rewritten range underlined
      function buildPastFormHTML(form, usedStart, usedEnd, ids = []) {
        if (form.length === 0) return `<span class="sf-eps">ε</span>`;
        const { nonterminals: nts } = _grammar;
        return form.map((sym, i) => {
          const isNT   = nts.has(sym);
          const isUsed = usedStart !== null && i >= usedStart && i <= usedEnd;
          const baseCls = isNT ? "sf-nt" : "sf-t";
          const usedCls = isUsed ? " sf-used" + (isNT ? "" : " sf-t") : "";
          return `<span class="${baseCls}${usedCls}"${nodeAttr(ids[i])}>${esc(sym)}</span>`;
        }).join("");
      }

      // Current form: the symbols that a rule can rewrite are interactive chips. A terminal is one only where a rule has it on its left
      // side (the context of a context-sensitive rule); any other terminal is final, and drawn as text.
      function buildCurrentFormHTML(form, ids = []) {
        if (form.length === 0) return `<span class="sf-eps">ε</span>`;
        const { nonterminals: nts, rules } = _grammar;
        const onLeft = new Set(rules.flatMap((r) => r.lhs));
        return form.map((sym, i) => {
          const isNT  = nts.has(sym);
          if (!isNT && !onLeft.has(sym)) return `<span class="sf-t sf-static"${nodeAttr(ids[i])}>${esc(sym)}</span>`;
          const cls   = `sf-chip ${isNT ? "chip-nt" : "chip-t"}`;
          return `<button class="${cls}" data-pos="${i}"${nodeAttr(ids[i])}` +
                 ` onmousedown="chipDown(${i},event)" onmouseenter="chipEnter(${i})"` +
                 `>${esc(sym)}</button>`;
        }).join("");
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // RULE PICKER
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // On a phone the rules that fit the selection are chips in a sheet (shared/sheet.js), in place of the bar below the derivation
      let ruleSheet = null;
      function ruleSheetShow(sel, matching) {
        if (!ruleSheet) ruleSheet = createSheet({ onClose: () => clearSelection() });
        const nts = _grammar.nonterminals;
        ruleSheet.open({ titleHtml: fmtSyms(sel, nts, "rp-sym-nt", "rp-sym-t", "rp-sym-eps") + " →" });
        ruleSheet.set(matching.map(({ r, i }) => ({
          html: `<span style="color:var(--text-lo);font-size:var(--fs-2xs)">${i}: </span>` + fmtSyms(r.rhs, nts, "rp-sym-nt", "rp-sym-t", "rp-sym-eps"),
          pick: () => applyRule(i),
        })), "no matching rule");
      }

      // On a desktop the grammar panel is the chooser (see updateGrammarLock); on a phone the rules that fit are a sheet
      function updateRulePicker() {
        if (!_grammar || !hasCommittedRange() || _steps.length === 0 || !document.body.classList.contains("is-mobile")) {
          if (ruleSheet) ruleSheet.close();
          return;
        }
        const form = _steps[_steps.length - 1].form;
        const sel  = form.slice(selLo(), selHi() + 1);
        ruleSheetShow(sel, _grammar.rules.map((r, i) => ({ r, i })).filter(({ r }) => matchesRange(r.lhs)));
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // KEYBOARD
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      document.addEventListener("keydown", e => {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key === "Escape") { e.preventDefault(); clearSelection(); }
        if ((e.key === "z" || e.key === "Z") && !e.ctrlKey && !e.metaKey) {
          e.preventDefault(); derivUndo();
        }
      });

      // ←/→ (or ,/.) step, Home restarts, End runs; the Derivation panel has key focus.
      registerStepper("p-deriv", { step: derivRandomStep, back: derivUndo, reset: derivNew, end: derivRunRandom }, { primary: true });

      _ge = GrammarEditor.attach(document.getElementById("grammar-input"), { sequences: true, guard: confirmGrammarEdit });
      document.getElementById("grammar-input").addEventListener("input", () => build());

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // EXAMPLES + INIT
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      initPanelStorage("derivation-tool-v1", ["p-grammar", "p-deriv", "p-tree"]);
      loadPanelState();
      initTreeZoom();
      applyShareState();

      const EXAMPLES = {};

      loadExamplesInto(
        "examples.json",
        "examples-select",
        EXAMPLES,
        function () {
          const firstKey = Object.keys(EXAMPLES)[0];
          if (firstKey && !sharedStateApplied) {
            loadExample(firstKey);
            document.getElementById("examples-select").value = firstKey;
          }
        }
      );

      build();
    </script>
  </body>
</html>
