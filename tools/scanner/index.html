<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="How a scanner is built from token rules: the NFA of all rules, the character classes, the minimal DFA, and maximal-munch scanning one character at a time." />
    <title>Scanner | Parser Tools</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <script src="../../vendor/dagre.min.js?v=15b1e755"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=3e2c71b3" />
    <link rel="stylesheet" href="../../shared/ui.css?v=8cc0b0e1" />
    <link rel="stylesheet" href="../../shared/compiler.css?v=0bf16970" />
    <link rel="stylesheet" href="../../shared/scanner-editor.css?v=d7a839ae" />
    <link rel="stylesheet" href="../../shared/scanner.css?v=1e3582f4" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-rules { --pw: 300; --pmin: 220px; }
      #p-nfa { --pw: 360; --pmin: 240px; }
      #p-dfa { --pw: 380; --pmin: 240px; }
      #p-run { --pw: 340; --pmin: 260px; }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>Scanner</h1>
    </div>

    <div id="panels">
      <!-- 1. The token rules -->
      <div class="panel" id="p-rules" data-priority="3">
        <div class="panel-header">
          <span class="panel-title">Token rules</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-rules');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example</option>
            </select>
          </div>
          <div class="cm-fields">
            <textarea id="token-input" class="cm-text" spellcheck="false"></textarea>
          </div>
          <div id="grammar-footer"><div id="error-msg"></div></div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. The NFA of all rules and the character classes -->
      <div class="panel" id="p-nfa" data-priority="2">
        <div class="panel-header">
          <span class="panel-title">Scanner NFA</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-nfa');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div class="ui-canvas">
            <svg id="nfa-svg"><g id="nfa-graph-root"></g></svg>
            <div id="nfa-graph-empty" class="ui-canvas__empty">No rules.</div>
            <div id="nfa-note" class="sc-viewnote"></div>
          </div>
          <div class="sc-section">
            <span class="ui-label">Character classes</span>
            <div id="sc-classes"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-2"></div>

      <!-- 3. The DFA and its table -->
      <div class="panel" id="p-dfa" data-priority="1">
        <div class="panel-header">
          <span class="panel-title">Scanner DFA</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-dfa');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div class="ui-canvas">
            <svg id="dfa-svg"><g id="dfa-graph-root"></g></svg>
            <div id="dfa-graph-empty" class="ui-canvas__empty">No rules.</div>
            <div id="dfa-note" class="sc-viewnote"></div>
          </div>
          <div class="sc-section">
            <span class="ui-label">Transition table</span>
            <div id="sc-table"></div>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="rh-3"></div>

      <!-- 4. Scanning -->
      <div class="panel" id="p-run" data-priority="4">
        <div class="panel-header">
          <span class="panel-title">Scanning</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-run');">&#8250;</button>
        </div>
        <div class="panel-body">
          <div class="ui-sim">
            <div class="ui-sim__row">
              <div class="input-group">
                <input id="sim-input" class="ui-input ui-input--lg" type="text" spellcheck="false" />
              </div>
              <div class="step-group">
                <button class="btn icon-restart" id="btn-sim-reset" title="Restart" disabled></button>
                <button class="btn" id="btn-sim-back" disabled>&#8249; Back</button>
                <button class="btn primary" id="btn-sim-step" disabled>Step &#8250;</button>
                <button class="btn icon-run-all" id="btn-sim-all" title="Run all" disabled></button>
              </div>
            </div>
            <div class="sc-grain">
              <label><input type="radio" name="sc-grain" id="grain-coarse" checked /> Coarse steps</label>
              <label><input type="radio" name="sc-grain" id="grain-fine" /> Fine steps</label>
            </div>
          </div>
          <div id="cm-log" class="cm-log"></div>
          <div class="cm-section">
            <span class="ui-label">Input</span>
            <div id="cm-input" class="cm-chars"></div>
            <div class="cm-key"><span class="is-lex">read in this call</span><span class="is-done">consumed earlier</span><span class="is-peek">looked at, then given back</span></div>
          </div>
          <div class="cm-section" style="border-bottom: 0">
            <span class="ui-label">Tokens returned</span>
            <div id="cm-tokens" class="cm-tokens"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- #panels -->

    <script src="../../shared/algo/grammar.js?v=14930600"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=47d2ba1e"></script>
    <script src="../../shared/algo/strings.js?v=23796ffe"></script>
    <script src="../../shared/algo/scanner.js?v=83a39a9b"></script>
    <script src="../../shared/shared.js?v=42ed2a33"></script>
    <script src="../../shared/fit-view.js?v=9af2be16"></script>
    <script src="../../shared/automaton-graph.js?v=f2f7c58b"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/algo/grammar-model.js?v=5bd211a1"></script>
    <script src="../../shared/algo/scanner-model.js?v=7b65f835"></script>
    <script src="../../shared/scanner-editor.js?v=2923e330"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=eada4185"></script>
    <script src="guide.js?v=10e33600"></script>
    <script src="../../shared/guide.js?v=98cfe80c"></script>
    <script src="../../shared/stepper.js?v=b99ccf2b"></script>
    <script src="../../shared/scanner-graph.js?v=c72e3a7c"></script>
    <script src="../../shared/scanner-ui.js?v=20478ab6"></script>
    <script>
      const EXAMPLES = {};
      function loadExample(k) { ScannerTool.loadExample(k); }
      ScannerTool.init({ examples: "examples.json", storage: "scanner-tool-v1" });
    </script>
  </body>
</html>
