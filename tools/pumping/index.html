<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Why long strings can be pumped: a repeated state in a DFA, a repeated nonterminal in a parse tree. Pump the loop to see that the verdict never changes." />
    <title>Pumping Explorer | Parser Tools</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <script src="../../vendor/dagre.min.js?v=15b1e755"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=f3a71061" />
    <link rel="stylesheet" href="../../shared/ui.css?v=0ba50e96" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-def { --pw: 290; --pmin: 200px; }
      #p-main { --pw: 1050; --pmin: 360px; }

      /* The three parts of a pumped string: x blue, y (the part that is repeated) orange, z green; for trees u grey, v and y orange, x blue, z green */
      [hidden] { display: none !important; }
      :root { --pp-x: var(--accent); --pp-y: var(--hot); --pp-z: var(--st-accept); --pp-u: var(--text-lo); }

      #regex-row { flex-shrink: 0; display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-lo); }
      #regex-row input { flex: 1; min-width: 0; }
            #def-note { flex-shrink: 0; padding: 0 var(--sp-5) var(--sp-3); font-family: var(--font-serif); font-style: italic; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-dim); }
      #def-note:empty { display: none; }

      /* ── The explorer: controls on top, the drawing and the reading side by side ── */
      #ctl-top { flex-shrink: 0; border-bottom: 1.5px solid var(--border-hi); background: var(--bg-panel); display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-6); }
      #ctl-top > * { flex: 1 1 300px; min-width: 0; }
      #ctl-top .ui-sim__row, #ctl-top .ui-bar { border-bottom: 0; }
      #pump-bar { gap: var(--sp-4); flex-wrap: nowrap; }
      #pump-i { flex: 1; min-width: 80px; accent-color: var(--pp-y); }
      #pump-i-val { font-family: var(--font-serif); font-style: italic; min-width: 3.4em; }
      #work { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; overflow: auto; }
      #canvases { flex: 3 1 380px; position: relative; min-height: 300px; display: flex; flex-direction: column; }
      #side { flex: 2 1 320px; min-width: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
      #strip { flex-shrink: 0; border-bottom: 1.5px solid var(--border-hi); background: var(--bg-panel); }
      .pp-row { display: flex; align-items: baseline; gap: var(--sp-4); padding: var(--sp-2) var(--sp-5); }
      .pp-row + .pp-row { border-top: 1px solid var(--border-lo); }
      .pp-row > .ui-label { width: 52px; flex-shrink: 0; }
      .pp-body { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px var(--sp-1); min-width: 0; font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.7; }
      .pp-formula { font-family: var(--font-serif); font-size: var(--fs-sm); }
      .pp-formula b { font-weight: 600; }
      .pp-ch, .pp-st { padding: 0 var(--sp-2); border: 1px solid transparent; }
      .pp-st { border-color: var(--border); background: var(--bg); color: var(--text-dim); font-size: var(--fs-xs); }
      .pp-x { color: var(--pp-x); } .pp-y { color: var(--pp-y); } .pp-z { color: var(--pp-z); } .pp-u { color: var(--pp-u); } .pp-v { color: var(--pp-y); }
      .pp-st.pp-x { border-color: var(--pp-x); } .pp-st.pp-y { border-color: var(--pp-y); } .pp-st.pp-z { border-color: var(--pp-z); }
      .pp-st.pp-loop { background: var(--hot-bg); font-weight: 600; }
      .pp-ch.pp-now { background: var(--st-active-bg); border-color: var(--st-active); }
      .pp-ch.pp-read { text-decoration: underline; text-underline-offset: 3px; }
      .pp-arrow { color: var(--text-lo); font-size: var(--fs-2xs); }

      /* ── The drawings ── */
      #canvases .ui-canvas { flex: 1; }
      .ag-edge.pump-x path { stroke: var(--pp-x); stroke-width: 2.2; }
      .ag-edge.pump-y path { stroke: var(--pp-y); stroke-width: 2.6; }
      .ag-edge.pump-z path { stroke: var(--pp-z); stroke-width: 2.2; }
      .ag-edge.pump-x text { fill: var(--pp-x); } .ag-edge.pump-y text { fill: var(--pp-y); } .ag-edge.pump-z text { fill: var(--pp-z); }
      .ag-node.pump-loop circle:first-of-type { stroke: var(--pp-y); stroke-width: 3; }

      .pt-n { cursor: default; }
      .pt-n circle { fill: var(--bg); stroke: var(--border-hi); stroke-width: 1.4; }
      .pt-n text { font-family: var(--font-serif); font-size: var(--fs-sm); fill: var(--text); text-anchor: middle; pointer-events: none; }
      .pt-n.pt-leaf circle { stroke: none; fill: none; }
      .pt-n.pt-leaf text { font-family: var(--font-mono); font-weight: 600; }
      .pt-n.pt-eps text { font-style: italic; fill: var(--text-lo); font-weight: normal; }
      .pt-n.pt-u text { fill: var(--pp-u); } .pt-n.pt-v text, .pt-n.pt-y text { fill: var(--pp-y); } .pt-n.pt-x text { fill: var(--pp-x); } .pt-n.pt-z text { fill: var(--pp-z); }
      .pt-n.pt-up circle { stroke: var(--pp-y); stroke-width: 3; fill: var(--hot-bg); }
      .pt-n.pt-low circle { stroke: var(--pp-x); stroke-width: 3; fill: var(--st-active-bg); }
      .pt-n.pt-both circle { stroke: var(--pp-y); stroke-width: 3; fill: var(--st-active-bg); }
      .pt-e { fill: none; stroke: var(--border-hi); stroke-width: 1.2; }

      #explain { padding: var(--sp-5); font-family: var(--font-serif); font-size: var(--fs-sm); line-height: 1.65; }
      #explain p { margin: 0 0 var(--sp-4); }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>Pumping Explorer</h1>
      <div style="width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0"></div>
      <button class="mode-btn active" id="btn-mode-regular" onclick="setMode('regular')">Regular: DFA</button>
      <button class="mode-btn" id="btn-mode-cf" onclick="setMode('cf')">Context-free: parse tree</button>
    </div>

    <div id="panels">
      <!-- 1. The machine or grammar -->
      <div class="panel" id="p-def" data-priority="2">
        <div class="panel-header">
          <span class="panel-title" id="def-title">DFA</span>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-def');">&#8249;</button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example</option>
            </select>
          </div>
          <div id="regex-row">
            <input id="regex-input" class="ui-input" type="text" spellcheck="false" placeholder="regular expression, e.g. (a|b)*abb" />
            <button class="btn" onclick="regexToDFA()" title="Replace the DFA below by the minimal DFA of this expression">→ DFA</button>
          </div>
          <textarea id="grammar-input" spellcheck="false"></textarea>
          <div id="def-note"></div>
          <div id="grammar-footer"><div id="error-msg"></div></div>
        </div>
      </div>

      <div class="resize-handle" id="rh-1"></div>

      <!-- 2. Pump: the controls, the drawing and the reading in one panel -->
      <div class="panel" id="p-main" data-priority="4">
        <div class="panel-header">
          <span class="panel-title" id="view-title">Why a long string can be pumped</span>
        </div>
        <div class="panel-body">
          <div id="ctl-top">
            <div class="ui-sim__row">
              <div class="input-group">
                <input id="w-input" class="ui-input ui-input--lg" type="text" spellcheck="false" />
              </div>
            </div>
            <div id="pump-bar" class="ui-bar">
              <span class="ui-label" id="pump-label">repeat y</span>
              <input id="pump-i" type="range" min="0" max="6" value="1" />
              <span id="pump-i-val">i = 1</span>
            </div>
            <div id="walk-bar" class="ui-bar">
              <span class="ui-label" id="walk-label">walk</span>
              <div class="step-group">
                <button class="btn icon-restart" id="btn-walk-reset" onclick="walk.reset()" title="Back to the start" disabled></button>
                <button class="btn" id="btn-walk-back" onclick="walk.prev()" disabled>&#8249; Back</button>
                <button class="btn primary" id="btn-walk-step" onclick="walk.next()" disabled>Step &#8250;</button>
                <button class="btn icon-run-all" id="btn-walk-all" onclick="walk.end()" title="To the end" disabled></button>
              </div>
              <button class="btn" id="btn-other" onclick="otherRepeat()" title="Use another repeated nonterminal on the path" hidden>Another repeat</button>
            </div>
          </div>
          <div id="work">
            <div id="canvases">
              <div id="canvas-dfa" class="ui-canvas">
                <svg id="dfa-svg"><g id="dfa-graph-root"></g></svg>
                <div id="dfa-graph-empty" class="ui-canvas__empty">Define a DFA.</div>
              </div>
              <div id="canvas-tree" class="ui-canvas" hidden>
                <svg id="tree-svg"><g id="tree-root"></g></svg>
                <div id="tree-empty" class="ui-canvas__empty">Enter a string the grammar generates.</div>
              </div>
            </div>
            <div id="side">
              <div id="strip"></div>
              <div id="explain"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- #panels -->

    <script src="../../shared/algo/grammar.js?v=39525f46"></script>
    <script src="../../shared/algo/panels.js?v=92261e45"></script>
    <script src="../../shared/algo/share.js?v=e7dd4a97"></script>
    <script src="../../shared/algo/strings.js?v=2449eeb3"></script>
    <script src="../../shared/algo/regex.js?v=f2d4691d"></script>
    <script src="../../shared/algo/rdp.js?v=9fe07733"></script>
    <script src="../../shared/algo/pumping.js?v=9850ae52"></script>
    <script src="../../shared/shared.js?v=22f37a65"></script>
    <script src="../../shared/fit-view.js?v=0b11c570"></script>
    <script src="../../shared/share-link.js?v=0d17f714"></script>
    <script src="../../shared/ui.js?v=b7fb54c9"></script>
    <script src="../../shared/algo/qr.js?v=bbd7ba7a"></script>
    <script src="../../shared/qr-modal.js?v=4dcb4b2f"></script>
    <script src="../../shared/quick-link.js?v=fca552e1"></script>
    <script src="../../shared/view-menu.js?v=131965d4"></script>
    <script src="guide.js?v=08304ad6"></script>
    <script src="../../shared/guide.js?v=98cfe80c"></script>
    <script src="../../shared/stepper.js?v=b99ccf2b"></script>
    <script src="../../shared/automaton-graph.js?v=8821f7da"></script>
    <script>
      initResize("rh-1", "p-def", +1);

      const EXAMPLES = {};
      const $ = (id) => document.getElementById(id);

      let ppMode = "regular"; // regular | cf
      let ppDFA = null; // the parsed DFA (regular mode)
      let ppG = null; // the parsed grammar (context-free mode)
      let ppStrings = []; // sample strings of the loaded example
      let ppReg = null; // regular explorer: { w, run, loop, parts }
      let ppCF = null; // context-free explorer: { tokens, tree, tagged, pairs, pairIdx, parts }
      const ppSep = () => (ppG && [...ppG.terminals].some((t) => [...t].length > 1) ? " " : "");

      // ── Mode ──────────────────────────────────────────────────
      function setMode(m) {
        ppMode = m;
        $("btn-mode-regular").classList.toggle("active", m === "regular");
        $("btn-mode-cf").classList.toggle("active", m === "cf");
        $("def-title").textContent = m === "regular" ? "DFA" : "Grammar";
        $("regex-row").hidden = m !== "regular";
        $("canvas-dfa").hidden = m !== "regular";
        $("canvas-tree").hidden = m !== "cf";
        $("walk-bar").querySelector(".step-group").hidden = m !== "regular";
        $("walk-label").hidden = m !== "regular";
        $("btn-other").hidden = m !== "cf";
        $("pump-label").textContent = m === "regular" ? "repeat y" : "repeat v, y";
        $("pump-i").max = m === "regular" ? 6 : 4;
        $("grammar-input").placeholder = m === "regular" ? "start: q0\naccept: q1\nq0 a q1\nq1 b q0" : "S -> a S b | eps";
        saveShare();
        buildDef();
      }

      function setError(msg) { $("error-msg").textContent = msg || ""; }

      // ── Definition ────────────────────────────────────────────
      function buildDef() {
        const text = $("grammar-input").value;
        setError("");
        $("def-note").textContent = "";
        if (ppMode === "regular") {
          try { ppDFA = pumpParseDFA(text); } catch (e) { ppDFA = null; setError(e.message); }
          $("def-note").textContent = ppDFA ? ppDFA.states.length + " states: a string with at least that many symbols must visit some state twice." : "";
          drawDFA();
        } else {
          try { ppG = rdpParseGrammar(text); } catch (e) { ppG = null; setError(e.message); }
          const rec = ppG ? rdpLeftRecursive(ppG) : [];
          $("def-note").textContent = rec.length ? "Left-recursive: " + rec.join(", ") + ". The parser used here cannot handle that; remove the left recursion first (Grammar Transformations)." : "";
        }
        saveShare();
        explore();
      }

      function regexToDFA() {
        const src = $("regex-input").value.trim();
        if (!src) return;
        try {
          const min = minimizeDFA(subsetConstruct(regexToNFA(src)));
          $("grammar-input").value = pumpDFAToText(pumpDFAFromMin(min));
          buildDef();
        } catch (e) { setError(e.message); }
      }

      // ── Exploring ─────────────────────────────────────────────
      function explore() {
        if (ppMode === "regular") exploreRegular(); else exploreCF();
      }

      const partOf = (parts, pos) => (pos < parts.x.length ? "x" : pos < parts.x.length + parts.yN ? "y" : "z");

      // Regular: the path of the string through the DFA, the first repeated state, and the pumped string.
      function exploreRegular() {
        ppReg = null;
        const w = $("w-input").value.trim();
        if (!ppDFA) { renderRegular(); return; }
        const run = pumpDFARun(ppDFA, w);
        const loop = pumpFindLoop(run.path);
        ppReg = { w, run, loop, parts: loop ? pumpSplit(w, loop) : null };
        renderRegular();
      }

      function pumpedRegular() {
        const i = +$("pump-i").value;
        return ppReg && ppReg.parts ? pumpJoin(ppReg.parts, i) : ppReg ? ppReg.w : "";
      }

      function renderRegular() {
        const i = +$("pump-i").value;
        $("pump-i-val").textContent = "i = " + i;
        const strip = $("strip");
        const ex = $("explain");
        if (!ppDFA || !ppReg) { strip.innerHTML = ""; ex.innerHTML = "<p>Define a DFA on the left.</p>"; paintGraph(); walk.pos = 0; walk.refresh(); return; }
        const { w, run, loop, parts } = ppReg;
        const k = ppDFA.states.length;
        const name = (s) => ppDFA.states[s];
        const pumped = pumpedRegular();
        const prun = pumpDFARun(ppDFA, pumped);
        const px = parts ? [...parts.x].length : 0, py = parts ? [...parts.y].length : 0;
        const roleAt = (pos) => (!parts ? "z" : pos < px ? "x" : pos < px + i * py ? "y" : "z");

        let html = "";
        if (parts) {
          html += '<div class="pp-row"><span class="ui-label">split</span><span class="pp-formula">w = <b class="pp-x">x</b> <b class="pp-y">y</b> <b class="pp-z">z</b> with <b class="pp-x">x</b> = ' + q(parts.x) + ", <b class=\"pp-y\">y</b> = " + q(parts.y) + ", <b class=\"pp-z\">z</b> = " + q(parts.z) + "; |xy| = " + loop.t + " ≤ " + k + "</span></div>";
        } else {
          html += '<div class="pp-row"><span class="ui-label">split</span><span class="pp-formula">no state is visited twice</span></div>';
        }
        html += '<div class="pp-row"><span class="ui-label">string</span><div class="pp-body" id="strip-chars">' +
          ([...pumped].map((ch, pos) => '<span class="pp-ch pp-' + roleAt(pos) + '" data-pos="' + pos + '">' + esc(ch) + "</span>").join("") || '<span class="pp-ch pp-x">ε</span>') + "</div></div>";
        // the loop state sits at the start of every round of the loop
        const loopPos = new Set();
        if (parts) for (let m = 0; m <= i; m++) loopPos.add(px + m * py);
        const pathHtml = prun.path.map((s, pos) => {
          const isLoop = loopPos.has(pos);
          const role = !parts ? "z" : pos <= px ? "x" : pos <= px + i * py ? "y" : "z";
          return '<span class="pp-st pp-' + role + (isLoop ? " pp-loop" : "") + '" data-pos="' + pos + '">' + esc(name(s)) + "</span>";
        });
        html += '<div class="pp-row"><span class="ui-label">path</span><div class="pp-body">' + pathHtml.join('<span class="pp-arrow">→</span>') + (prun.stuckAt >= 0 ? '<span class="pp-arrow">→ stops (no transition)</span>' : "") + "</div></div>";
        strip.innerHTML = html;

        let t = "";
        if (parts) {
          t += "<p>The path of <b>" + esc(w || "ε") + "</b> visits " + (w.length + 1) + " states; the DFA has " + k + ". State <b>" + esc(name(run.path[loop.s])) + "</b> is visited twice (after " + loop.s + " and " + loop.t + " symbols), so the symbols between, <b class=\"pp-y\">" + esc(parts.y) + "</b>, form a loop.</p>";
          t += "<p>The loop taken " + i + (i === 1 ? " time (the original string)" : " times") + " gives <b>" + esc(pumped || "ε") + "</b>. Each round returns to the same state, so the DFA ends in the same state: it " + (prun.accepted ? "<b>accepts</b>" : "<b>rejects</b>") + " this string, as it " + (run.accepted ? "accepts" : "rejects") + " the original. Pumping does not change the verdict.</p>";
        } else if (run.stuckAt >= 0) {
          t += "<p>The DFA stops at symbol " + (run.stuckAt + 1) + " (no transition) before any state repeats.</p>";
        } else {
          t += "<p><b>" + esc(w || "ε") + "</b> has " + w.length + " symbols and the DFA has " + k + " states: no state need repeat. A string of at least " + k + " symbols forces a repeat.</p>";
        }
        ex.innerHTML = t;
        paintGraph();
        walk.pos = 0;
        walk.refresh();
        paintWalk();
      }
      const q = (s) => "“" + esc(s || "ε") + "”";

      // The drawing of the DFA, then colouring of the path's edges.
      let dfaView = null;
      function drawDFA() {
        if (!dfaView) dfaView = createGraphView("dfa", { hasNodes: () => !!ppDFA });
        if (!ppDFA) { drawAutomatonGraph("dfa", dfaView, { nodes: [], start: 0, edges: [] }); return; }
        const d = ppDFA;
        const edgeMap = new Map(), loops = new Map();
        d.states.forEach((_, s) => {
          for (const a of d.alpha) {
            const t = d.next[s][a];
            if (t === undefined) continue;
            if (t === s) loops.set(s, (loops.get(s) || []).concat(a));
            else edgeMap.set(s + "-" + t, (edgeMap.get(s + "-" + t) || []).concat(a));
          }
        });
        drawAutomatonGraph("dfa", dfaView, {
          nodes: d.states.map((n, i) => ({ label: n, accepting: d.accepts.has(i) })),
          start: d.start,
          edges: [...edgeMap].map(([key, labels]) => { const [from, to] = key.split("-").map(Number); return { from, to, labels }; }),
          loops: [...loops].map(([node, labels]) => ({ node, labels })),
          joinLabels: true,
        });
      }
      function paintGraph() {
        d3.selectAll("#dfa-graph-root .ag-edge").classed("pump-x", false).classed("pump-y", false).classed("pump-z", false);
        d3.selectAll("#dfa-graph-root .ag-node").classed("pump-loop", false);
        if (!ppDFA || !ppReg) return;
        const i = +$("pump-i").value;
        const parts = ppReg.parts;
        const pumped = pumpedRegular();
        const prun = pumpDFARun(ppDFA, pumped);
        const px = parts ? [...parts.x].length : 0, py = parts ? [...parts.y].length : 0;
        const roleOf = new Map();
        for (let pos = 0; pos + 1 < prun.path.length; pos++) {
          const role = !parts ? "z" : pos < px ? "x" : pos < px + i * py ? "y" : "z";
          const a = prun.path[pos], b = prun.path[pos + 1];
          const key = a === b ? "self-" + a : "edge-" + a + "-" + b;
          if (!roleOf.has(key) || role === "y") roleOf.set(key, role);
        }
        for (const [key, role] of roleOf) {
          const sel = key.startsWith("self-") ? '#dfa-graph-root .ag-edge[data-self="' + key.slice(5) + '"]' : '#dfa-graph-root .ag-edge[data-edge="' + key.slice(5) + '"]';
          d3.selectAll(sel).classed("pump-" + role, true);
        }
        if (ppReg.loop) d3.select("#dfa-state-" + ppReg.run.path[ppReg.loop.s]).classed("pump-loop", true);
      }

      // The walk: the string is read one symbol at a time and the machine's state follows.
      const walk = createStepper({
        buttons: { reset: "btn-walk-reset", back: "btn-walk-back", step: "btn-walk-step", all: "btn-walk-all" },
        min: 0,
        last: () => (ppMode === "regular" && ppReg && ppDFA ? Math.max(0, pumpDFARun(ppDFA, pumpedRegular()).path.length - 1) : null),
        onChange: () => paintWalk(),
      });
      function paintWalk() {
        if (ppMode !== "regular" || !ppDFA || !ppReg) return;
        const prun = pumpDFARun(ppDFA, pumpedRegular());
        const pos = Math.min(walk.pos, prun.path.length - 1);
        highlightAutomatonStates("dfa", [prun.path[pos]]);
        document.querySelectorAll("#strip-chars .pp-ch").forEach((el) => {
          const p = +el.dataset.pos;
          el.classList.toggle("pp-read", p < pos);
          el.classList.toggle("pp-now", p === pos);
        });
        document.querySelectorAll("#strip .pp-st").forEach((el) => el.classList.toggle("pp-now", +el.dataset.pos === pos));
      }

      // ── Context-free ──────────────────────────────────────────
      function exploreCF() {
        ppCF = null;
        const w = $("w-input").value.trim();
        if (!ppG) { renderCF(); return; }
        const tokens = rdpTokenise(ppG, w);
        const r = pumpParseTree(ppG, tokens);
        if (!r.tree) { ppCF = { w, tokens, tree: null, aborted: r.aborted }; renderCF(); return; }
        const pairs = pumpPairs(r.tree);
        ppCF = { w, tokens, tree: r.tree, pairs, pairIdx: 0 };
        setPair(0);
      }
      function setPair(k) {
        if (!ppCF || !ppCF.tree) return;
        ppCF.pairIdx = ppCF.pairs.length ? k % ppCF.pairs.length : 0;
        const pair = ppCF.pairs[ppCF.pairIdx];
        ppCF.parts = pair ? pumpDecompose(ppCF.tree, pair) : null;
        ppCF.tagged = pair ? pumpTag(ppCF.tree, pair) : ppCF.tree;
        renderCF();
      }
      function otherRepeat() { if (ppCF && ppCF.pairs.length > 1) setPair(ppCF.pairIdx + 1); }

      function renderCF() {
        const i = +$("pump-i").value;
        $("pump-i-val").textContent = "i = " + i;
        $("btn-other").disabled = !(ppCF && ppCF.pairs && ppCF.pairs.length > 1);
        const strip = $("strip"), ex = $("explain");
        const sep = ppSep();
        if (!ppG) { strip.innerHTML = ""; ex.innerHTML = "<p>Define a grammar on the left.</p>"; drawTree(null); return; }
        if (!ppCF || !ppCF.tree) {
          strip.innerHTML = "";
          ex.innerHTML = ppCF && ppCF.aborted === "left-recursion" ? "<p>The grammar is left-recursive, which the parser cannot handle.</p>" : "<p>The grammar does not generate <b>" + esc(ppCF ? ppCF.w || "ε" : "") + "</b>: there is no parse tree to pump.</p>";
          drawTree(null);
          return;
        }
        const pair = ppCF.pairs[ppCF.pairIdx];
        const nts = ppG.nonterminals.size;
        let html = "";
        if (pair) {
          const pr = ppCF.parts;
          const j = (a) => a.join(sep);
          html += '<div class="pp-row"><span class="ui-label">split</span><span class="pp-formula">w = <b class="pp-u">u</b> <b class="pp-v">v</b> <b class="pp-x">x</b> <b class="pp-y">y</b> <b class="pp-z">z</b> with u = ' + q(j(pr.u)) + ", v = " + q(j(pr.v)) + ", x = " + q(j(pr.x)) + ", y = " + q(j(pr.y)) + ", z = " + q(j(pr.z)) + "</span></div>";
          const pumpedTree = pumpTree(ppCF.tagged, pair, i);
          const leaves = pumpLeaves(pumpedTree);
          html += '<div class="pp-row"><span class="ui-label">yield</span><div class="pp-body">' + (leaves.map((l) => '<span class="pp-ch pp-' + l.part + '">' + esc(l.sym) + "</span>").join(sep ? " " : "") || '<span class="pp-ch pp-x">ε</span>') + "</div></div>";
        } else {
          html += '<div class="pp-row"><span class="ui-label">split</span><span class="pp-formula">no path repeats a nonterminal with something between</span></div>';
        }
        strip.innerHTML = html;
        let t = "";
        if (pair) {
          const A = pumpGet(ppCF.tree, pair.up).sym;
          const pr = ppCF.parts;
          t += "<p>The tree of <b>" + esc(ppCF.w || "ε") + "</b> has a path on which the nonterminal <b>" + esc(A) + "</b> occurs twice. The lower " + esc(A) + " derives <b class=\"pp-x\">" + esc(pr.x.join(sep) || "ε") + "</b>; the upper one derives <b class=\"pp-v\">" + esc(pr.v.join(sep) || "ε") + "</b> <b class=\"pp-x\">" + esc(pr.x.join(sep) || "ε") + "</b> <b class=\"pp-y\">" + esc(pr.y.join(sep) || "ε") + "</b>. Both are " + esc(A) + ", so the part between them can be repeated or removed.</p>";
          t += "<p>With i = " + i + (i === 1 ? " (the original tree)" : i === 0 ? ": the lower " + esc(A) + " replaces the upper one" : ": the middle part is repeated " + i + " times") + ". The result is a parse tree of the grammar, so its yield is in the language.</p>";
          t += "<p class=\"ui-label\">A path with more than " + nts + " nonterminal" + (nts === 1 ? "" : "s") + " on it must repeat one (the grammar has " + nts + ")." + (ppCF.pairs.length > 1 ? " " + ppCF.pairs.length + " repeats on the longest paths; “Another repeat” selects the next." : "") + "</p>";
        } else {
          t += "<p>No path of this tree repeats a nonterminal with something between the occurrences. A longer string is needed.</p>";
        }
        ex.innerHTML = t;
        drawTree(pair ? pumpTree(ppCF.tagged, pair, i) : ppCF.tree);
      }

      let treeView = null;
      function drawTree(tree) {
        if (!treeView) treeView = createFitView({ svg: "tree-svg", root: "tree-root", scaleExtent: [0.08, 3], maxScale: 1, pad: 16, hasContent: () => ppMode === "cf" });
        const g = d3.select("#tree-root");
        g.selectAll("*").remove();
        $("tree-empty").style.display = tree ? "none" : "";
        if (!tree) return;
        const h = d3.hierarchy(tree, (d) => d.children);
        d3.tree().nodeSize([30, 56]).separation((a, b) => (a.data.leaf && b.data.leaf ? 1 : 1.2))(h);
        g.append("g").selectAll("path").data(h.links()).join("path").attr("class", "pt-e")
          .attr("d", (l) => "M" + l.source.x + "," + (l.source.y + 12) + "C" + l.source.x + "," + (l.source.y + 30) + " " + l.target.x + "," + (l.target.y - 30) + " " + l.target.x + "," + (l.target.y - 12));
        const cls = (d) => "pt-n" + (d.data.leaf ? " pt-leaf" : "") + (d.data.eps ? " pt-eps" : "") + (d.data.part ? " pt-" + d.data.part : "") + (d.data.mark ? " pt-" + d.data.mark : "");
        const ns = g.append("g").selectAll("g").data(h.descendants()).join("g").attr("class", cls).attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
        ns.append("circle").attr("r", (d) => (d.data.leaf ? 0 : 13));
        ns.append("text").attr("dy", "0.35em").text((d) => d.data.sym);
        treeView.refit();
      }

      // ── Wiring ────────────────────────────────────────────────
      $("grammar-input").addEventListener("input", () => { clearTimeout(ppTimer); ppTimer = setTimeout(buildDef, 300); });
      let ppTimer = null;
      $("w-input").addEventListener("input", () => { explore(); saveShare(); });
      $("pump-i").addEventListener("input", () => { if (ppMode === "regular") renderRegular(); else renderCF(); });
      registerStepper("p-main", { step: () => walk.next(), back: () => walk.prev(), reset: () => walk.reset(), end: () => walk.end() }, { primary: true });

      UI.stringInput("w-input", {
        examples: () => ppStrings,
        onPick: () => { explore(); saveShare(); },
        random() {
          if (ppMode === "regular") {
            if (!ppDFA) return null;
            // a random string that the DFA accepts, longer than its number of states when possible
            const k = ppDFA.states.length;
            for (let tries = 0; tries < 400; tries++) {
              let s = "";
              const len = k + Math.floor(Math.random() * 4);
              for (let n = 0; n < len; n++) s += ppDFA.alpha[Math.floor(Math.random() * ppDFA.alpha.length)];
              if (pumpDFARun(ppDFA, s).accepted) return s;
            }
            return null;
          }
          if (!ppG) return null;
          const s = grammarRandomSentence(ppG.base, Math.random, { minTerms: 4, maxTerms: 10 });
          return s ? s.join(ppSep()) : null;
        },
      });

      // ── Examples and shareable link ───────────────────────────
      function loadExample(k) {
        if (!k) return;
        const ex = EXAMPLES[k];
        if (!ex) return;
        $("examples-select").value = k;
        ppStrings = ex.strings || [];
        $("grammar-input").value = ex.text;
        $("w-input").value = ppStrings[0] || "";
        $("pump-i").value = ex.i === undefined ? 2 : ex.i;
        if ((ex.mode || "regular") !== ppMode) setMode(ex.mode || "regular");
        else buildDef();
      }

      const saveShare = createShareSaver(() => ({ g: $("grammar-input").value, s: $("w-input").value, m: ppMode }));
      let sharedStateApplied = false;
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g", ["regular", "cf"]);
        if (!st) return;
        sharedStateApplied = true;
        $("grammar-input").value = st.g;
        $("w-input").value = st.s;
        if (st.m) ppMode = st.m;
      }

      initPanelStorage("pumping-tool-v2", ["p-def", "p-main"]);
      loadPanelState();
      initAlgoModal();
      applyShareState();
      loadExamplesInto("examples.json", "examples-select", EXAMPLES, () => {
        const first = Object.keys(EXAMPLES)[0];
        if (first && !sharedStateApplied) loadExample(first);
      });
      setMode(ppMode);
    </script>
  </body>
</html>
