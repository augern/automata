<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive LR parser — build LR(0)/SLR(1)/LALR(1)/LR(1) automata, compute ACTION/GOTO tables, and step through string simulation with a live parse tree." />
    <title>LR Parser | Parser Tools</title>
    <script src="../../vendor/d3.min.js?v=6d64bd2f"></script>
    <script src="../../vendor/dagre.min.js?v=15b1e755"></script>
    <link rel="stylesheet" href="../../shared/shared.css?v=c6c2522b" />
    <link rel="stylesheet" href="../../shared/ui.css?v=3d674843" />
    <script src="../../shared/theme.js?v=9222f18e"></script>
    <style>
      /* Panel weights (--pw: pixels at a ~1400px window) and minimum widths; see shared.css */
      #p-automaton { --pw: 520; --pmin: 200px; }

      /* ── Automaton panel + container ── */
      #p-automaton {
      }
      /* touch-action:none lets D3 capture trackpad pinch/pan without browser interference */
      #cy {
        width: 100%;
        height: 100%;
        background: var(--bg);
        touch-action: none;
      }

      /* ── Automaton SVG: Graphviz dot aesthetic ── */
      /* State node rectangles: white fill, thin black border */
      .node rect {
        fill: var(--bg);
        stroke: var(--text);
        stroke-width: 1;
        transition:
          fill 0.2s,
          stroke 0.2s,
          stroke-width 0.2s;
      }
      /* Accept state: inset double-border rect */
      .node .accept-border {
        fill: none;
        stroke-width: 1 !important;
      }

      /* Header separator line (bottom border of state label band) */
      .node .header {
        stroke: var(--border);
        stroke-width: 1;
        transition: stroke 0.2s;
      }

      /* State label */
      .state-label {
        font-size: 11px;
        font-weight: bold;
        fill: var(--text);
        font-family: var(--font-mono);
      }
      .node.accepting .state-label {
        fill: var(--green);
      }

      /* Separator rule inside node */
      .sep {
        stroke: var(--border);
        stroke-width: 0.75;
        stroke-dasharray: 3, 3;
        opacity: 0.8;
      }

      /* LR item text */
      .item-text {
        font-size: 11px;
        fill: var(--text-dim);
        font-family: var(--font-mono);
      }
      .item-dot {
        font-size: 11px;
        fill: var(--amber);
        font-family: var(--font-mono);
        font-weight: bold;
      }
      .lookahead {
        font-size: 10px;
        fill: var(--green);
        font-family: var(--font-mono);
      }

      /* Edges: hairline arrows */
      .edge path {
        fill: none;
        stroke: var(--text);
        stroke-width: 0.9;
        transition: stroke 0.2s;
      }
      .edge text {
        font-size: 11px;
        fill: var(--text-dim);
        font-family: var(--font-mono);
        font-style: italic;
      }
      .arrowhead {
        fill: var(--text);
        transition: fill 0.2s;
      }

      /* ── Simulation highlights ── */
      /* Active (current) state */
      .node.active rect {
        fill: var(--accent-bg) !important;
        stroke: var(--accent) !important;
        stroke-width: 2 !important;
      }
      .node.active .header {
        stroke: var(--accent) !important;
      }
      .node.active .state-label {
        fill: var(--accent) !important;
      }
      .node.active .item-text {
        fill: var(--text) !important;
      }
      .node.active .item-dot {
        fill: var(--amber) !important;
      }
      .node.active .sep {
        stroke: var(--accent) !important;
      }
      .node.accepting.active rect {
        stroke: var(--green) !important;
      }
      .node.accepting.active .header {
        stroke: var(--green) !important;
      }
      .node.accepting.active .state-label {
        fill: var(--green) !important;
      }

      /* On-stack states: subtle grey tint */
      .node.on-stack rect {
        fill: var(--bg-hover) !important;
        stroke: var(--border-hi) !important;
      }
      .node.on-stack .header {
        stroke: var(--border) !important;
      }
      .node.on-stack .state-label {
        fill: var(--text-dim) !important;
      }
      .node.on-stack .item-text {
        fill: var(--text-lo) !important;
      }

      /* Active edge */
      .edge.active path {
        stroke: var(--accent) !important;
        stroke-width: 1.5 !important;
      }
      .edge.active text {
        fill: var(--accent) !important;
      }
      .edge.active .arrowhead {
        fill: var(--accent) !important;
      }/* ── Construction simulation controls ── */
      #build-row {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        flex-wrap: wrap;
        padding-left: 0.5em;
        padding-top: var(--sp-1);
        padding-bottom: var(--sp-1);
      }
      #cstep-row {
        display: flex;
        gap: var(--sp-2);
        padding-left: var(--sp-3);
      }
      /* Compact button row inside the tables panel — smaller than standard .btn */
      #tstep-controls .btn {
        height: 18px;
        font-size: var(--fs-2xs);
        padding: 0 var(--sp-3);
      }
      #cstep-log:empty,
      #error-msg:empty { display: none; }
      #cstep-log .lg-op {
        color: var(--accent);
      }
      #cstep-log .lg-item {
        color: var(--text);
      }
      #cstep-log .lg-seen {
        color: var(--text-lo);
        font-style: italic;
      }
      #cstep-log .lg-goto {
        color: var(--purple);
      }
      #cstep-log .lg-new {
        color: var(--green);
      }
      #cstep-log .lg-done {
        color: var(--text);
        font-weight: bold;
      }

      /* Construction node states */
      .node.c-pending rect {
        fill: var(--bg-cell) !important;
        stroke: var(--border) !important;
        opacity: 0.15;
      }
      .node.c-pending text,
      .node.c-pending .item-text,
      .node.c-pending .state-label {
        fill: var(--border-hi) !important;
      }
      /* Individual items not yet formally added during step-by-step construction */
      text.item-pending {
        opacity: 0.15;
      }
      .node.c-active rect {
        fill: var(--accent-bg) !important;
        stroke: var(--accent) !important;
        stroke-width: 2.5 !important;
      }
      .node.c-active .header {
        stroke: var(--accent) !important;
      }
      .node.c-active .state-label {
        fill: var(--accent) !important;
      }
      .node.c-active .item-text {
        fill: var(--text) !important;
      }
      .node.c-active .item-dot {
        fill: var(--amber) !important;
      }
      .node.c-active .sep {
        stroke: var(--accent) !important;
      }
      .edge.c-pending path {
        stroke: var(--border-lo) !important;
        opacity: 0.3;
      }
      .edge.c-pending text {
        fill: var(--border-lo) !important;
        opacity: 0.3;
      }
      .edge.c-active path {
        stroke: var(--accent) !important;
        stroke-width: 2 !important;
      }
      .edge.c-active text {
        fill: var(--accent) !important;
        font-weight: bold;
      }
      .edge.c-active .arrowhead {
        fill: var(--accent) !important;
      }/* ── Table construction simulation ── *//* All table cells dimmed during stepping, active cell highlighted */
      #tstep-controls .btn {
        line-height: 1;
      }
      #tstep-log-bar .lg-op {
        color: var(--accent);
      }
      #tstep-log-bar .lg-seen {
        color: var(--text-lo);
        font-style: italic;
      }
      #tstep-log-bar .lg-conf {
        color: var(--red);
      }

      /* ── Table-construction automaton highlight (lecture red) ── */
      .node.t-hi rect {
        stroke: var(--red) !important;
        stroke-width: 2.5 !important;
        fill: var(--red-bg) !important;
      }
      .node.t-hi .header {
        stroke: var(--red) !important;
      }
      .node.t-hi .state-label {
        fill: var(--red) !important;
      }
      .node.t-hi .item-text {
        fill: var(--text) !important;
      }
      .edge.t-hi path {
        stroke: var(--red) !important;
        stroke-width: 2 !important;
      }
      .edge.t-hi text {
        fill: var(--red) !important;
        font-weight: bold;
      }
      .edge.t-hi .arrowhead {
        fill: var(--red) !important;
      }

      /* ── Conflict item highlights (click a conflict cell to reveal) ── */
      text.item-hi-a,
      text.item-hi-a tspan {
        fill: var(--amber) !important;
        font-weight: bold;
      }
      text.item-hi-b,
      text.item-hi-b tspan {
        fill: var(--red) !important;
        font-weight: bold;
      }
      .node.conflict-hi rect {
        stroke: var(--red) !important;
        stroke-width: 2.5 !important;
      }
      .node.conflict-hi .header {
        stroke: var(--red) !important;
      }
      .parse-table td.conflict {
        cursor: pointer;
      }
      .parse-table td.conflict:hover {
        filter: brightness(1.2);
      }
      .parse-table td.conflict.conflict-active {
        outline: 2px solid var(--amber) !important;
        outline-offset: -2px;
      }

      /* ── Parse trace buttons (in sim-header) ── */
      #trace-sep {
        color: var(--border-hi);
        font-size: var(--fs-xs);
        padding: 0 1px;
      }

    </style>
  </head>
  <body>
    <div id="topbar">
      <h1><a href="../../index.html">LR Parser Tool</a></h1>
      <button class="mode-btn active" id="btn-lr0" onclick="setMode('LR0')">LR(0)</button>
      <button class="mode-btn" id="btn-slr1" onclick="setMode('SLR1')">SLR(1)</button>
      <button class="mode-btn" id="btn-lalr1" onclick="setMode('LALR1')">LALR(1)</button>
      <button class="mode-btn" id="btn-lr1" onclick="setMode('LR1')">LR(1)</button>
      <label id="merge-la-label" style="display: none; align-items: center; gap: 4px; font-size: var(--fs-2xs); color: var(--text-dim); cursor: pointer; margin-left: 6px">
        <input type="checkbox" id="merge-la-cb" onchange="setMergeLA(this.checked)" style="cursor: pointer; accent-color: var(--accent)" />
        Merge lookahead sets
      </label>
      <label style="display: none" title="Prepend a fresh start production S′ → S to the grammar">
        <input type="checkbox" id="augment-cb" checked onchange="if (currentGrammar) build();" />
        Augment grammar
      </label>
    </div>
    <div id="panels">
      <!-- 1. Grammar -->
      <div class="panel" id="p-grammar" data-priority="3" data-collapse="left">
        <div class="panel-header">
          <span class="panel-title">Grammar</span>
          <button
            class="collapse-btn"
            onclick="
              event.stopPropagation();
              toggleCollapse('p-grammar');
            "
          >
            &#8249;
          </button>
        </div>
        <div class="panel-body">
          <div id="examples-bar">
            <select id="examples-select" onchange="loadExample(this.value)">
              <option value="">Example Grammar</option>
            </select>
          </div>
          <textarea id="grammar-input" spellcheck="false" placeholder="S -> E&#10;E -> E + T | T&#10;T -> id"></textarea>
        </div>
      </div>
      <div class="resize-handle" id="rh-1"></div>
      <!-- 2. Automaton -->
      <div class="panel" id="p-automaton" data-priority="2">
        <div class="panel-header">
          <span class="panel-title">Characteristic Automaton</span>
          <button class="algo-btn" onclick="openAlgoModal('construction')" title="Closure, Goto &amp; Items construction algorithm">Algorithm</button>
          <button class="algo-btn" id="btn-layout" onclick="toggleLayout()" title="Toggle automaton layout direction">&#8644; Horizontal</button>
          <button class="collapse-btn" onclick="event.stopPropagation(); toggleCollapse('p-automaton');">&#8250;</button>
        </div>
        <div class="panel-body">
          <div id="automaton-header" class="ui-sim">
            <div id="build-row">
                <p>Simulate</p>
              <div id="build-mode-row" class="ui-field">
                <label><input type="radio" name="build-mode" value="coarse" checked onchange="setBuildMode('coarse')" /> Coarse steps</label>
                <label><input type="radio" name="build-mode" value="fine" onchange="setBuildMode('fine')" /> Fine steps</label>
              </div>
              <div id="cstep-row">
                <div class="step-group">
                  <button class="btn icon-restart" id="btn-cstart" onclick="cReset()" title="Restart construction" disabled></button>
                  <button class="btn" id="btn-cback" onclick="cBack()" disabled>&#8249; Back</button>
                  <button class="btn primary" id="btn-cstep" onclick="cStep()" disabled>Construction Step &#8250;</button>
                  <button class="btn icon-run-all" id="btn-crun" onclick="cRunAll()" title="Run all" disabled></button>
                </div>
              </div>
            </div>
            <div id="cstep-log" class="ui-logbar"></div>
            <div id="error-msg"></div>
          </div>
          <div class="automaton-container ui-canvas">
            <svg id="cy" width="100%" height="100%">
              <defs>
                <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L8,3 z" class="arrowhead" />
                </marker>
              </defs>
              <g id="root"></g>
            </svg>
            <div id="empty-msg" class="ui-canvas__empty">Enter a grammar above</div>
          </div>
        </div>
      </div>
      <div class="resize-handle" id="rh-2"></div>
      <!-- 3. Tables -->
      <div class="panel" id="p-tables" data-priority="4">
        <div class="panel-header">
          <span class="panel-title">Parsing Tables</span>
          <button
            class="algo-btn"
            onclick="event.stopPropagation(); openAlgoModal('tables');"
            title="Table construction algorithm"
          >Algorithm</button>
          <button
            class="collapse-btn"
            onclick="event.stopPropagation(); toggleCollapse('p-tables');"
          >&#8250;</button>
        </div>
        <div id="tstep-controls" style="display: flex; align-items: center; gap: 6px; padding: 3px 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border-lo); font-size: var(--fs-2xs); font-family: var(--font-mono); color: var(--text-dim); min-height: 1.8em">
          <p>Simulate</p>
          <div class="step-group">
            <button class="btn icon-restart" id="btn-treset" onclick="event.stopPropagation(); tReset();" title="Restart" disabled></button>
            <button class="btn" id="btn-tback" onclick="event.stopPropagation(); tBack();" disabled>&#8249; Back</button>
            <button class="btn primary" id="btn-tstep" onclick="event.stopPropagation(); tStep();" disabled>Table Step &#8250;</button>
            <button class="btn icon-run-all" id="btn-trun" title="Run all" onclick="event.stopPropagation(); tRunAll();" disabled></button>
          </div>
        </div>
        <div id="tstep-log-bar" style="display: none; padding: 3px 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border-lo); font-size: var(--fs-2xs); font-family: var(--font-mono); color: var(--text-dim); min-height: 1.8em"></div>
        <div class="panel-body">
          <div id="tables-wrap">
            <div style="color: var(--text-dim); font-size: var(--fs-sm)">Build a grammar to see tables.</div>
          </div>
        </div>
      </div>
      <div class="resize-handle" id="rh-3"></div>
      <!-- 4. Parse Tree -->
      <div class="panel" id="p-tree" data-priority="1">
        <div class="panel-header">
          <span class="panel-title">Parse Tree</span>
          <button
            class="collapse-btn"
            onclick="
              event.stopPropagation();
              toggleCollapse('p-tree');
            "
          >
            &#8250;
          </button>
        </div>
        <div class="panel-body tree-panel-body">
          <div class="tree-area">
            <svg id="tree-svg" width="100%" height="100%"><g id="tree-root"></g></svg>
            <div id="tree-empty">Run simulation to grow the parse tree.</div>
          </div>
          <div id="sim-panel">
            <div class="panel-header">
              <span class="panel-title">String Parsing Simulation</span>
              <button class="algo-btn" onclick="openAlgoModal('parsing')" title="LR parsing algorithm">Algorithm</button>
            </div>
            <div id="sim-header">
              <div id="sim-input-row">
                <div class="input-group">
                  <input id="sim-input" class="ui-input ui-input--lg" type="text" spellcheck="false" placeholder="e.g. id + id  (empty for ε)" />
                </div>
                <div class="step-group">
                  <button class="btn icon-restart" onclick="simReset()" title="Restart"></button>
                  <button class="btn" id="btn-back" onclick="simBack()" disabled>&#8249; Back</button>
                  <button class="btn primary" id="btn-step" onclick="simStep()" disabled>Step &#8250;</button>
                  <button class="btn icon-run-all" id="btn-run" onclick="simRunAll()" title="Run all" disabled></button>
                </div>
             <!-- --   <span id="trace-sep">|</span>
                <button class="btn" id="btn-open-trace" onclick="openTrace()" disabled title="Open trace in new tab">Parse Trace</button>-->
              </div>
            </div>
            <div id="sim-body">
              <div class="sim-row">
                <span class="sim-label">Input</span>
                <div id="sim-tokens"></div>
              </div>
              <div class="sim-row">
                <span class="sim-label">Stack</span>
                <div id="sim-stack"></div>
              </div>
              <div class="sim-row">
                <span class="sim-label">Action</span>
                <div id="sim-log"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Pseudocode modal -->
    <div class="algo-overlay hidden" id="algo-overlay" tabindex="-1" onclick="if (event.target === this) closeAlgoModal();">

        <div class="algo-modal-head">
          <h2 id="algo-title"></h2>
          <span class="algo-subtitle" id="algo-subtitle"></span>
          <button class="algo-close" onclick="closeAlgoModal()" title="Close (Esc)">&#x2715;</button>

        <div class="algo-modal-body" id="algo-body"></div>

    </div>

    <script>
      // Global error catcher — shows errors visibly on mobile
      window.onerror = function (msg, src, line, col, err) {
        // (0:0) with no src = cross-origin script error; crossorigin attr fixes detail suppression
        if (line === 0 && !src) return false; // suppress unhelpful cross-origin ghost errors
        var el = document.getElementById("error-msg");
        var detail = err ? err.message : msg;
        if (src) detail += " — " + src.split("/").pop() + ":" + line;
        if (el) el.textContent = detail;
        return false;
      };
      window.onunhandledrejection = function (e) {
        var el = document.getElementById("error-msg");
        if (el) el.textContent = "Promise error: " + ((e.reason && e.reason.message) || e.reason);
      };
      // ── Panel resize & collapse ───────────────────────────────────────────
      // rh-1: grammar LEFT of handle  — drag right widens grammar
      initResize("rh-1", "p-grammar", +1);
      // rh-2: tables RIGHT of handle  — drag left widens tables, narrows automaton
      initResize("rh-2", "p-tables", -1);
      // rh-3: tree RIGHT of handle    — drag left widens tree, narrows tables
      initResize("rh-3", "p-tree", -1);

      // ── Sample grammars ───────────────────────────────────────────────────
      const EXAMPLES = {};
      // loadExample — defined in shared.js

      // LR(0)/LR(1)/LALR(1) automata and ACTION/GOTO tables — see shared/algo/lr.js

      // ── Table render ──────────────────────────────────────────────────────
      function renderTables(g, auto, tables, mode, first, follow) {
        const { rules, nonterminals: nts, terminals: terms } = g,
          { action, goto: gt, conflicts } = tables,
          n = auto.states.length;
        const ts = [...terms].filter((t) => t !== "$").sort();
        ts.push("$");
        const ntt = [...nts].filter((nt) => !(g.augmented && nt === g.start)).sort();
        const wrap = document.getElementById("tables-wrap");
        wrap.innerHTML = "";
        // FIRST/FOLLOW
        const ffd = document.createElement("div");
        ffd.innerHTML = '<div class="tbl-section-label">First &amp; Follow</div>';
        const fft = document.createElement("table");
        fft.className = "parse-table";
        fft.innerHTML = '<thead><tr><th class="state-col">NT</th><th>FIRST</th><th>FOLLOW</th></tr></thead>';
        const ffb = document.createElement("tbody");
        [...nts]
          .filter((nt) => !(g.augmented && nt === g.start))
          .sort()
          .forEach((nt) => {
            const tr = document.createElement("tr");
            const fs = [...first[nt]].filter((s) => s !== EPSILON).sort(),
              ls = [...(follow[nt] || [])].sort();
            tr.innerHTML = '<td class="state-cell">' + esc(nt) + "</td>" + '<td class="goto-cell" style="text-align:left;padding-left:6px">{ ' + (esc(fs.join(", ")) || "&mdash;") + " }</td>" + '<td class="goto-cell" style="text-align:left;padding-left:6px;color:var(--green)">{ ' + (esc(ls.join(", ")) || "&mdash;") + " }</td>";
            ffb.appendChild(tr);
          });
        fft.appendChild(ffb);
        ffd.appendChild(fft);
        wrap.appendChild(ffd);
        // Productions
        const rd = document.createElement("div");
        rd.innerHTML = '<div class="tbl-section-label">Productions</div><div id="rules-list"></div>';
        wrap.appendChild(rd);
        const rl = rd.querySelector("#rules-list");
        rules.forEach((r, i) => {
          const l = document.createElement("div");
          l.innerHTML = '<span class="ri">' + i + ':</span><span class="rule">' + esc(r.lhs) + " \u2192 " + esc(r.rhs.join(" ") || EPSILON) + "</span>";
          rl.appendChild(l);
        });
        // Action
        const ad = document.createElement("div");
        ad.innerHTML = '<div class="tbl-section-label">ACTION</div>';
        wrap.appendChild(ad);
        const at = document.createElement("table");
        at.className = "parse-table";
        let hdr = '<thead><tr><th class="state-col">St</th>';
        for (const t of ts) hdr += "<th>" + esc(t) + "</th>";
        hdr += "</tr></thead>";
        at.innerHTML = hdr;
        const ab = document.createElement("tbody");
        for (let s = 0; s < n; s++) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td class="state-cell">' + s + "</td>";
          for (const t of ts) {
            const td = document.createElement("td");
            td.dataset.state = s;
            td.dataset.sym = t;
            const val = action[s][t];
            if (!val) {
            } else if (Array.isArray(val)) {
              td.textContent = val.join("/");
              td.className = "conflict";
              td.title = "Click to highlight conflicting items";
              td.onclick = function () {
                conflictHi(s, val, t, this);
              };
            } else if (val === "acc") {
              td.textContent = "acc";
              td.className = "accept";
            } else if (val.startsWith("s")) {
              td.textContent = val;
              td.className = "shift";
            } else {
              td.textContent = val;
              td.className = "reduce";
            }
            tr.appendChild(td);
          }
          ab.appendChild(tr);
        }
        at.appendChild(ab);
        ad.appendChild(at);
        // Goto
        const gd = document.createElement("div");
        gd.innerHTML = '<div class="tbl-section-label">GOTO</div>';
        wrap.appendChild(gd);
        const gtbl = document.createElement("table");
        gtbl.className = "parse-table";
        let ghdr = '<thead><tr><th class="state-col">St</th>';
        for (const nt of ntt) ghdr += "<th>" + esc(nt) + "</th>";
        ghdr += "</tr></thead>";
        gtbl.innerHTML = ghdr;
        const gb = document.createElement("tbody");
        for (let s = 0; s < n; s++) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td class="state-cell">' + s + "</td>";
          for (const nt of ntt) {
            const td = document.createElement("td");
            td.dataset.state = s;
            td.dataset.sym = nt;
            const val = gt[s][nt];
            if (val !== undefined) {
              td.textContent = val;
              td.className = "goto-cell";
            }
            tr.appendChild(td);
          }
          gb.appendChild(tr);
        }
        gtbl.appendChild(gb);
        gd.appendChild(gtbl);
        if (conflicts.length) {
          const cd = document.createElement("div");
          cd.innerHTML = '<div class="tbl-section-label" style="color:var(--red)">' + conflicts.length + " Conflict(s)</div>";
          const list = UI.conflictList(cd, conflicts.map((c) => ({
            title: 'State ' + c.state + ', "' + c.symbol + '": ' + c.entries.join(" / "),
            text: lrExplainConflict(g, mode, c).text,
          })));
          // How the four methods fare on this grammar, with a way to switch.
          const n = lrCompareMethods(g);
          const names = { LR0: "LR(0)", SLR1: "SLR(1)", LALR1: "LALR(1)", LR1: "LR(1)" };
          const row = document.createElement("div");
          row.className = "ui-conflicts__methods";
          row.innerHTML = "Conflicts by method: " + Object.keys(names).map((m) => {
            const label = names[m] + " " + n[m];
            return m === mode ? "<b>" + label + "</b>" : '<button type="button" onclick="setMode(\'' + m + '\')">' + label + "</button>";
          }).join(" · ") + (Object.values(n).every((v) => v > 0) ? ". None of the four methods handles this grammar; it is usually ambiguous." : "");
          list.appendChild(row);
          wrap.appendChild(cd);
        }
      }

      // ── Automaton render ──────────────────────────────────────────────────
      const PAD_X = 14,
        PAD_Y = 10,
        LINE_H = 18,
        HEADER_H = 22,
        SEP = 7,
        CH = 7.2;
      function ils(item, rules, mode) {
        const rule = rules[item.rule],
          parts = [...rule.rhs];
        parts.splice(item.dot, 0, "\u2022");
        const core = rule.lhs + " \u2192 " + parts.join(" ");
        if (mode === "LR1" || mode === "LALR1") {
          if (!item.lookahead) return core;
          return mergeLA ? core + "  {" + item.lookahead + "}" : core + "  [" + item.lookahead + "]";
        }
        return core;
      }
      function nodeSize(state, rules, mode) {
        const disp = getDisplayItems(state, mode);
        const lines = disp.map((i) => ils(i, rules, mode));
        const maxW = Math.max(...lines.map((l) => l.length * CH), ("State I" + state.id).length * CH);
        const kc = state.id === 0 ? 1 : disp.filter((i) => i.dot > 0).length;
        const hasSep = kc > 0 && kc < disp.length;
        return {
          w: Math.ceil(maxW + PAD_X * 2),
          h: Math.ceil(HEADER_H + disp.length * LINE_H + (hasSep ? SEP : 0) + PAD_Y * 2),
        };
      }
      function renderAutomaton(states, edges, rules, mode) {
        document.getElementById("empty-msg").style.display = "none";
        const dg = new dagre.graphlib.Graph({ multigraph: true });
        dg.setGraph({ rankdir: cLayoutDir, nodesep: 36, ranksep: 56, marginx: 40, marginy: 40 });
        dg.setDefaultEdgeLabel(() => ({}));
        states.forEach((s) => {
          const { w, h } = nodeSize(s, rules, mode);
          dg.setNode(s.id, { width: w, height: h });
        });
        edges.forEach((e, i) => dg.setEdge(e.s, e.t, { label: e.label }, "e" + i));
        dagre.layout(dg);
        const root = d3.select("#root");
        root.selectAll("*").remove();
        edges.forEach((e, i) => {
          const ed = dg.edge(e.s, e.t, "e" + i);
          if (!ed) return;
          const pts = ed.points;
          const line = d3
            .line()
            .x((p) => p.x)
            .y((p) => p.y)
            .curve(d3.curveCatmullRom);
          const mid = pts[Math.floor(pts.length / 2)];
          const eg = root.append("g").attr("class", "edge").attr("id", "edge-" + i);
          eg.append("path").attr("d", line(pts));
          // Arrowhead stub: invisible line along the final segment so orient="auto" reads its angle
          if (pts.length >= 2) {
            const p0 = pts[pts.length - 2],
              p1 = pts[pts.length - 1];
            eg.append("line").attr("x1", p0.x).attr("y1", p0.y).attr("x2", p1.x).attr("y2", p1.y).attr("stroke", "none").attr("marker-end", "url(#arrow)");
          } else {
            eg.append("path").attr("d", line(pts)).attr("marker-end", "url(#arrow)");
          }
          const tbLayout = cLayoutDir === "TB";
          eg.append("text")
            .attr("x", tbLayout ? mid.x + 8 : mid.x)
            .attr("y", tbLayout ? mid.y : mid.y - 5)
            .attr("text-anchor", tbLayout ? "start" : "middle")
            .text(e.label);
        });
        // Entry arrow into start state (State 0)
        const dn0 = dg.node(0);
        if (dn0) {
          const tx0 = dn0.x - nodeSize(states[0], rules, mode).w / 2;
          root
            .append("line")
            .attr("x1", tx0 - 18)
            .attr("y1", dn0.y)
            .attr("x2", tx0 - 1)
            .attr("y2", dn0.y)
            .attr("stroke", "var(--text-dim)")
            .attr("stroke-width", 1)
            .attr("marker-end", "url(#arrow)");
        }
        states.forEach((state) => {
          const dn = dg.node(state.id),
            { w, h } = nodeSize(state, rules, mode);
          const tx = dn.x - w / 2,
            ty = dn.y - h / 2;
          const disp = getDisplayItems(state, mode);
          const lines = disp.map((i) => ils(i, rules, mode));
          const ng = root
            .append("g")
            .attr("class", "node" + (state.kernel ? " kernel" : "") + (state.accepting ? " accepting" : ""))
            .attr("id", "state-" + state.id)
            .attr("transform", "translate(" + tx + "," + ty + ")");
          const kc = state.id === 0 ? 1 : disp.filter((i) => i.dot > 0).length;
          const hasSep = kc > 0 && kc < disp.length;
          ng.append("rect").attr("width", w).attr("height", h).attr("rx", 6);
          if (state.accepting) {
            const d = 3;
            ng.append("rect")
              .attr("class", "accept-border")
              .attr("x", d)
              .attr("y", d)
              .attr("width", w - d * 2)
              .attr("height", h - d * 2)
              .attr("rx", 4);
          }
          ng.append("line").attr("class", "header").attr("x1", 0).attr("y1", HEADER_H).attr("x2", w).attr("y2", HEADER_H);
          ng.append("text")
            .attr("class", "state-label")
            .attr("x", PAD_X)
            .attr("y", HEADER_H * 0.76)
            .text("State I" + state.id);
          if (hasSep)
            ng.append("line")
              .attr("class", "sep")
              .attr("x1", PAD_X * 0.5)
              .attr("y1", HEADER_H + PAD_Y + kc * LINE_H + SEP / 2)
              .attr("x2", w - PAD_X * 0.5)
              .attr("y2", HEADER_H + PAD_Y + kc * LINE_H + SEP / 2);
          lines.forEach((line, li) => {
            const by = HEADER_H + PAD_Y + li * LINE_H + (li >= kc ? SEP : 0) + LINE_H * 0.76,
              dot = line.indexOf("\u2022"),
              bi = line.search(/  [{[]/);
            const main = bi !== -1 ? line.slice(0, bi) : line,
              la = bi !== -1 ? line.slice(bi) : null;
            const it = disp[li];
            const ikey = mergeLA ? it.rule + ":" + it.dot : it.rule + ":" + it.dot + (it.lookahead != null ? ":" + it.lookahead : "");
            const t = ng.append("text").attr("x", PAD_X).attr("y", by).attr("data-item-key", ikey);
            if (dot === -1) {
              t.append("tspan").attr("class", "item-text").text(main);
            } else {
              t.append("tspan").attr("class", "item-text").text(main.slice(0, dot));
              t.append("tspan").attr("class", "item-dot").text("\u2022");
              t.append("tspan")
                .attr("class", "item-text")
                .text(main.slice(dot + 1));
            }
            if (la) t.append("tspan").attr("class", "lookahead").text(la);
          });
        });
        fitAutomaton();
      }
      // Track whether the user has manually panned/zoomed since last build
      let _userZoomed = false;
      let _lastFitTransform = null;

      const _zoomBehavior = d3
        .zoom()
        .scaleExtent([0.08, 8])
        .wheelDelta((e) => -e.deltaY * (e.deltaMode === 1 ? 0.05 : e.deltaMode ? 1 : 0.002))
        .on("zoom", (e) => {
          d3.select("#root").attr("transform", e.transform);
          _userZoomed = true;
        });
      d3.select("#cy").call(_zoomBehavior).on("dblclick.zoom", null); // disable double-click zoom (confusing in teaching context)

      // ── Tree zoom (pan + pinch, same feel as automaton) ──────────────────────
      _treeZoom = d3
        .zoom()
        .scaleExtent([0.1, 8])
        .wheelDelta((e) => -e.deltaY * (e.deltaMode === 1 ? 0.05 : e.deltaMode ? 1 : 0.002))
        .on("zoom", (e) => d3.select("#tree-root").attr("transform", e.transform));
      d3.select("#tree-svg").call(_treeZoom).on("dblclick.zoom", null);

      // Double-click on tree resets to fit
      document.getElementById("tree-svg").addEventListener("dblclick", () => fitTree());

      function fitTree() {
        try {
          const rootEl = document.getElementById("tree-root");
          if (!rootEl) return;
          const bb = rootEl.getBBox();
          const svgEl = document.getElementById("tree-svg");
          const vw = svgEl.clientWidth || 320;
          const vh = svgEl.clientHeight || 400;
          if (!bb || bb.width < 1 || bb.height < 1) return;
          const sc = Math.min(0.95, Math.min(vw / bb.width, vh / bb.height)) * 0.9;
          const tx = (vw - bb.width * sc) / 2 - bb.x * sc;
          const ty = (vh - bb.height * sc) / 2 - bb.y * sc;
          d3.select("#tree-svg").call(_treeZoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
        } catch (e) {}
      }

      function fitAutomaton() {
        try {
          const rootEl = document.getElementById("root");
          if (!rootEl) return;
          const bb = rootEl.getBBox();
          const svgEl = document.getElementById("cy");
          const vw = svgEl.clientWidth || svgEl.parentElement.clientWidth || 400;
          const vh = svgEl.clientHeight || svgEl.parentElement.clientHeight || 300;
          if (!bb || bb.width < 1 || bb.height < 1) return;
          const sc = Math.min(0.9, Math.min(vw / bb.width, vh / bb.height)) * 0.88;
          const tx = (vw - bb.width * sc) / 2 - bb.x * sc;
          const ty = (vh - bb.height * sc) / 2 - bb.y * sc;
          const t = d3.zoomIdentity.translate(tx, ty).scale(sc);
          _lastFitTransform = t;
          // Apply via zoom behavior so internal state stays consistent
          d3.select("#cy").call(_zoomBehavior.transform, t);
          _userZoomed = false;
        } catch (e) {
          console.warn("fitAutomaton:", e);
        }
      }

      // Refit whenever the SVG container is resized (panel drag, window resize)
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => {
          if (!_userZoomed && currentAuto) fitAutomaton();
          renderTree();
        }).observe(document.getElementById("cy").parentElement);
      }

      function tSnap() {
        function cl(n) {
          return { id: n.id, symbol: n.symbol, ruleIdx: n.ruleIdx, parent: n.parent, children: n.children.map(cl) };
        }
        return { nid: tNid, forest: tForest.map(cl), roots: tRoots.map(cl), last: [...tLast] };
      }
      function tRestore(s) {
        tNid = s.nid;
        tForest = s.forest;
        tRoots = s.roots;
        tLast = s.last;
      }

      // ── LR parse tree state ───────────────────────────────────────────────
      let tNid = 0,
        tForest = [],
        tRoots = [],
        tLast = [];
      function treeReset() {
        tNid = 0;
        tForest = [];
        tRoots = [];
        tLast = [];
        d3.select("#tree-root").selectAll("*").remove();
        document.getElementById("tree-empty").style.display = "";
      }
      function treeShift(tok) {
        const n = { id: tNid++, symbol: tok, ruleIdx: null, parent: null, children: [] };
        tForest.push(n);
        tLast = [n.id];
      }
      function treeReduce(lhs, pc, ri) {
        const ch = pc > 0 ? tForest.splice(tForest.length - pc, pc) : [];
        const n = { id: tNid++, symbol: lhs, ruleIdx: ri, parent: null, children: ch };
        ch.forEach((c) => {
          c.parent = n;
        });
        tForest.push(n);
        tLast = [n.id];
      }

      function renderTree() {
        const svgEl = document.getElementById("tree-svg");
        const root = d3.select("#tree-root");
        const dr = tForest.length ? tForest : tRoots;
        if (!dr.length) {
          document.getElementById("tree-empty").style.display = "";
          root.selectAll("*").remove();
          return;
        }
        document.getElementById("tree-empty").style.display = "none";

        // X layout — natural pixel coordinates, no internal scaling
        let lc = 0;
        function aX(n) {
          if (!n.children.length) {
            n._x = lc++ * TNW;
            return;
          }
          n.children.forEach((c) => aX(c));
          n._x = (n.children[0]._x + n.children[n.children.length - 1]._x) / 2;
        }
        const vr = dr.length === 1 ? dr[0] : { id: -1, symbol: "", children: dr };
        aX(vr);

        const nodes = [],
          edges2 = [];
        function col(n) {
          if (n.id !== -1) nodes.push(n);
          n.children.forEach((c) => {
            if (n.id !== -1) edges2.push({ p: n, c });
            col(c);
          });
        }
        col(vr);

        function aD(n, d) {
          n._depth = d;
          n.children.forEach((c) => aD(c, d + 1));
        }
        aD(vr, dr.length === 1 ? 0 : -1);

        const maxD = Math.max.apply(
          null,
          nodes.map((n) => n._depth),
        );
        const BL = maxD * TLH;
        nodes.forEach((n) => {
          n._y = n.children.length ? n._depth * TLH : BL;
        });

        const ns = new Set(tLast);
        if (!nodes.length) return;

        // Render at natural coords — zoom behavior handles pan/scale
        root.selectAll("*").remove();
        const g = root.append("g"); // no transform — _treeZoom owns the transform on #tree-root

        // Baseline rule under terminals
        const lvs = nodes.filter((n) => !n.children.length);
        if (lvs.length) {
          const lx1 =
            Math.min.apply(
              null,
              lvs.map((n) => n._x),
            ) -
            TR -
            4;
          const lx2 =
            Math.max.apply(
              null,
              lvs.map((n) => n._x),
            ) +
            TR +
            4;
          g.append("line")
            .attr("x1", lx1)
            .attr("y1", BL + TR + 6)
            .attr("x2", lx2)
            .attr("y2", BL + TR + 6)
            .attr("stroke", "var(--border)")
            .attr("stroke-width", 1)
            .attr("stroke-dasharray", "4,4");
        }

        edges2.forEach(({ p, c }) => {
          const ey = p._y + TLH / 2;
          g.append("path")
            .attr("class", "tree-edge" + (ns.has(p.id) ? " new-edge" : ""))
            .attr("d", `M ${c._x},${c._y - TR} L ${c._x},${ey} L ${p._x},${p._y + TR}`);
        });

        nodes.forEach((node) => {
          const isTerm = currentGrammar && !currentGrammar.nonterminals.has(node.symbol);
          const isNew = ns.has(node.id);
          const ng = g
            .append("g")
            .attr("class", "tree-node" + (isTerm ? " terminal" : "") + (isNew ? " new-node" : ""))
            .attr("transform", "translate(" + node._x + "," + node._y + ")");
          ng.append("circle").attr("r", TR);
          ng.append("text")
            .attr("dy", node.ruleIdx !== null ? "-3" : "0")
            .text(node.symbol);
          if (node.ruleIdx !== null)
            ng.append("text")
              .attr("class", "rule-label")
              .attr("dy", "9")
              .text("r" + node.ruleIdx);
        });

        // Fit to view on every render (preserves user zoom if they've panned manually)
        fitTree();
      }

      // ── Simulation engine ─────────────────────────────────────────────────
      let simTables = null,
        simHistory = [],
        simStack = [0],
        simSyms = [],
        simPos = 0,
        simTokens = [],
        simDone = false,
        simPendingGoto = null,
        simTrace = [];
      // tokenise — defined in shared.js
      function hiAuto(aid, sids, ef, es) {
        d3.selectAll(".node").classed("active on-stack c-pending c-active t-hi", false);
        d3.selectAll(".edge").classed("active c-pending c-active t-hi", false);
        sids.forEach((id) => d3.select("#state-" + id).classed("on-stack", true));
        if (aid !== null) d3.select("#state-" + aid).classed("active", true);
        if (ef !== null && es !== null && currentAuto) {
          const e = currentAuto.edges.find((e) => e.s === ef && e.label === es);
          if (e) d3.select("#edge-" + currentAuto.edges.indexOf(e)).classed("active", true);
        }
      }
      // renderSimTokens — defined in shared.js
      function renderSimStack() {
        const el = document.getElementById("sim-stack");
        el.innerHTML = "";
        simStack.forEach((sid, i) => {
          if (i > 0 && simSyms[i - 1] !== undefined) {
            const s = document.createElement("span");
            s.className = "stk-sym";
            s.textContent = simSyms[i - 1];
            el.appendChild(s);
            const a = document.createElement("span");
            a.className = "stk-arrow";
            a.textContent = "\u203a";
            el.appendChild(a);
          }
          const b = document.createElement("span");
          b.className = "stk-state" + (i === simStack.length - 1 ? " top" : "");
          b.textContent = sid;
          el.appendChild(b);
        });
        if (simPendingGoto) {
          const a = document.createElement("span");
          a.className = "stk-arrow";
          a.textContent = "\u203a";
          el.appendChild(a);
          const s = document.createElement("span");
          s.className = "stk-sym pending";
          s.textContent = simPendingGoto.rule.lhs;
          el.appendChild(s);
        }
      }
      // setSimLog — defined in shared.js
      function simSetBtns() {
        const notReady = simDone || !simTables;
        document.getElementById("btn-step").disabled = notReady;
        document.getElementById("btn-run").disabled  = notReady;
        document.getElementById("btn-back").disabled = simHistory.length === 0;
      }
      function simSnap() {
        simHistory.push({
          stack: [...simStack],
          syms: [...simSyms],
          pos: simPos,
          pendingGoto: simPendingGoto,
          traceLen: simTrace.length,
          log: document.getElementById("sim-log").textContent,
          logCls: document.getElementById("sim-log").className,
          tree: tSnap(),
        });
      }
      function simReset() {
        const raw = document.getElementById("sim-input").value;
        try {
          simTokens = tokenise(raw);
        } catch (e) {
          setSimLog(e.message, "error");
          return;
        }
        simStack = [0];
        simSyms = [];
        simPos = 0;
        simDone = false;
        simHistory = [];
        simPendingGoto = null;
        simTrace = [];
        d3.selectAll(".node").classed("active on-stack", false);
        d3.selectAll(".edge").classed("active", false);
        clearHi();
        treeReset();
        renderSimTokens();
        renderSimStack();
        setSimLog("Ready \u2014 press Step", "");
        simSetBtns();
        if (simTables) hiAuto(0, [], null, null);
      }
      function simClear() {
        simTokens = []; simStack = []; simSyms = []; simPos = 0;
        simDone = false; simHistory = []; simPendingGoto = null; simTrace = [];
        d3.selectAll(".node").classed("active on-stack", false);
        d3.selectAll(".edge").classed("active", false);
        clearHi(); treeReset();
        renderSimTokens(); renderSimStack();
        setSimLog("", "");
        simSetBtns();
      }
      function simBack() {
        if (!simHistory.length) return;
        const snap = simHistory.pop();
        simStack = snap.stack;
        simSyms = snap.syms;
        simPos = snap.pos;
        simDone = false;
        simPendingGoto = snap.pendingGoto;
        if (snap.traceLen !== undefined) simTrace.length = snap.traceLen;
        tRestore(snap.tree);
        renderSimTokens();
        renderSimStack();
        setSimLog(snap.log, snap.logCls);
        simSetBtns();
        clearHi();
        hiAuto(simStack[simStack.length - 1], simStack.slice(0, -1), null, null);
        renderTree();
      }
      function clearHi() {
        document.querySelectorAll(".parse-table td.highlighted,.parse-table td.highlighted-goto").forEach((td) => td.classList.remove("highlighted", "highlighted-goto"));
        document.querySelectorAll(".parse-table tr.highlighted-row").forEach((tr) => tr.classList.remove("highlighted-row"));
      }
      function hiTable(as, asym, gs, gsym) {
        clearHi();
        function hi(state, sym, cls) {
          if (state === null || sym === null) return;
          var esc = CSS.escape(sym);
          const td = document.querySelector('.parse-table td[data-state="' + state + '"][data-sym="' + esc + '"]');
          if (!td) return;
          td.classList.add(cls);
          if (td.closest) td.closest("tr")?.classList.add("highlighted-row");
          try {
            td.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
          } catch (e) {}
        }
        hi(as, asym, "highlighted");
        hi(gs, gsym, "highlighted-goto");
      }
      function simRunAll() {
        let guard = 10000;
        while (!simDone && simTables && --guard > 0) simStep();
      }

      function simStep() {
        if (simDone || !simTables) return;
        // \u2500\u2500 Step 2 of a reduce: complete the GOTO lookup \u2500\u2500
        if (simPendingGoto !== null) {
          const { action, goto: gt } = simTables;
          const { ri, rule, state, token, top } = simPendingGoto;
          simSnap();
          // Capture sentential form: stack after pop (step 1 already did it), same input position
          const tSyms = simSyms.join(" "),
            tInput = simTokens.slice(simPos).join(" ");
          simPendingGoto = null;
          const next = lrGoto(simTables, top, rule.lhs);
          if (next === undefined) {
            setSimLog("Error: no goto for " + rule.lhs + " from state " + top, "error");
            simDone = true;
            simSetBtns();
            return;
          }
          hiAuto(next, simStack, top, rule.lhs);
          hiTable(state, token, top, rule.lhs);
          simStack.push(next);
          simSyms.push(rule.lhs);
          renderSimStack();
          renderTree();
          const gotoMsg = "GOTO(" + top + ", " + rule.lhs + ")  =  state " + next;
          setSimLog(gotoMsg, "goto");
          simTrace.push({ syms: tSyms, input: tInput, action: gotoMsg });
          simSetBtns();
          return;
        }
        // \u2500\u2500 Normal action dispatch \u2500\u2500
        const { action, goto: gt } = simTables,
          state = simStack[simStack.length - 1],
          token = simTokens[simPos],
          act = action[state]?.[token];
        simSnap();
        if (!act) {
          setSimLog('Error: no action for "' + token + '" in state ' + state, "error");
          simDone = true;
          simSetBtns();
          return;
        }
        const entry = lrPickAction(act);
        const decoded = lrDecode(entry);
        if (decoded.type === "accept") {
          const tSyms = simSyms.join(" "),
            tInput = simTokens.slice(simPos).join(" ");
          hiAuto(state, simStack.slice(0, -1), null, null);
          hiTable(state, token, null, null);
          // In non-augmented mode the accept action implicitly subsumes the start production
          // reduce (no synthetic S'\u2192S rule exists), so we perform it here for tree building.
          if (currentGrammar && !currentGrammar.augmented && currentAuto) {
            const stObj = currentAuto.states[state];
            if (stObj) {
              const ci = stObj.items.find((i) => currentGrammar.rules[i.rule].lhs === currentGrammar.start && i.dot === currentGrammar.rules[i.rule].rhs.length);
              if (ci) {
                const r = currentGrammar.rules[ci.rule];
                treeReduce(r.lhs, r.rhs.length, ci.rule);
                renderTree();
              }
            }
          }
          const accMsg = "\u2713 Accepted!";
          setSimLog(accMsg, "accept");
          simTrace.push({ syms: tSyms, input: tInput, action: accMsg });
          simDone = true;
          simSetBtns();
          return;
        }
        if (decoded.type === "shift") {
          const tSyms = simSyms.join(" "),
            tInput = simTokens.slice(simPos).join(" ");
          const next = decoded.next;
          hiAuto(next, simStack, state, token);
          hiTable(state, token, null, null);
          treeShift(token);
          simStack.push(next);
          simSyms.push(token);
          simPos++;
          renderSimTokens();
          renderSimStack();
          renderTree();
          const shiftMsg = 'Shift  "' + token + '"  \u2192  state ' + next;
          setSimLog(shiftMsg, "shift");
          simTrace.push({ syms: tSyms, input: tInput, action: shiftMsg });
        } else {
          // \u2500\u2500 Step 1 of a reduce: pop stack, expose new top, defer GOTO \u2500\u2500
          const ri = decoded.ruleIdx,
            rule = currentGrammar.rules[ri],
            pc = rule.rhs.length;
          // Capture BEFORE pop so the trace shows the handle still on the stack
          const tSyms = simSyms.join(" "),
            tInput = simTokens.slice(simPos).join(" ");
          simStack.splice(simStack.length - pc, pc);
          simSyms.splice(simSyms.length - pc, pc);
          const top = simStack[simStack.length - 1];
          simPendingGoto = { ri, rule, state, token, top };
          hiAuto(top, simStack.slice(0, -1), null, null);
          hiTable(state, token, null, null);
          treeReduce(rule.lhs, pc, ri);
          renderSimStack();
          renderTree();
          const redMsg = "Reduce  " + rule.lhs + " \u2192 " + (rule.rhs.join(" ") || EPSILON) + "  (r" + ri + ")  \u2014  GOTO from state " + top;
          setSimLog(redMsg, "reduce");
          simTrace.push({ syms: tSyms, input: tInput, action: redMsg });
        }
        simSetBtns();
      }

      // ── Parse trace ──────────────────────────────────────────────────────
      function formatTrace(entries) {
        if (!entries.length) return "";
        const symW = Math.max(5, ...entries.map((e) => e.syms.length));
        const inW = Math.max(5, ...entries.map((e) => e.input.length));
        const col = (s, w) => (s || "").padEnd(w);
        const sep = "─".repeat(symW) + "───·───" + "─".repeat(inW) + "─────";
        const hdr = col("Stack", symW) + "   ·   " + col("Input", inW) + "   Action";
        return [hdr, sep, ...entries.map((e) => col(e.syms, symW) + "   ·   " + col(e.input, inW) + "   " + e.action)].join("\n");
      }
      function traceInfo() {
        const g = currentGrammar
          ? (currentGrammar.augmented ? currentGrammar.rules.slice(1) : currentGrammar.rules)
              .map((r) => r.lhs + " → " + (r.rhs.join(" ") || EPSILON))
              .join("\n")
          : "";
        return "Grammar:\n" + g + "\n\nInput: " + document.getElementById("sim-input").value + "\n\n";
      }
      function copyTrace() {
        navigator.clipboard
          .writeText(traceInfo() + formatTrace(simTrace))
          .then(() => {
            const b = document.getElementById("btn-copy-trace"),
              o = b.textContent;
            b.textContent = "✓";
            setTimeout(() => (b.textContent = o), 1500);
          })
          .catch(() => {});
      }
      function openTrace() {
        const w = window.open("", "_blank");
        if (!w) return;
        const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        w.document.write('<html><head><title>Parse Trace</title><meta charset="UTF-8">' + "<style>body{font-family:monospace;font-size:13px;padding:2em;white-space:pre;line-height:1.8;color:#1a2030;background:#f8f9fb}</style></head>" + "<body>" + esc(traceInfo() + formatTrace(simTrace)) + "</body></html>");
        w.document.close();
      }

      // ── Conflict item highlighting ────────────────────────────────────────
      function clearConflictHi() {
        d3.selectAll("text.item-hi-a,text.item-hi-b").classed("item-hi-a item-hi-b", false);
        d3.selectAll(".node.conflict-hi").classed("conflict-hi", false);
        document.querySelectorAll(".parse-table td.conflict.conflict-active").forEach((td) => td.classList.remove("conflict-active"));
      }
      function conflictHi(stateId, entries, symbol, tdEl) {
        clearConflictHi();
        if (!currentAuto || !currentGrammar) return;
        const state = currentAuto.states[stateId];
        if (!state) return;
        const rules = currentGrammar.rules,
          sel = d3.select("#state-" + stateId);
        entries.forEach((entry, idx) => {
          const cls = idx === 0 ? "item-hi-a" : "item-hi-b";
          if (entry === "acc") return;
          const isShift = entry.startsWith("s");
          const ri = isShift ? null : parseInt(entry.slice(1));
          for (const item of state.items) {
            const matchesReduce = item.rule === ri && item.dot === rules[ri].rhs.length
              && (item.lookahead == null || item.lookahead.split(",").map((s) => s.trim()).includes(symbol));
            const matches = isShift ? rules[item.rule].rhs[item.dot] === symbol : matchesReduce;
            if (!matches) continue;
            const ik = mergeLA ? item.rule + ":" + item.dot : item.rule + ":" + item.dot + (item.lookahead != null ? ":" + item.lookahead : "");
            sel.selectAll('text[data-item-key="' + ik + '"]').classed(cls, true);
          }
        });
        sel.classed("conflict-hi", true);
        if (tdEl) tdEl.classList.add("conflict-active");
        panToState(stateId);
      }
      function panToState(stateId) {
        const el = document.getElementById("state-" + stateId);
        if (!el) return;
        try {
          const svgEl = document.getElementById("cy");
          const vw = svgEl.clientWidth || 400,
            vh = svgEl.clientHeight || 300;
          const curT = d3.zoomTransform(svgEl);
          // getBoundingClientRect gives screen positions — compute delta to center
          const er = el.getBoundingClientRect(),
            sr = svgEl.getBoundingClientRect();
          const screenCx = (er.left + er.right) / 2 - sr.left;
          const screenCy = (er.top + er.bottom) / 2 - sr.top;
          const tx = curT.x + (vw / 2 - screenCx);
          const ty = curT.y + (vh / 2 - screenCy);
          d3.select("#cy").transition().duration(250).call(_zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(curT.k));
          _userZoomed = true;
        } catch (e) {}
      }

      // ── Shareable link ────────────────────────────────────────────────────
      const saveShare = createShareSaver(() => ({
        g: document.getElementById("grammar-input").value,
        m: currentMode,
        s: document.getElementById("sim-input").value,
      }));
      // Restore grammar, mode and simulation input from the link (also reads old ?g= links).
      function applyShareState() {
        const st = shareValidateTextState(readShareState(), "g", ["LR0", "SLR1", "LALR1", "LR1"]);
        if (!st) return;
        document.getElementById("grammar-input").value = st.g;
        document.getElementById("sim-input").value = st.s;
        if (st.m) setMode(st.m);
      }

      // ═══════════════════════════════════════════════════════════════
      // CONSTRUCTION SIMULATION ENGINE
      // ═══════════════════════════════════════════════════════════════

      // Each step is { type, ...payload, label: string (HTML) }
      // Coarse step types:
      //   state-appear  — a new state node appears (initially empty)
      //   closure-done  — closure is complete; node now shows all items
      //   goto-edge     — a goto transition fires; edge appears
      //   state-done    — state fully processed (all gotos computed)
      //   build-done    — entire construction complete
      // Fine step types (superset):
      //   closure-init  — kernel items placed into new state
      //   closure-item  — one non-kernel item added to closure
      //   (then goto-edge and state-done as above)

      let cSteps = []; // all recorded steps
      let cStepIdx = -1; // current position (-1 = before start)
      let cGranularity = "coarse";
      let cPrepared = false; // true once steps are recorded and automaton is dimmed
      let cLayoutDir = "LR"; // "LR" = horizontal, "TB" = vertical

      function toggleLayout() {
        cLayoutDir = cLayoutDir === "LR" ? "TB" : "LR";
        applyLayoutBtn();
        try { localStorage.setItem("lr-tool-layout", cLayoutDir); } catch (e) {}
        if (currentGrammar) { cPrepared = false; build(); }
      }
      function applyLayoutBtn() {
        document.getElementById("btn-layout").textContent =
          cLayoutDir === "LR" ? "⇄ Horizontal" : "⇅ Vertical";
      }
      let cVisibleStates = new Set(); // state ids rendered so far
      let cVisibleEdges = new Set(); // edge indices rendered so far
      let cVisibleItems = new Map(); // stateId → Set of item keys formally added
      let cActiveState = null;
      let cActiveEdgeIdx = null;
      const cIK = (i) => i.rule + ":" + i.dot + (i.lookahead != null ? ":" + i.lookahead : "");

      // ── Step recorder ────────────────────────────────────────────────────────────
      function recordConstructionSteps(grammar, mode) {
        const steps = [];
        const { rules, nonterminals: nts } = grammar;
        const first = mode !== "LR0" ? computeFirst(grammar) : null;

        function ik(i) {
          return mode === "LR0" ? ik0(i) : ik1(i);
        }

        function closureWithSteps(kernelItems) {
          // Returns { items, fineSteps }
          const fineSteps = [];
          const set = new Map(kernelItems.map((i) => [ik(i), i]));
          const q = [...kernelItems];
          fineSteps.push({ subtype: "closure-init", items: [...kernelItems] });

          while (q.length) {
            const it = q.shift();
            const rule = rules[it.rule];
            const sym = rule.rhs[it.dot];
            if (!sym || !nts.has(sym)) continue;

            let las = [null];
            if (mode !== "LR0") {
              const beta = rule.rhs.slice(it.dot + 1).concat([it.lookahead]);
              las = [...firstOfSeq(beta, first)].filter((a) => a !== EPSILON);
            }

            for (let ri = 0; ri < rules.length; ri++) {
              if (rules[ri].lhs !== sym) continue;
              for (const la of las) {
                const ni = mode === "LR0" ? { rule: ri, dot: 0 } : { rule: ri, dot: 0, lookahead: la };
                const k = ik(ni);
                if (!set.has(k)) {
                  set.set(k, ni);
                  q.push(ni);
                  fineSteps.push({ subtype: "closure-item", item: ni, trigger: it });
                }
              }
            }
          }
          return { items: [...set.values()], fineSteps };
        }

        // Replay the full construction, recording steps
        const stateMap = new Map();
        const allStates = [];
        const allEdges = [];

        function ils_(item) {
          const rule = rules[item.rule];
          const parts = [...rule.rhs];
          parts.splice(item.dot, 0, "\u2022");
          const core = esc(rule.lhs) + " \u2192 " + esc(parts.join(" "));
          return mode !== "LR0" && item.lookahead ? core + "  [" + esc(item.lookahead) + "]" : core;
        }

        function initKernel(idx) {
          if (idx === 0) {
            return mode === "LR0" ? [{ rule: 0, dot: 0 }] : [{ rule: 0, dot: 0, lookahead: "$" }];
          }
          // For subsequent states this is called with the moved items from goto
          return null; // handled inline below
        }

        function getOrCreate(items) {
          const key = items.map(ik).sort().join("|");
          if (stateMap.has(key)) return { id: stateMap.get(key), isNew: false };
          const id = allStates.length;
          const acc = items.some((i) => rules[i.rule].lhs === grammar.start && i.dot === rules[i.rule].rhs.length);
          allStates.push({ id, items, accepting: acc, kernel: id !== 0 });
          stateMap.set(key, id);
          return { id, isNew: true };
        }

        // I0: record initial state
        const kernel0 = initKernel(0);
        const { items: items0, fineSteps: fine0 } = closureWithSteps(kernel0);
        const { id: id0 } = getOrCreate(items0);

        steps.push({
          type: "state-appear",
          stateId: id0,
          items: kernel0,
          label: '<span class="lg-op">new state</span> <b>I0</b> — initial kernel',
        });
        // Fine: kernel item
        for (const fs of fine0) {
          if (fs.subtype === "closure-init") {
            steps.push({
              type: "closure-item",
              stateId: id0,
              items: fs.items,
              isKernel: true,
              label: '<span class="lg-op">kernel</span> ' + fs.items.map((i) => '<span class="lg-item">' + ils_(i) + "</span>").join(", "),
            });
          } else {
            steps.push({
              type: "closure-item",
              stateId: id0,
              items: allStates[id0].items.slice(0, allStates[id0].items.indexOf(fs.item) + 1),
              label: '<span class="lg-op">closure</span> added <span class="lg-item">' + ils_(fs.item) + "</span>" + (fs.trigger ? ' <span class="lg-seen">via ' + ils_(fs.trigger) + "</span>" : ""),
            });
          }
        }
        steps.push({
          type: "closure-done",
          stateId: id0,
          items: items0,
          label: '<span class="lg-op">closure(I0)</span> complete — ' + items0.length + " item" + (items0.length !== 1 ? "s" : ""),
        });

        // Process queue
        for (let qi = 0; qi < allStates.length; qi++) {
          const state = allStates[qi];
          if (qi > 0) {
            // State was already created by a goto; announce it
            // Run closure with fine steps
            const kernel = state.items; // at this point items are the kernel (moved) items
            steps.push({
              type: "state-appear",
              stateId: state.id,
              items: kernel,
              label: '<span class="lg-op">new state</span> <b>I' + state.id + "</b>",
            });
            const { items: fullItems, fineSteps: fineI } = closureWithSteps(kernel);
            // Update state items
            allStates[state.id].items = fullItems;

            for (const fs of fineI) {
              if (fs.subtype === "closure-init") {
                steps.push({
                  type: "closure-item",
                  stateId: state.id,
                  items: fs.items,
                  isKernel: true,
                  label: '<span class="lg-op">kernel</span> ' + fs.items.map((i) => '<span class="lg-item">' + ils_(i) + "</span>").join(", "),
                });
              } else {
                steps.push({
                  type: "closure-item",
                  stateId: state.id,
                  items: fullItems.slice(0, fullItems.indexOf(fs.item) + 1),
                  label: '<span class="lg-op">closure</span> added <span class="lg-item">' + ils_(fs.item) + "</span>" + (fs.trigger ? ' <span class="lg-seen">via ' + ils_(fs.trigger) + "</span>" : ""),
                });
              }
            }
            steps.push({
              type: "closure-done",
              stateId: state.id,
              items: fullItems,
              label: '<span class="lg-op">closure(I' + state.id + ")</span> complete — " + fullItems.length + " item" + (fullItems.length !== 1 ? "s" : ""),
            });
          }

          // Compute all gotos from this state
          const currentItems = allStates[state.id].items;
          const syms = new Set(currentItems.map((it) => rules[it.rule].rhs[it.dot]).filter(Boolean));

          let lastGotoStep = null;
          for (const sym of syms) {
            const moved = currentItems.filter((it) => rules[it.rule].rhs[it.dot] === sym).map((it) => (mode === "LR0" ? { rule: it.rule, dot: it.dot + 1 } : { rule: it.rule, dot: it.dot + 1, lookahead: it.lookahead }));
            if (!moved.length) continue;

            const { id: tid, isNew } = getOrCreate(moved);
            const edgeIdx = allEdges.length;
            allEdges.push({ s: state.id, t: tid, label: sym });

            lastGotoStep = {
              type: "goto-edge",
              stateId: state.id,
              from: state.id,
              to: tid,
              label: sym,
              edgeIdx,
              isNew,
              label2: '<span class="lg-goto">goto</span>(I' + state.id + ", <b>" + esc(sym) + "</b>) = I" + tid + (isNew ? ' <span class="lg-new">[new]</span>' : ' <span class="lg-done">[existing]</span>'),
            };
            steps.push(lastGotoStep);
          }

          // Mark the last goto step for this state as complete (only if there were any gotos)
          if (lastGotoStep) lastGotoStep.label3 = ' — <span class="lg-done">I' + state.id + " complete!</span>";
        }

        steps.push({
          type: "build-done",
          label: '<span class="lg-new">\u2713 Construction complete</span> — ' + allStates.length + " states, " + allEdges.length + " transitions",
        });

        return { steps, states: allStates, edges: allEdges };
      }

      // ── Construction visual state ────────────────────────────────────────────────
      function cApplyStep(stepIdx) {
        // Apply all steps up to and including stepIdx, then update highlights
        cVisibleStates = new Set();
        cVisibleEdges = new Set();
        cVisibleItems = new Map();
        cActiveState = null;
        cActiveEdgeIdx = null;

        for (let i = 0; i <= stepIdx && i < cSteps.length; i++) {
          const s = cSteps[i];
          if (s.type === "state-appear") {
            cVisibleStates.add(s.stateId);
            if (s.items && s.items.length) {
              if (!cVisibleItems.has(s.stateId)) cVisibleItems.set(s.stateId, new Set());
              for (const it of s.items) cVisibleItems.get(s.stateId).add(cIK(it));
            }
          }
          if (s.type === "closure-item" || s.type === "closure-done") {
            cVisibleStates.add(s.stateId);
            if (!cVisibleItems.has(s.stateId)) cVisibleItems.set(s.stateId, new Set());
            for (const it of s.items) cVisibleItems.get(s.stateId).add(cIK(it));
          }
          if (s.type === "goto-edge") {
            cVisibleEdges.add(s.edgeIdx);
            cVisibleStates.add(s.to);
          }
        }

        // Determine active element from current step
        const cur = cSteps[stepIdx];
        if (cur) {
          if ("stateId" in cur) cActiveState = cur.stateId;
          if ("edgeIdx" in cur) cActiveEdgeIdx = cur.edgeIdx;
          if (cur.type === "build-done") {
            cActiveState = null;
            cActiveEdgeIdx = null;
          }
        }

        cUpdateAutomaton();
      }

      function cUpdateAutomaton() {
        // Apply c-pending / c-active classes to existing DOM nodes
        // Nodes not yet visible get c-pending; active gets c-active
        const { states, edges } = currentAuto;

        tClearAutoHi();
        const trackItems = currentMode !== "LALR1" && !mergeLA;
        states.forEach((s) => {
          const el = document.getElementById("state-" + s.id);
          if (!el) return;
          el.classList.remove("c-pending", "c-active");
          if (!cVisibleStates.has(s.id)) {
            el.classList.add("c-pending");
          } else if (s.id === cActiveState) {
            el.classList.add("c-active");
          }

          if (trackItems) {
            const visKeys = cVisibleItems.get(s.id);
            el.querySelectorAll("text[data-item-key]").forEach((t) => {
              t.classList.toggle("item-pending", !visKeys || !visKeys.has(t.getAttribute("data-item-key")));
            });
          }
        });

        // Edge elements — nth-child matches edge order in SVG
        d3.selectAll("#root g.edge").each(function (_, i) {
          d3.select(this).classed("c-pending", false).classed("c-active", false);
          if (!cVisibleEdges.has(i)) d3.select(this).classed("c-pending", true);
          else if (i === cActiveEdgeIdx) d3.select(this).classed("c-active", true);
        });
      }

      function cSetLog(html) {
        document.getElementById("cstep-log").innerHTML = html || "";
      }

      function cSetBtns() {
        const hasGrammar = !!currentGrammar;
        const done = cPrepared && cStepIdx >= cSteps.length - 1;
        document.getElementById("btn-cstart").disabled = !cPrepared || cStepIdx < 0;
        document.getElementById("btn-cback").disabled  = !cPrepared || cStepIdx < 0;
        document.getElementById("btn-cstep").disabled  = !hasGrammar || done;
        document.getElementById("btn-crun").disabled   = !hasGrammar || done;
      }

      function cFilteredStep() {
        // In coarse mode, skip fine-only steps (closure-item)
        // Returns the next valid step index, or -1 if none
        let idx = cStepIdx + 1;
        while (idx < cSteps.length) {
          const s = cSteps[idx];
          if (cGranularity === "coarse" && s.type === "closure-item") {
            idx++;
            continue;
          }
          return idx;
        }
        return -1;
      }

      function cPrevFilteredStep() {
        let idx = cStepIdx - 1;
        while (idx >= 0) {
          const s = cSteps[idx];
          if (cGranularity === "coarse" && s.type === "closure-item") {
            idx--;
            continue;
          }
          return idx;
        }
        return -1;
      }

      // Record steps and dim automaton on first use (lazy init).
      function cPrepare() {
        if (!currentGrammar) return;
        const recMode = currentMode === "LALR1" ? "LR1" : currentMode === "SLR1" ? "LR0" : currentMode;
        try {
          const rec = recordConstructionSteps(currentGrammar, recMode);
          cSteps = rec.steps;
        } catch (e) {
          console.warn("construction steps:", e);
          cSteps = [];
        }
        cStepIdx = -1;
        cVisibleStates = new Set();
        cVisibleEdges = new Set();
        cVisibleItems = new Map();
        cActiveState = null;
        cActiveEdgeIdx = null;
        cUpdateAutomaton(); // dims all nodes/edges
        cPrepared = true;
      }

      function cStep() {
        if (!cPrepared) cPrepare();
        const next = cFilteredStep();
        if (next === -1) return;
        cStepIdx = next;
        cApplyStep(cStepIdx);
        const cur = cSteps[cStepIdx];
        var finalLabel = cur.label2 || cur.label;
        if (cur.label3) finalLabel += cur.label3;
        cSetLog(finalLabel);
        cSetBtns();
      }

      function cBack() {
        const prev = cPrevFilteredStep();
        if (prev === -1) {
          // Before first step — reset to initial state
          cStepIdx = -1;
          cVisibleStates = new Set();
          cVisibleEdges = new Set();
          cActiveState = null;
          cActiveEdgeIdx = null;
          cUpdateAutomaton();
          cSetLog("Press Step &#8250; to begin construction of I0.");
          cSetBtns();
          return;
        }
        cStepIdx = prev;
        cApplyStep(cStepIdx);
        const cur = cSteps[cStepIdx];
        cSetLog(cur.label2 || cur.label);
        cSetBtns();
      }

      function cRunAll() {
        if (!cPrepared) cPrepare();
        cStepIdx = cSteps.length - 1;
        cApplyStep(cStepIdx);
        // Remove all c-pending / c-active (construction done)
        d3.selectAll(".node").classed("c-pending c-active", false);
        d3.selectAll("#root g.edge").classed("c-pending c-active", false);
        d3.selectAll("text.item-pending").classed("item-pending", false);
        cSetLog(cSteps[cStepIdx].label);
        cSetBtns();
      }

      function cReset() {
        cStepIdx = -1;
        cVisibleStates = new Set();
        cVisibleEdges = new Set();
        cVisibleItems = new Map();
        cActiveState = null;
        cActiveEdgeIdx = null;
        cUpdateAutomaton();
        cSetLog("Press Construction Step &#8250; to begin.");
        cSetBtns();
      }

      // ── Mode toggles ─────────────────────────────────────────────────────────────
      function setBuildMode(m) {
        cGranularity = m === "fine" ? "fine" : "coarse";
      }

      // ═══════════════════════════════════════════════════════════════
      // TABLE CONSTRUCTION SIMULATION ENGINE
      // ═══════════════════════════════════════════════════════════════
      //
      // Step types:
      //   shift-entry   — action[s][term] = sN  (from goto edge on terminal)
      //   goto-entry    — goto[s][nt] = N       (from goto edge on nonterminal)
      //   reduce-entry  — action[s][la] = rN    (from complete item + lookahead)
      //   accept-entry  — action[s][$] = acc    (from S' → S •)
      //   conflict      — cell already filled; conflict recorded
      //   table-done    — all entries written

      let tSteps = [];
      let tStepIdx = -1;
      let tFilled = new Set(); // "state:sym" keys of cells written so far

      function recordTableSteps(grammar, auto, mode, follow) {
        const { rules, nonterminals: nts, terminals: terms, start } = grammar;
        const { states, edges } = auto;
        const steps = [];
        const filled = {}; // tracks what's in each cell for conflict detection

        function ils_(item) {
          const rule = rules[item.rule];
          const parts = [...rule.rhs];
          parts.splice(item.dot, 0, "\u2022");
          const core = esc(rule.lhs) + " \u2192 " + esc(parts.join(" "));
          return item.lookahead != null ? core + "  [" + esc(item.lookahead) + "]" : core;
        }

        function addStep(state, sym, entry, html, isGoto) {
          const key = state + ":" + sym;
          const cur = filled[key];
          if (cur === undefined) {
            filled[key] = entry;
            steps.push({
              type: isGoto ? "goto-entry" : entry === "acc" ? "accept-entry" : entry.startsWith("s") ? "shift-entry" : "reduce-entry",
              state,
              sym,
              entry,
              html,
              key,
              isGoto: !!isGoto,
            });
          } else if (cur !== entry) {
            // Conflict
            steps.push({
              type: "conflict",
              state,
              sym,
              entry,
              existing: cur,
              key,
              html: '<span class="lg-conf">conflict</span> ' + (isGoto ? "goto" : "action") + "[" + state + ", <b>" + sym + "</b>]: " + cur + " vs " + entry + ' <span class="lg-seen">— grammar is not ' + (mode === "LR0" ? "LR(0)" : mode === "SLR1" ? "SLR(1)" : "LR(1)") + "</span>",
              isGoto: !!isGoto,
            });
          }
        }

        // Phase 1: shift and goto entries from edges
        for (const { s, t, label } of edges) {
          if (nts.has(label)) {
            // Goto entry
            addStep(s, label, t, '<span class="lg-op">goto</span>[I' + s + ", <b>" + esc(label) + "</b>] = I" + t + ' <span class="lg-seen">edge I' + s + " \u2192 I" + t + " on " + esc(label) + "</span>", true);
          } else {
            // Shift entry
            addStep(s, label, "s" + t, '<span class="lg-op">shift</span> action[I' + s + ", <b>" + esc(label) + "</b>] = s" + t + ' <span class="lg-seen">edge I' + s + " \u2192 I" + t + " on \u201c" + esc(label) + "\u201d</span>", false);
          }
        }

        // Phase 2: reduce and accept entries from complete items
        for (const state of states) {
          for (const item of state.items) {
            const rule = rules[item.rule];
            if (item.dot < rule.rhs.length) continue; // dot not at end

            if (rule.lhs === start) {
              // Accept
              addStep(state.id, "$", "acc", '<span class="lg-op">accept</span> action[I' + state.id + ", $] = acc" + ' <span class="lg-seen">' + ils_(item) + " — start production complete</span>", false);
            } else {
              const ri = item.rule;
              if (mode === "LR1") {
                // Reduce on each lookahead
                for (const la of item.lookahead.split(",").map((s) => s.trim())) {
                  addStep(state.id, la, "r" + ri, '<span class="lg-op">reduce</span> action[I' + state.id + ", <b>" + esc(la) + "</b>] = r" + ri + ' <span class="lg-seen">' + ils_(item) + "</span>", false);
                }
              } else if (mode === "SLR1") {
                // Reduce on FOLLOW(lhs)
                for (const t of follow[rule.lhs] || new Set()) {
                  addStep(state.id, t, "r" + ri, '<span class="lg-op">reduce</span> action[I' + state.id + ", <b>" + esc(t) + "</b>] = r" + ri + ' <span class="lg-seen">' + ils_(item) + " — " + esc(t) + " ∈ FOLLOW(" + esc(rule.lhs) + ")</span>", false);
                }
              } else {
                // LR(0): reduce on all terminals
                for (const t of terms) {
                  addStep(state.id, t, "r" + ri, '<span class="lg-op">reduce</span> action[I' + state.id + ", <b>" + esc(t) + "</b>] = r" + ri + ' <span class="lg-seen">' + ils_(item) + "</span>", false);
                }
              }
            }
          }
        }

        steps.push({
          type: "table-done",
          html: '<span class="lg-op">\u2713 Tables complete</span> — ' + steps.filter((s) => !s.type.startsWith("conflict")).length + " entries" + (steps.filter((s) => s.type === "conflict").length ? ", " + steps.filter((s) => s.type === "conflict").length + " conflict(s)" : ""),
        });
        return steps;
      }

      // ── Apply / render ────────────────────────────────────────────────────────────
      function tClearAutoHi() {
        d3.selectAll(".node.t-hi").classed("t-hi", false);
        d3.selectAll(".edge.t-hi").classed("t-hi", false);
      }

      function tHighlightAuto(step) {
        tClearAutoHi();
