        if (!step || !currentAuto || step.type === "table-done") return;
        if (step.state !== undefined) d3.select("#state-" + step.state).classed("t-hi", true);
        if (step.type === "shift-entry" || step.type === "goto-entry") {
          const ei = currentAuto.edges.findIndex((e) => e.s === step.state && e.label === step.sym);
          if (ei >= 0) {
            d3.select("#edge-" + ei).classed("t-hi", true);
            d3.select("#state-" + currentAuto.edges[ei].t).classed("t-hi", true);
          }
        }
      }

      function tApplySteps(upToIdx) {
        // Collect which keys are filled up to this step
        tFilled = new Set();
        const activeKey = upToIdx >= 0 && upToIdx < tSteps.length ? tSteps[upToIdx].key : null;
        for (let i = 0; i <= upToIdx && i < tSteps.length; i++) {
          const s = tSteps[i];
          if (s.key) tFilled.add(s.key);
        }

        // Apply classes to all parse tables
        document.querySelectorAll(".parse-table").forEach((tbl) => {
          tbl.classList.add("is-stepping");
          tbl.querySelectorAll("td[data-state]").forEach((td) => {
            const key = td.dataset.state + ":" + td.dataset.sym;
            td.classList.remove("is-filled", "is-active", "is-active-goto");
            if (key === activeKey) {
              const cur = tSteps[upToIdx];
              td.classList.add(cur && cur.isGoto ? "is-active-goto" : "is-active");
              td.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
            } else if (tFilled.has(key)) {
              td.classList.add("is-filled");
            }
          });
        });
        tHighlightAuto(upToIdx >= 0 && upToIdx < tSteps.length ? tSteps[upToIdx] : null);
      }

      function tClearStepping() {
        tFilled = new Set();
        document.querySelectorAll(".parse-table").forEach((tbl) => {
          tbl.classList.remove("is-stepping");
          tbl.querySelectorAll("td").forEach((td) => td.classList.remove("is-filled", "is-active", "is-active-goto"));
        });
        tClearAutoHi();
      }

      // tSetLog, tSetBtns, tStep, tBack, tRunAll, tReset — defined in shared.js

      // ── Controller ────────────────────────────────────────────────────────
      let currentMode = "LR0",
        currentGrammar = null,
        currentAuto = null;
      let mergeLA = false;

      // Return items for display: in LR(1)/LALR(1) with mergeLA on, collapse items
      // sharing the same (rule, dot) into one item whose lookahead is a sorted set.
      function getDisplayItems(state, mode) {
        const items = state.items;
        if (!mergeLA || (mode !== "LR1" && mode !== "LALR1")) return items;
        const seen = new Map(),
          order = [];
        for (const it of items) {
          const k = it.rule + ":" + it.dot;
          if (!seen.has(k)) {
            seen.set(k, new Set());
            order.push({ rule: it.rule, dot: it.dot });
          }
          if (it.lookahead != null) for (const la of it.lookahead.split(",").map((s) => s.trim())) seen.get(k).add(la);
        }
        return order.map(({ rule, dot }) => {
          const las = seen.get(rule + ":" + dot);
          return { rule, dot, lookahead: las.size ? [...las].sort().join(", ") : null };
        });
      }

      function setMode(m) {
        currentMode = m;
        ["LR0", "SLR1", "LALR1", "LR1"].forEach((id) => {
          const el = document.getElementById("btn-" + id.toLowerCase());
          if (el) el.classList.toggle("active", id === m);
        });
        const showMerge = m === "LR1" || m === "LALR1";
        document.getElementById("merge-la-label").style.display = showMerge ? "flex" : "none";
        try { localStorage.setItem("lr-tool-mode", m); } catch (e) {}
        if (currentGrammar) build();
      }

      function setMergeLA(val) {
        mergeLA = val;
        const fineRad = document.querySelector('input[name="build-mode"][value="fine"]');
        if (fineRad) fineRad.disabled = mergeLA;
        if (mergeLA && fineRad && fineRad.checked) {
          const cr = document.querySelector('input[name="build-mode"][value="coarse"]');
          if (cr) {
            cr.checked = true;
            setBuildMode("coarse");
          }
        }
        if (currentAuto && currentGrammar) renderAutomaton(currentAuto.states, currentAuto.edges, currentGrammar.rules, currentMode);
      }
      function setError(msg) {
        document.getElementById("error-msg").textContent = msg || "";
      }
      function build() {
        setError("");
        const text = document.getElementById("grammar-input").value.trim();
        const augment = document.getElementById("augment-cb").checked;
        try {
          currentGrammar = parseBNF(text, augment);
        } catch (e) {
          setError(e.message);
          return;
        }
        saveShare();
        clearConflictHi();

        // Compute FIRST/FOLLOW once and pass to all consumers — avoids recomputing 2-3× per build
        const first  = computeFirst(currentGrammar);
        const follow = computeFollow(currentGrammar, first);

        // Always build the full automaton for tables/simulation
        currentAuto = currentMode === "LR1" ? buildLR1(currentGrammar) : currentMode === "LALR1" ? mergeLR1toLALR(buildLR1(currentGrammar)) : buildLR0(currentGrammar);
        const tm = currentMode === "LR1" || currentMode === "LALR1" ? "LR1" : currentMode;
        const tables = buildTables(currentGrammar, currentAuto, tm);
        simTables = tables;
        simReset();
        _userZoomed = false;

        // Render full automaton; reset construction sim state (steps recorded lazily on first use)
        setTimeout(() => {
          renderAutomaton(currentAuto.states, currentAuto.edges, currentGrammar.rules, currentMode);

          cSteps = [];
          cStepIdx = -1;
          cPrepared = false;
          cVisibleStates = new Set();
          cVisibleEdges = new Set();
          cVisibleItems = new Map();
          cActiveState = null;
          cActiveEdgeIdx = null;
          // Show full automaton undimmed (user can enter step mode via Construction Step)
          d3.selectAll(".node").classed("c-pending c-active", false);
          d3.selectAll("#root g.edge").classed("c-pending c-active", false);
          d3.selectAll("text.item-pending").classed("item-pending", false);
          cSetLog("");
          cSetBtns();
        }, 0);

        renderTables(currentGrammar, currentAuto, tables, currentMode, first, follow);

        // Record table construction steps (always, not just in step mode)
        try {
          const tMode = currentMode === "LR1" || currentMode === "LALR1" ? "LR1" : currentMode;
          tSteps = recordTableSteps(currentGrammar, currentAuto, tMode, follow);
          tStepIdx = -1;
          tFilled = new Set();
          // Don't enter stepping mode automatically — wait for user to press Table Step
          tClearStepping();
          tSetLog("");
          tSetBtns();
        } catch (e) {
          console.warn("table steps:", e);
          tSteps = [];
          tSetBtns();
        }
      }
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // PSEUDOCODE MODALS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // kw, sym, it, cm, hi, _la/_dot/_ra/…, pcBlock — all from shared.js SHARED:PSEUDOCODE

      // ── Closure LR(0) ─────────────────────────────────────────────
      const PC_CLOSURE0 = pcBlock(
        "Closure  (LR(0))",
        [
          {
            label: "Input",
            sym: it("I"),
            desc: "a set of LR(0) items; each item has the form [A " + _ra + " α " + _dot + " β]",
          },
          { label: "", sym: it("G"), desc: "the grammar (set of productions)" },
          {
            label: "Output",
            sym: it("J"),
            desc: "the closure of " + it("I") + ": the smallest superset of " + it("I") + " such that " + "whenever [A " + _ra + " α " + _dot + " Bβ] " + _in + " " + it("J") + " and B " + _ra + " γ " + _in + " " + it("G") + ", " + "also [B " + _ra + " " + _dot + " γ] " + _in + " " + it("J"),
          },
        ],
        `J ${_la} I
${kw("repeat")}
  ${kw("for each")} item [A ${_ra} α ${_dot} B β] ${_in} J
    ${kw("for each")} production B ${_ra} γ ${_in} G
      ${kw("if")} [B ${_ra} ${_dot} γ] ${_nin} J
        add [B ${_ra} ${_dot} γ] to J
${kw("until")} J is unchanged
${kw("return")} J`,
      );

      // ── Closure LR(1) ─────────────────────────────────────────────
      const PC_CLOSURE1 = pcBlock(
        "Closure  (LR(1))",
        [
          {
            label: "Input",
            sym: it("I"),
            desc: "a set of LR(1) items; each item has the form [A " + _ra + " α " + _dot + " β, a] where a is a terminal lookahead",
          },
          { label: "", sym: it("G"), desc: "the grammar (set of productions)" },
          {
            label: "",
            sym: "First",
            desc: "the First function — maps a symbol sequence to the set of terminals (and possibly " + _eps + ") it can begin with",
          },
          {
            label: "Output",
            sym: it("J"),
            desc: "the closure of " + it("I") + ": extended with all items [B " + _ra + " " + _dot + " γ, b] reachable by propagating lookaheads through the B-productions",
          },
        ],
        `J ${_la} I
${kw("repeat")}
  ${kw("for each")} item [A ${_ra} α ${_dot} B β, a] ${_in} J
    ${kw("for each")} production B ${_ra} γ ${_in} G
      ${kw("for each")} terminal b ${_in} First(β a)
        ${kw("if")} [B ${_ra} ${_dot} γ, b] ${_nin} J
          add [B ${_ra} ${_dot} γ, b] to J
${kw("until")} J is unchanged
${kw("return")} J`,
      );

      // ── GOTO ──────────────────────────────────────────────────────
      const PC_GOTO = pcBlock(
        "Goto",
        [
          { label: "Input", sym: it("I"), desc: "a set of items" },
          { label: "", sym: it("X"), desc: "a grammar symbol (terminal or nonterminal)" },
          {
            label: "Output",
            sym: it("J"),
            desc: "the set of items obtained by advancing the dot past " + it("X") + "; represents the transition from the current automaton state on reading " + it("X"),
          },
        ],
        `J ${_la} { [A ${_ra} α X ${_dot} β] | [A ${_ra} α ${_dot} X β] ${_in} I }
${kw("return")} Closure(J)`,
      );

      // ── ITEMS ─────────────────────────────────────────────────────
      const PC_ITEMS = pcBlock(
        "Items  (canonical collection)",
        [
          {
            label: "Input",
            sym: "G′",
            desc: "the (augmented) grammar, optionally with a fresh start production S′ " + _ra + " S",
          },
          {
            label: "Output",
            sym: it("C"),
            desc: "the canonical collection of item sets; the elements are the states of the LR characteristic automaton, and Goto gives its transitions",
          },
        ],
        `C ${_la} { Closure({ [S′ ${_ra} ${_dot} S] }) }
${kw("repeat")}
  ${kw("for each")} state I ${_in} C
    ${kw("for each")} grammar symbol X
      J ${_la} Goto(I, X)
      ${kw("if")} J ${_neq} ${_emp} and J ${_nin} C
        add J to C
${kw("until")} C is unchanged
${kw("return")} C`,
      );

      // ── LALR merge ────────────────────────────────────────────────
      const PC_LALR = pcBlock(
        "Merge  (LR(1) → LALR(1))",
        [
          { label: "Input", sym: "C₁", desc: "the canonical LR(1) collection produced by Items" },
          {
            label: "Output",
            sym: it("C"),
            desc: "the LALR(1) collection; states that share the same core (identical items, ignoring lookaheads) are merged into one state whose lookahead sets are pairwise unions. Merging can introduce reduce/reduce conflicts.",
          },
        ],
        `${kw("for each")} pair of states I, J ${_in} C₁
  ${kw("if")} core(I) = core(J)${cm("same items, different lookaheads")}
    replace I and J with a single state I ${_cup} J
    ${cm("each item's lookahead set is the union of those in I and J")}
    update all transitions to use the merged state
${kw("return")} merged collection`,
      );

      // PC_FIRST — defined in shared.js

      // ── Table construction ────────────────────────────────────────
      const PC_TABLES = pcBlock(
        "Build-Tables",
        [
          { label: "Input", sym: "G′", desc: "the (augmented) grammar" },
          { label: "", sym: it("C"), desc: "the canonical item-set collection (LR(0), LR(1), or LALR(1) states)" },
          {
            label: "Output",
            sym: "ACTION[s, a]",
            desc: "the parsing action in state s on terminal lookahead a — one of shift j, reduce A " + _ra + " β, accept, or error",
          },
          { label: "", sym: "GOTO[s, A]", desc: "the state to enter after reducing to nonterminal A in state s" },
        ],
        `${kw("for each")} state Iᵢ ${_in} C

  ${cm("Shift")}
  ${kw("if")} [A ${_ra} α ${_dot} ${it("a")} β] ${_in} Iᵢ  and  Goto(Iᵢ, ${it("a")}) = Iⱼ${cm(it("a") + " is terminal")}
    ACTION[i, a]  ${_la}  shift j

  ${cm("Reduce")}
  ${kw("if")} [A ${_ra} α ${_dot}] ${_in} Iᵢ  and  A ${_neq} S′
    ${hi("L  " + _la + "  Σ ∪ {$}")}${cm("LR(0) — reduce on every terminal")}
    ${hi("L  " + _la + "  Follow(A)")}${cm("SLR(1) — lookahead from the grammar, not the item")}
    ${hi("L  " + _la + "  { a | [A " + _ra + " α " + _dot + ", a] " + _in + " Iᵢ }")}${cm("LALR(1) / LR(1) — lookahead from the item itself")}
    ${kw("for each")} a ${_in} L
      ACTION[i, a]  ${_la}  reduce (A ${_ra} α)

  ${cm("Accept")}
  ${kw("if")} [S′ ${_ra} S ${_dot}] ${_in} Iᵢ
    ACTION[i, $]  ${_la}  accept

  ${cm("GOTO")}
  ${kw("if")} Goto(Iᵢ, ${it("A")}) = Iⱼ${cm(it("A") + " is nonterminal")}
    GOTO[i, A]  ${_la}  j

Any cell with more than one entry is a conflict:
  shift/reduce — the grammar is not LR for this mode
  reduce/reduce — two productions want to reduce on the same lookahead`,
      );

      // ── LR parsing ────────────────────────────────────────────────
      const PC_PARSING = pcBlock(
        "LR-Parse",
        [
          { label: "Input", sym: it("w"), desc: "the input token sequence, terminated with $" },
          { label: "", sym: "ACTION, GOTO", desc: "the parsing tables" },
          {
            label: "Output",
            sym: "",
            desc: "a rightmost derivation of " + it("w") + " in reverse (the sequence of productions applied), or an error report if " + it("w") + " ∉ L(G)",
          },
        ],
        `stack ${_la} [0]${cm("state stack; top at right")}
a     ${_la}  first symbol of w$

${kw("loop")}
  s ${_la} top(stack)

  ${kw("if")} ACTION[s, a] = shift t
    push t onto stack
    advance a to the next input symbol

  ${kw("else if")} ACTION[s, a] = reduce A ${_ra} β
    pop |β| states from stack
    t ${_la} top(stack)
    push GOTO[t, A] onto stack
    output the production A ${_ra} β

  ${kw("else if")} ACTION[s, a] = accept
    ${kw("return")} success

  ${kw("else")}
    error()`,
      );

      // ── Modal open/close ──────────────────────────────────────────
      function openAlgoModal(type) {
        const overlay = document.getElementById("algo-overlay");
        const titleEl = document.getElementById("algo-title");
        const subtitleEl = document.getElementById("algo-subtitle");
        const bodyEl = document.getElementById("algo-body");
        const isLR1based = currentMode === "LR1" || currentMode === "LALR1";
        const modeLabel = { LR0: "LR(0)", SLR1: "SLR(1)", LALR1: "LALR(1)", LR1: "LR(1)" }[currentMode] || "";

        if (type === "construction") {
          titleEl.textContent = "Automaton Construction";
          subtitleEl.textContent = modeLabel;
          bodyEl.innerHTML = (isLR1based ? PC_CLOSURE1 : PC_CLOSURE0) + PC_GOTO + PC_ITEMS + (currentMode === "LALR1" ? PC_LALR : "") + (isLR1based ? PC_FIRST : "");
        } else if (type === "tables") {
          titleEl.textContent = "Parsing Table Construction";
          subtitleEl.textContent = modeLabel;
          bodyEl.innerHTML = PC_TABLES + (currentMode === "SLR1" ? '<div class="pc-note">SLR(1): lookahead set L = FOLLOW(A) — computed once from the grammar, not per-state.</div>' : "") + (isLR1based ? '<div class="pc-note">LALR(1) / LR(1): lookahead set L is read directly from the LR(1) item\'s lookahead component — more precise than FOLLOW.</div>' : "");
        } else if (type === "parsing") {
          titleEl.textContent = "LR Parsing";
          subtitleEl.textContent = "all modes";
          bodyEl.innerHTML = PC_PARSING + '<div class="pc-note">The parsing algorithm is identical for LR(0), SLR(1), LALR(1), and LR(1). The modes differ only in how the ACTION/GOTO tables were constructed.</div>';
        }
        overlay.classList.remove("hidden");
        var closeBtn = overlay.querySelector(".algo-close");
        if (closeBtn) closeBtn.focus(); else overlay.focus();
      }

      // closeAlgoModal — defined in shared.js

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAlgoModal();
      });


      // Arrow-key stepping comes from shared.js (registerStepper): the panel with key focus
      // (tinted header) steps; click a panel or press T to move it.
      registerStepper("p-automaton", { step: cStep, back: cBack, reset: cReset, end: cRunAll }, { primary: true });
      registerStepper("p-tables", { step: tStep, back: tBack, reset: tReset, end: tRunAll });
      registerStepper("p-tree", { step: simStep, back: simBack, reset: simReset, end: simRunAll });

      window.addEventListener("load", () => {
        loadPanelState();
        initAlgoModal();
        loadExamplesInto("examples.json", "examples-select", EXAMPLES);
        try { const m = localStorage.getItem("lr-tool-mode"); if (m) setMode(m); } catch (e) {}
        try { const d = localStorage.getItem("lr-tool-layout"); if (d) { cLayoutDir = d; applyLayoutBtn(); } } catch (e) {}
        applyShareState();
        if (!document.getElementById("grammar-input").value.trim()) document.getElementById("grammar-input").value = "S -> E\nE -> E + T | T\nT -> id";
        build();
        // Tree zoom is already initialised above via d3.select('#tree-svg').call(_treeZoom)
        // Auto-rebuild while editing (debounced so partial input doesn't spam errors)
        let _rebuildTimer = null;
        document.getElementById("grammar-input").addEventListener("input", () => {
          clearTimeout(_rebuildTimer);
          _rebuildTimer = setTimeout(build, 400);
        });
        UI.stringInput("sim-input", {
          random: randomSentence,
          examples: () => sampleSentences(6),
          heading: "Random sentences",
          onPick: () => { saveShare(); simReset(); },
        });
        // Clear sim immediately on each keystroke; re-initialize after typing pauses
        let _simInputTimer = null;
        document.getElementById("sim-input").addEventListener("input", () => {
          saveShare();
          simClear();
          clearTimeout(_simInputTimer);
          _simInputTimer = setTimeout(simReset, 300);
        });
      });
    </script>
  </body>
</html>
